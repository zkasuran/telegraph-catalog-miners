{
  "name": "Vendor source and general preference development",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "owner_attempt": {
          "description": "Exact owner attempt identifier",
          "required": true,
          "type": "string"
        },
        "mode": {
          "description": "Source contracts or real general preference development",
          "required": true,
          "type": "choice",
          "options": [
            "source",
            "train"
          ],
          "default": "source"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "source_checks": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Install pinned source linter",
          "run": "python3 -m pip install --disable-pip-version-check --no-input ruff==0.15.18"
        },
        {
          "name": "Run actual packaged source gate",
          "env": {
            "OWNER_ATTEMPT": "${{ inputs.owner_attempt }}",
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "python3 -W error verification/owners/vendor_verify/ci.py --out source-proof"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "vendor-source-proof",
            "path": "source-proof/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "if": "${{ inputs.mode != 'train' }}"
    },
    "preference_training": {
      "if": "${{ inputs.mode == 'train' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 350,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Install hash-pinned CPU dependencies",
          "run": "python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/vendor_verify/preference/requirements.lock"
        },
        {
          "name": "Audit all pinned dependencies",
          "run": "python3 verification/owners/vendor_verify/preference/audit_dependencies.py --lock verification/owners/vendor_verify/preference/requirements.lock --out \"${{ runner.temp }}/vendor-audit-input.txt\" --report \"${{ runner.temp }}/vendor-dependency-audit.json\""
        },
        {
          "name": "Train real general preference model",
          "env": {
            "OWNER_ATTEMPT": "${{ inputs.owner_attempt }}",
            "PYTHONDONTWRITEBYTECODE": "1",
            "OPENBLAS_NUM_THREADS": "4"
          },
          "run": "python3 -W error verification/owners/vendor_verify/preference/remote.py"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "vendor-general-development",
            "if-no-files-found": "error",
            "retention-days": 7,
            "path": "${{ runner.temp }}/vendor-dependency-audit.json\n${{ runner.temp }}/vendor-general-preference/development-result.json\n${{ runner.temp }}/vendor-general-preference/development-failure.json\n${{ runner.temp }}/vendor-general-preference/dataset-gate.json\n${{ runner.temp }}/vendor-general-preference/tokenizer-check.json\n${{ runner.temp }}/vendor-general-preference/training-filter.json\n${{ runner.temp }}/vendor-general-preference/retained-tokenizer-check.json\n${{ runner.temp }}/vendor-general-preference/filtered-dataset-gate.json\n${{ runner.temp }}/vendor-general-preference/training-baseline-report.json\n${{ runner.temp }}/vendor-general-preference/frozen-training-baseline.tar.gz\n${{ runner.temp }}/vendor-general-preference/SELECTED-CHECKPOINT.json\n${{ runner.temp }}/vendor-general-preference/selected-adapter.tar.gz\n${{ runner.temp }}/vendor-general-preference/frozen-head-development.json"
          }
        }
      ]
    }
  }
}
