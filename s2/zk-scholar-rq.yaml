version: "1"
kind: miner
id: 77326
slug: zk-scholar-rq
protocol: generic
name: ZK Scholar Research
description: >
  Source-grounded research excerpts and exact DOI metadata. Crossref and OpenAlex
   bibliographic cross-checks; exact-DOI and topical licensed article conclusions; intact
  Wikipedia excerpts. Returns explicit uncertainty and never invents findings.
base_url: https://telegraph-scholar.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /research
    external_path: /research
    method: GET
    description: Return a source-grounded answer to the actual research question.
    intents: [RESEARCH_QUERY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            description: The complete canonical research question, copied verbatim.
            intents: [RESEARCH_QUERY_GENERAL]
input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
      description: The complete research question, copied verbatim.
output_schema:
  type: object
  required: [answer, brief, source_count, sources]
  properties:
    answer: {type: string}
    brief: {type: string, maxLength: 80}
    source_count: {type: integer, minimum: 0, maximum: 1000}
    sources:
      type: array
      items: {type: string}
    confidence: {type: number, minimum: 0, maximum: 1}
intent_mapping:
  RESEARCH_QUERY_GENERAL:
    endpoint: /research
    input:
      question:
        from: question
        how: Copy the full canonical question verbatim without summarizing it.
    output:
      answer: {path: answer}
      brief: {path: brief}
      source_count: {path: source_count}
      sources: {path: sources}
semantics:
  signal_mapping:
    label_field: answer
    reason_field: answer
    confidence_field: confidence
  supported_intents: [RESEARCH_QUERY_GENERAL]
