version: "1"
kind: miner
id: 7317615
slug: zk-sensor-coastal
protocol: generic
name: ZK Publisher-backed Coastal and Sensor Observations
description: >
  Original numeric publisher observations for explicitly identified Sensor.Community
  sensors, NOAA NDBC buoys, NWS stations, USGS sites and NOAA CO-OPS stations.
  CO-OPS water levels require an explicit vertical datum, such as water level MLLW.
  Reports station barometric pressure, air and water temperature, and wind speed,
  gust and direction with source units and timestamps. Preserves preliminary
  flags, outlier counts and USGS method identities. No model-generated readings,
  invented calibration assurance or measurement for an unidentified device.
base_url: https://telegraph-tele.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 0
docs:
  documentation: https://telegraph-tele.margyn.workers.dev/
errors:
  message_path: summary
  code_path: error
  status_path: ok
  success_values: ["true"]
input_schema:
  type: object
  required: [sensor, metric]
  properties:
    sensor:
      type: string
      maxLength: 256
      description: Exactly one explicit publisher/device identity, e.g. NOAA CO-OPS station 8518750.
    metric:
      type: string
      maxLength: 256
      description: One quantity, e.g. water level MLLW, air temperature Fahrenheit, barometric pressure Pa or wind speed m/s. USGS gage height requires method identification when ambiguous.
output_schema:
  type: object
  properties:
    sensor: {type: string}
    metric: {type: string}
    value: {type: number}
    unit: {type: string}
    observed_at: {type: string, format: date-time}
    summary: {type: string}
    ok: {type: boolean}
endpoints:
  - path: /sensor-telemetry-verify
    external_path: /sensor-telemetry-verify
    method: GET
    intents: [SENSOR_TELEMETRY_VERIFY_GENERAL]
    description: One publisher-reported sensor quantity, preserving scope, units, datum, age and quality. No value for missing/stale/ambiguous data.
    params:
      query:
        required:
          - name: sensor
            type: string
            intents: [SENSOR_TELEMETRY_VERIFY_GENERAL]
            description: Exactly one explicit supported public publisher and device identifier; at most 256 UTF-8 bytes.
          - name: metric
            type: string
            intents: [SENSOR_TELEMETRY_VERIFY_GENERAL]
            description: Exactly one quantity and optional supported unit. CO-OPS water level requires explicit datum; at most 256 UTF-8 bytes.
semantics:
  signal_mapping: {label_field: summary, reason_field: summary}
  supported_intents: [SENSOR_TELEMETRY_VERIFY_GENERAL]
intent_mapping:
  SENSOR_TELEMETRY_VERIFY_GENERAL:
    endpoint: /sensor-telemetry-verify
    input:
      sensor: {from: sensor}
      metric: {from: metric}
    output:
      sensor: {path: sensor}
      metric: {path: metric}
      value: {path: value}
      unit: {path: unit}
      observed_at: {path: observed_at}
