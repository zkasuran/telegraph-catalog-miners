version: "1"
kind: miner
id: 7373
slug: verifywire-liquidity-depth
protocol: generic
name: VerifyWire Liquidity Depth
description: >
  Bid-ask spread, book depth and the slippage a stated trade size would incur for a named
  market. A crypto pair is walked on the Kraken public order book, so the spread, the depth
  within two percent of mid and the average fill price are live reads. When a chain is named
  the WETH/USDC style pool is quoted on the Uniswap v3 QuoterV2 contract over public RPC, so
  the slippage is the pool's own answer. Answers the LIQUIDITY_DEPTH_VERIFY intent. No API
  key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: pair is a market such as BTC/USD or ETH/USD (or WETH/USDC with a chain for an on-chain pool). size is the trade size in the base asset. Defaults to BTC/USD when unfilled.
    param: pair
    property: length
    value_num: 60
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is the bid-ask spread
        and slippage on a 50 ETH sell into the WETH/USDC pool on Base?". The miner reads the
        pair, size and any chain from it, so passing the whole question works as well as the
        structured fields.
    pair:
      type: string
      description: Market or pair, for example BTC/USD or WETH/USDC.
    size:
      type: number
      description: Trade size in the base asset, for the slippage estimate.
    chain:
      type: string
      description: Chain for an on-chain pool quote, for example base. Omit for a centralized book.

output_schema:
  type: object
  properties:
    venue:
      type: string
      description: Kraken for a book, Uniswap v3 for an on-chain pool.
    pair:
      type: string
      description: The market the answer is for.
    market_type:
      type: string
      description: central limit order book or on-chain AMM pool.
    mid_price:
      type: number
      description: Mid price for a book quote.
    spread:
      type: number
      description: Ask minus bid for a book quote.
    spread_bps:
      type: number
      description: Spread in basis points of the mid.
    trade_size:
      type: number
      description: The trade size the slippage is for.
    slippage_percent:
      type: number
      description: Slippage of the stated size against mid or spot, as a percentage.
    confidence:
      type: number
      description: 0.96 for a book quote, 0.95 for an on-chain pool quote.
    summary:
      type: string
      description: One sentence with the spread, the depth and the slippage for the size.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /depth
    external_path: /depth
    method: GET
    description: >
      Depth for one market as query parameters (?pair=BTC/USD&size=5) or an on-chain pool
      (?pair=WETH/USDC&chain=base&size=50). Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: pair
        description: The market the answer is for.
        source_path: pair
      - index: 1
        name: venue
        description: Kraken for a book, Uniswap v3 for an on-chain pool.
        source_path: venue
      - index: 2
        name: summary
        description: One sentence with the spread, the depth and the slippage for the size.
        source_path: summary
    integers:
      - index: 0
        name: spread_bps_x1000
        description: Spread in basis points, scaled by one thousand.
        source_path: spread_bps
        multiplier: 1000
      - index: 1
        name: slippage_percent_x10000
        description: Slippage as a percentage, scaled by ten thousand to keep four decimals.
        source_path: slippage_percent
        multiplier: 10000
  request:
    - endpoint: depth
      method: GET
      query_params:
        pair: { source: strings.0 }
