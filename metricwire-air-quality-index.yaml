version: "1"
kind: miner
id: 7445
slug: metricwire-air-quality-index
protocol: generic
name: MetricWire Air Quality Index
description: >
  The US EPA air quality index for a place, computed live from the nearest Sensor.Community citizen
  particulate sensors (Open Database Licence). The official AQI feeds need an API key or bar
  commercial reuse, so this keyless paid miner computes the index from open PM2.5 and PM10 readings
  instead. It says they are instantaneous nowcast values rather than a 24-hour regulatory mean. The
  AQI, its category and the driving pollutant are reported. Answers the AIR_QUALITY_INDEX intent.
base_url: https://telegraph-metric.margyn.workers.dev

docs:
  documentation: https://telegraph-metric.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: city is a place name. Pass lat and lon for any point. A whole question is accepted too. Defaults to Berlin. Coverage follows Sensor.Community, which is densest across Europe.
    param: city
    property: length
    value_num: 64
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is the air quality index in
        Berlin?". The miner reads the place from it.
    city:
      type: string
      description: Place name, for example Berlin, Paris or Delhi.
    lat:
      type: number
      description: Latitude for a precise point, used with lon.
    lon:
      type: number
      description: Longitude for a precise point, used with lat.

output_schema:
  type: object
  properties:
    location:
      type: string
      description: The place the index is for.
    aqi:
      type: number
      description: The US EPA air quality index, the higher of the PM2.5 and PM10 sub-indices.
    category:
      type: string
      description: The AQI category, for example Good, Moderate or Unhealthy.
    dominant_pollutant:
      type: string
      description: The pollutant driving the index, PM2.5 or PM10.
    pm25_ug_m3:
      type: number
      description: Median PM2.5 concentration from nearby sensors, micrograms per cubic metre.
    pm10_ug_m3:
      type: number
      description: Median PM10 concentration from nearby sensors, micrograms per cubic metre.
    confidence:
      type: number
      description: 0.8 for a nowcast from citizen sensors, lower when no sensor is nearby.
    summary:
      type: string
      description: One sentence with the AQI, its category and the driving pollutant concentration.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /aqi
    external_path: /aqi
    method: GET
    description: >
      The air quality index for a place as a query parameter (?city=Berlin) or a point
      (?lat=52.52&lon=13.405). Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - AIR_QUALITY_INDEX

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: location
        description: The place the index is for.
        source_path: location
      - index: 1
        name: category
        description: The AQI category.
        source_path: category
      - index: 2
        name: summary
        description: One sentence with the AQI, its category and the driving pollutant.
        source_path: summary
    integers:
      - index: 0
        name: aqi
        description: The US EPA air quality index.
        source_path: aqi
        multiplier: 1
      - index: 1
        name: pm25_ug_m3_x10
        description: Median PM2.5 concentration, scaled by ten to keep one decimal.
        source_path: pm25_ug_m3
        multiplier: 10
  request:
    - endpoint: aqi
      method: GET
      query_params:
        city: { source: strings.0 }
