version: "1"
kind: miner
id: 7376
slug: verifywire-cross-chain-state
protocol: generic
name: VerifyWire Cross Chain State Verify
description: >
  Reads the same piece of state on several chains and reports whether they agree, every figure a
  live read over public RPC. Give a token symbol or address and the miner reconciles its
  totalSupply across the chains that list it, with the per-chain figures, the multichain aggregate
  and the chain holding the most. Give a to and data pair with a chains list and it compares a raw
  view call byte for byte across those chains. A chain that does not answer is named as
  unreachable rather than failing the read. Reads on Ethereum, Base, Arbitrum, Optimism and
  Polygon. Answers the CROSS_CHAIN_STATE_VERIFY intent. No API key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: name a token symbol or address to reconcile its supply across chains. A view call also works by passing a to and data pair with a chains list to compare a raw return. chains defaults to the chains that list the token.
    param: token
    property: length
    value_num: 80
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Is USDC supply consistent
        across Ethereum, Base and Arbitrum?". The miner reads the token and the chains from it, so
        passing the whole question works as well as the fields.
    token:
      type: string
      description: Token symbol or address to reconcile across chains.
    chains:
      type: string
      description: Comma-separated chains to read on, for example ethereum,base,arbitrum.
    to:
      type: string
      description: Contract address for a raw view call comparison.
    data:
      type: string
      description: Calldata (0x...) for a raw view call comparison.

output_schema:
  type: object
  properties:
    mode:
      type: string
      description: Which comparison was run, one of token_supply, view_call.
    symbol:
      type: string
      description: The token symbol, when reconciling a supply.
    chains_verified:
      type: integer
      description: How many chains returned a value.
    aggregate_supply:
      type: number
      description: The combined supply across the chains that answered.
    identical:
      type: boolean
      description: Whether a raw view call returned the same value on every chain.
    verified:
      type: boolean
      description: True when at least two chains answered consistently.
    confidence:
      type: number
      description: 0.97 when two or more chains answered, lower otherwise.
    summary:
      type: string
      description: One sentence with the verdict and the per-chain figures.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /crosschain
    external_path: /crosschain
    method: GET
    description: >
      Reconcile state across chains as query parameters
      (?token=USDC&chains=ethereum,base,arbitrum or ?to=0x..&data=0x..&chains=ethereum,base).
      Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: mode
        description: Which comparison was run.
        source_path: mode
      - index: 1
        name: symbol
        description: The token symbol, when reconciling a supply.
        source_path: symbol
      - index: 2
        name: summary
        description: One sentence with the verdict and the per-chain figures.
        source_path: summary
    integers:
      - index: 0
        name: chains_verified
        description: How many chains returned a value.
        source_path: chains_verified
        multiplier: 1
  request:
    - endpoint: crosschain
      method: GET
      query_params:
        token: { source: strings.1 }
