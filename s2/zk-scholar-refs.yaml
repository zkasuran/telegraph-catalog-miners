version: "1"
kind: miner
id: 78326817
slug: zk-scholar-refs
protocol: generic
name: ScholarWire Source-Grounded Research
description: >
  RESEARCH_QUERY_GENERAL answers from fetched public records and licensed excerpts.
  Exact DOI checks, listed-author positions, separately scoped Crossref/OpenAlex
  citation and reference counts, and bounded deposited/indexed reference identifiers.
  Unavailable evidence, ambiguity and omissions are explicit.
base_url: https://telegraph-scholar.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors: {message_path: detail, code_path: error}
endpoints:
  - path: /research
    external_path: /research
    method: GET
    description: >
      Copy the complete canonical question verbatim. Reference requests with an
      exact DOI return index-specific counts or at most 20 reference identifiers
      per index. This is not a complete bibliography; reference titles and authors
      are not resolved. OpenAlex supplies work IDs, Crossref supplies deposited DOIs.
      First/last author means list position only. Historical windows, global totals
      and mixed citation/reference requests are unsupported. Inspect status,
      uncertainty and brief_limitation for partial answers.
    intents: [RESEARCH_QUERY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            description: >
              Actual complete research question, verbatim, at most 2048 UTF-8 bytes.
              Preserve DOI, title, position and index qualifiers.
            intents: [RESEARCH_QUERY_GENERAL]
input_schema:
  type: object
  required: [question]
  properties:
    question: {type: string, minLength: 1, maxLength: 2048}
output_schema:
  type: object
  required: [answer, brief, source_count, sources]
  properties:
    answer: {type: string, description: One-paragraph source-attributed answer.}
    brief: {type: string, maxLength: 80, description: Bounded sentence; inspect brief_limitation.}
    source_count: {type: integer, minimum: 0, maximum: 1000}
    sources: {type: array, items: {type: string}}
intent_mapping:
  RESEARCH_QUERY_GENERAL:
    endpoint: /research
    input:
      question:
        from: question
        how: Copy the complete canonical question verbatim without summarizing it.
    output:
      answer: {path: answer}
      brief: {path: brief}
      source_count: {path: source_count}
      sources: {path: sources}
semantics:
  signal_mapping: {label_field: answer, reason_field: answer}
  supported_intents: [RESEARCH_QUERY_GENERAL]
