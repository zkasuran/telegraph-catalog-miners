version: '1'
kind: miner
id: 78221
slug: zk-websources
protocol: generic
name: Revision-linked Wikipedia Source Search
description: Keyless English Wikipedia source discovery with live article extracts,
  URLs and revision metadata. Uses one grouped MediaWiki search call and preserves
  its relevance order. Covers public-source topic searches, with a clear single-publisher
  limit and no claim of latest-event verification.
base_url: https://telegraph-s2-websources.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://www.mediawiki.org/wiki/API:Search
limitations:
- code: MAX_PARAM_SIZE
  message: query must be non-empty, contain no control characters and fit in 256 UTF-8
    bytes.
  param: query
  property: size_bytes
  value_bytes: 256
  operator: lte
rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: summary
  code_path: code
  status_path: status
  success_values:
  - ok
  - no_results
endpoints:
- path: /web-search
  external_path: /web-search
  method: GET
  description: Search English Wikipedia for the exact supplied topic or source-discovery
    request. Pass the canonical query unchanged. Returns the written result list as
    answer, article URLs as sources and an at-most-80-character brief identifying
    the leading source. Includes revision URLs and article edit times. Not a real-time
    news or whole-web index.
  intents:
  - WEB_SEARCH_GENERAL
  params:
    query:
      required:
      - name: query
        type: string
        intents:
        - WEB_SEARCH_GENERAL
        description: Canonical search query, verbatim, up to 256 UTF-8 bytes. Keep
          names and qualifiers. Do not supply an invented default.
input_schema:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 256
output_schema:
  type: object
  required:
  - answer
  - sources
  - brief
  - summary
  - status
  - source
  - as_of
  properties:
    answer:
      type:
      - string
      - 'null'
    sources:
      type: array
      items:
        type: string
    brief:
      type:
      - string
      - 'null'
      maxLength: 80
    summary:
      type: string
    status:
      type: string
      enum:
      - ok
      - no_results
      - unavailable
    source:
      type: string
    as_of:
      type:
      - string
      - 'null'
    confidence:
      type: number
      minimum: 0
      maximum: 1
    results:
      type: array
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents:
  - WEB_SEARCH_GENERAL
intent_mapping:
  WEB_SEARCH_GENERAL:
    endpoint: /web-search
    input:
      query:
        from: query
        how: Copy the canonical query verbatim, preserving names and qualifiers.
    output:
      answer:
        path: answer
      sources:
        path: sources
      brief:
        path: brief
