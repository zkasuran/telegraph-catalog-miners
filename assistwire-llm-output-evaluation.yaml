version: "1"
kind: miner
id: 7441
slug: assistwire-llm-output-evaluation
protocol: generic
name: AssistWire LLM Output Evaluation
description: >
  LLM_OUTPUT_EVALUATION answers for queries that supply a generative model's output and ask for it
  to be judged, produced by a language model at request time. Send the model output with the prompt
  it answered and any cited sources or reference. The miner returns a judgement of factual
  accuracy, citation support, hallucination, tone and safety, with an overall verdict and the
  reasons. The answer is produced with MiniMax under a commercial plan held by the operator, so
  this miner is not keyless. Serves the LLM_OUTPUT_EVALUATION intent.
base_url: https://telegraph-assist.margyn.workers.dev

docs:
  documentation: https://telegraph-assist.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the model output and the question about it. A single output, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language query, verbatim, carrying the model output and the question about
        it, for example 'Here is a model answer and its sources: rate it for factual accuracy and
        hallucination.'. The miner reads what to judge from it.
    text:
      type: string
      description: The model output and the question about it, if supplied on its own.
    output:
      type: string
      description: The model output to evaluate, an alternative name for the text.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the evaluation, a short label for a reader.
    summary:
      type: string
      description: The judgement of the model output across the dimensions the query raises.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /evaluate-output
    external_path: /evaluate-output
    method: GET
    description: >
      Evaluate one model output, the output and the question as a query parameter (?text=...). Also
      accepts a whole question in ?question= or ?query= or the output in ?output=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - LLM_OUTPUT_EVALUATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the evaluation.
        source_path: headline
      - index: 1
        name: summary
        description: The judgement of the model output.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: evaluate-output
      method: GET
      query_params:
        text: { source: strings.1 }
