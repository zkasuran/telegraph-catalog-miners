version: "1"
kind: miner
id: 7612
slug: telewire-sensor-telemetry-verify
protocol: generic
name: TeleWire Sensor Telemetry Verify
description: >
  Sensor telemetry check, answered by a language model at request time over the data in the
  request. The readings are supplied in the question (temperature, pressure, vibration,
  voltage, current, flow, level, humidity, gas concentration or position) with the expected
  range or calibration and the miner returns a clear verdict (within range, out of range,
  anomalous or insufficient information) naming the reading that decides it, its value, the
  threshold and the margin or breach and flags a reading that is physically implausible or
  stuck. It judges only on the numbers given, so no device feed is called. The answer is
  produced with MiniMax under a commercial plan held by the operator, so this miner is not
  keyless. Serves the SENSOR_TELEMETRY_VERIFY intent.
base_url: https://telegraph-tele.margyn.workers.dev

docs:
  documentation: https://telegraph-tele.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the sensor readings and the expected range. Passing the whole question verbatim works too. A single passage, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: The full natural-language question, verbatim. The miner reads the subject from it, so passing the whole question works as well as passing the subject on its own.
    query:
      type: string
      description: The subject to assess, if sent on its own rather than inside a question.
    text:
      type: string
      description: The subject text to assess.
    data:
      type: string
      description: The sensor readings to check.
    readings:
      type: string
      description: The sensor readings and the expected range.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of within range, out of range, anomalous or insufficient information.
    summary:
      type: string
      description: "The answer the node grades: the verdict or figure followed by one or two sentences of reasoning."
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /sensor-telemetry-verify
    external_path: /sensor-telemetry-verify
    method: GET
    description: >
      Telemetry check for one sensor set, the readings as a query parameter (?question=...). Also
      accepts ?query=, ?text=, ?data= or ?readings=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - SENSOR_TELEMETRY_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The full graded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: sensor-telemetry-verify
      method: GET
      query_params:
        question: { source: strings.1 }
