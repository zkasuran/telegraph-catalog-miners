version: "1"
kind: miner
id: 74073
slug: zk-byte-forensic
protocol: generic
name: Verified Media Byte Evidence
description: >-
  Inspect actual public media bytes and exact publisher asset records, with no
  generated analysis. Reports SHA-256, file signature, container dimensions,
  JPEG markers and EXIF, PNG chunks and CRC, WebP chunks, or top-level ISO BMFF
  boxes. Matching NASA Image Library assets also receive verbatim publisher
  descriptions with attribution. These observations do not establish authenticity;
  the verdict is Inconclusive and confidence is zero (not empirically calibrated).
  Pixel-level splicing, AI detection, audio/video decoding, and provenance
  signature validation are not performed. Unsupported media abstain.
base_url: https://telegraph-vision.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  status_path: status
  success_values: [byte_inspection_completed]
  code_path: reason_code
  message_path: summary
endpoints:
  - path: /media-forensic-source
    external_path: /media-forensic-source
    method: GET
    description: >-
      Supply the exact public HTTPS media_url (up to 4000 characters). Fetches at
      most 8 MiB, limits redirects and fetch time, and returns observed file-level
      findings with sources. Untrusted metadata and unverified authenticity are
      explicitly distinguished from actual byte observations.
    intents: [MEDIA_FORENSIC_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: media_url
            type: string
            intents: [MEDIA_FORENSIC_VERIFY_GENERAL]
            description: Exact public HTTPS media URL, at most 4000 characters.
input_schema:
  type: object
  required: [media_url]
  properties:
    media_url: {type: string, maxLength: 4000}
output_schema:
  type: object
  properties:
    verdict: {type: string, enum: [Inconclusive]}
    findings: {type: array, items: {type: string}}
    confidence: {type: number, minimum: 0, maximum: 0}
    summary: {type: string}
    status: {type: string, enum: [byte_inspection_completed, unverified]}
    file: {type: object}
    sources: {type: array, items: {type: object}}
intent_mapping:
  MEDIA_FORENSIC_VERIFY_GENERAL:
    endpoint: /media-forensic-source
    input:
      media_url: {from: media_url}
    output:
      verdict: {path: verdict}
      findings: {path: findings}
      confidence: {path: confidence, unit: "fraction (0-1)"}
      summary: {path: summary}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [MEDIA_FORENSIC_VERIFY_GENERAL]
