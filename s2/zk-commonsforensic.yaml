version: '1'
kind: miner
id: 79314
slug: zk-commonsforensic
protocol: generic
name: Commons Forensic — Exact-Byte Publisher Edit Records
description: Fetches actual image, audio or video bytes and binds them to Wikimedia Commons catalogue checksums and human-authored
  file-page revisions. Reports specific publisher-declared edits, with verbatim evidence, artist attribution, licences and
  retrieval timestamps. Explicit retouching or creator-declared photomontage yields Likely manipulated; missing declarations,
  mismatches and unavailable sources yield Inconclusive. Confidence is zero as an explicit unestimated value, not a calibrated
  manipulation probability. Independent of C2PA, container metadata readers, NASA catalogue sources and paid vision models.
base_url: https://telegraph-s2-commonsforensic.margyn.workers.dev
docs:
  documentation: https://telegraph-s2-commonsforensic.margyn.workers.dev/
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 60
limitations:
- code: MAX_PARAM_VALUE
  message: Public HTTPS media URL without credentials, fragment, custom port or IP literal; at most 4000 characters.
  param: media_url
  property: length
  value_num: 4000
  operator: lte
errors:
  message_path: error
endpoints:
- path: /forensic
  external_path: /forensic
  method: GET
  description: Fetch the exact public HTTPS media_url, up to 12 MiB and two validated redirects. Match actual SHA-1 and byte
    count against Wikimedia Commons file records. Return qualifying explicit publisher edit declarations with page-revision
    evidence and attribution. Catalogue/category absence does not establish authenticity. This is catalogue-assisted media
    forensics, with no pixel-level synthesis detector or empirically calibrated confidence.
  intents:
  - MEDIA_FORENSIC_VERIFY_GENERAL
  params:
    query:
      required:
      - name: media_url
        type: string
        intents:
        - MEDIA_FORENSIC_VERIFY_GENERAL
        description: Exact direct public HTTPS URL of image, audio or video; maximum 4000 characters and 12 MiB.
input_schema:
  type: object
  required:
  - media_url
  properties:
    media_url:
      type: string
      pattern: ^https://
      maxLength: 4000
output_schema:
  type: object
  required:
  - verdict
  - findings
  - confidence
  - summary
  - source
  - as_of
  properties:
    verdict:
      type: string
      enum:
      - Authentic
      - Likely authentic
      - Manipulated
      - Likely manipulated
      - Inconclusive
    findings:
      type: array
      items:
        type: object
    confidence:
      type: number
      minimum: 0
      maximum: 1
    summary:
      type: string
    source:
      type: array
      items:
        type: object
    as_of:
      type: string
intent_mapping:
  MEDIA_FORENSIC_VERIFY_GENERAL:
    endpoint: /forensic
    input:
      media_url:
        from: media_url
    output:
      verdict:
        path: verdict
      findings:
        path: findings
      confidence:
        path: confidence
        unit: fraction (0-1)
      summary:
        path: summary
semantics:
  signal_mapping:
    label_field: verdict
    confidence_field: confidence
    reason_field: summary
  supported_intents:
  - MEDIA_FORENSIC_VERIFY_GENERAL
