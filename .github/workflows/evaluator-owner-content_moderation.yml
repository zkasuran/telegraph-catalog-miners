{
  "name": "Bounded moderation schedule diagnostic",
  "run-name": "Qualified M2 candidate release or exact serving",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "type": "choice",
          "options": [
            "expanded",
            "serve",
            "aegis"
          ],
          "default": "expanded",
          "required": true
        },
        "campaign_exclusions_json": {
          "type": "string",
          "default": "[]",
          "required": true
        },
        "package_url": {
          "type": "string",
          "default": ""
        },
        "package_sha256": {
          "type": "string",
          "default": ""
        },
        "package_keccak": {
          "type": "string",
          "default": ""
        },
        "report_url": {
          "type": "string",
          "default": ""
        },
        "report_sha256": {
          "type": "string",
          "default": ""
        },
        "slot": {
          "type": "string",
          "default": ""
        },
        "forward_port": {
          "type": "string",
          "default": ""
        },
        "runnable_url": {
          "type": "string",
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "owner-content-moderation-${{ inputs.mode }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "owner": {
      "if": "github.repository == 'zkasuran/telegraph-catalog-miners' && github.event.repository.private == false && inputs.mode != 'aegis'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONHASHSEED": "42",
        "TOKENIZERS_PARALLELISM": "false",
        "OMP_NUM_THREADS": "4",
        "MKL_NUM_THREADS": "4",
        "HF_HUB_OFFLINE": "1",
        "CUDA_VISIBLE_DEVICES": "",
        "DIAGNOSTIC_PUBLIC_REPOSITORY": "true",
        "CAMPAIGN_EXCLUSIONS_JSON": "${{ inputs.campaign_exclusions_json }}",
        "PACKAGE_URL": "${{ inputs.package_url }}",
        "PACKAGE_SHA256": "${{ inputs.package_sha256 }}",
        "PACKAGE_KECCAK": "${{ inputs.package_keccak }}",
        "REPORT_URL": "${{ inputs.report_url }}",
        "REPORT_SHA256": "${{ inputs.report_sha256 }}",
        "SLOT": "${{ inputs.slot }}",
        "FORWARD_PORT": "${{ inputs.forward_port }}",
        "RUNNABLE_URL": "${{ inputs.runnable_url }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "verification/owners/content_moderation\n.github/workflows",
            "sparse-checkout-cone-mode": true
          }
        },
        {
          "name": "Standalone source and verdict-role failure gate",
          "timeout-minutes": 5,
          "run": "bash verification/owners/content_moderation/verify.sh"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.25.7",
            "cache": false
          }
        },
        {
          "name": "Hash-locked CPU dependencies and advisory audit",
          "if": "inputs.mode == 'expanded'",
          "timeout-minutes": 15,
          "run": "python3 -m venv \"$RUNNER_TEMP/cm-venv\"\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/content_moderation/support/training/requirements.lock\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip check\n\"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/support/training/audit.py --lock verification/owners/content_moderation/support/training/requirements.lock --out \"$RUNNER_TEMP/cm-audit.txt\" --report \"$RUNNER_TEMP/cm-audit.json\""
        },
        {
          "name": "Full-inventory M2 fit and fresh reference-engine audit",
          "if": "inputs.mode == 'expanded'",
          "timeout-minutes": 295,
          "run": "timeout --signal=TERM --kill-after=20s 17520 \"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/expanded_remote.py run --root \"$RUNNER_TEMP/cm-training\""
        },
        {
          "name": "Preserve upstream-granted checkpoints",
          "if": "always() && inputs.mode == 'expanded'",
          "timeout-minutes": 5,
          "run": "python3 verification/owners/content_moderation/support/moderation-diagnostic/preserve_all.py --root \"$RUNNER_TEMP/cm-training\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always() && inputs.mode == 'expanded'",
          "with": {
            "name": "owner-diagnostics-content_moderation-${{ github.run_id }}",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/cm-training/evidence/\n${{ runner.temp }}/cm-audit.json"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "success() && inputs.mode == 'expanded'",
          "with": {
            "name": "owner-registration-content_moderation-${{ github.run_id }}",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/cm-training/evidence/registration-ready.json\n${{ runner.temp }}/cm-training/evidence/CONTENT_MODERATION.safetensors\n${{ runner.temp }}/cm-training/evidence/CONTENT_MODERATION.safetensors.parser.json\n${{ runner.temp }}/cm-training/evidence/CONTENT_MODERATION.safetensors.score-bits.json\n${{ runner.temp }}/cm-training/evidence/UNTRAINED.safetensors.parser.json\n${{ runner.temp }}/cm-training/evidence/UNTRAINED.safetensors.score-bits.json\n${{ runner.temp }}/cm-training/evidence/source-manifest.json\n${{ runner.temp }}/cm-training/evidence/baseline-coefficients.json\n${{ runner.temp }}/cm-training/evidence/candidate-freeze.json\n${{ runner.temp }}/cm-training/evidence/selection.json\n${{ runner.temp }}/cm-training/evidence/class-snapshot.json\n${{ runner.temp }}/cm-training/evidence/audit-tokenizer-check.json\n${{ runner.temp }}/cm-training/evidence/audit-freeze.json\n${{ runner.temp }}/cm-training/evidence/training-format-gates.json"
          }
        },
        {
          "name": "Prepare exact immutable serving bytes and restricted lease",
          "if": "inputs.mode == 'serve'",
          "timeout-minutes": 25,
          "run": "timeout --signal=TERM --kill-after=20s 1440 python3 verification/owners/content_moderation/serve.py prepare --root \"$RUNNER_TEMP/cm-serving\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "inputs.mode == 'serve'",
          "with": {
            "name": "owner-lease-content_moderation-${{ github.run_id }}",
            "retention-days": 1,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/cm-serving/lease.json"
          }
        },
        {
          "name": "Keep exact reference endpoint alive through restricted forwarding",
          "if": "inputs.mode == 'serve'",
          "timeout-minutes": 300,
          "run": "timeout --signal=TERM --kill-after=20s 17880 python3 verification/owners/content_moderation/serve.py hold --root \"$RUNNER_TEMP/cm-serving\""
        }
      ]
    },
    "aegis_fit": {
      "if": "github.repository == 'zkasuran/telegraph-catalog-miners' && github.event.repository.private == false && inputs.mode == 'aegis'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONHASHSEED": "42",
        "TOKENIZERS_PARALLELISM": "false",
        "OMP_NUM_THREADS": "4",
        "MKL_NUM_THREADS": "4",
        "HF_HUB_OFFLINE": "1",
        "CUDA_VISIBLE_DEVICES": "",
        "DIAGNOSTIC_PUBLIC_REPOSITORY": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "verification/owners/content_moderation\n.github/workflows",
            "sparse-checkout-cone-mode": true
          }
        },
        {
          "name": "Standalone source and verdict-role failure gate",
          "timeout-minutes": 5,
          "run": "bash verification/owners/content_moderation/verify.sh"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.25.7",
            "cache": false
          }
        },
        {
          "name": "Hash-locked CPU dependencies and advisory audit",
          "timeout-minutes": 15,
          "run": "python3 -m venv \"$RUNNER_TEMP/cm-venv\"\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/content_moderation/support/training/requirements.lock\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip check\n\"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/support/training/audit.py --lock verification/owners/content_moderation/support/training/requirements.lock --out \"$RUNNER_TEMP/cm-audit.txt\" --report \"$RUNNER_TEMP/cm-audit.json\""
        },
        {
          "name": "A1 human-source fit and native development diagnosis",
          "timeout-minutes": 300,
          "run": "timeout --signal=TERM --kill-after=20s 17880 \"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/aegis_remote.py fit --root \"$RUNNER_TEMP/cm-a1\"\n\"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/aegis_remote.py bundle --root \"$RUNNER_TEMP/cm-a1\" --destination \"$RUNNER_TEMP/cm-a1-handoff\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "success()",
          "with": {
            "name": "aegis-handoff-${{ github.run_id }}",
            "path": "${{ runner.temp }}/cm-a1-handoff/",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "aegis-fit-diagnostics-${{ github.run_id }}",
            "path": "${{ runner.temp }}/cm-a1/evidence/",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "aegis_audit": {
      "if": "github.repository == 'zkasuran/telegraph-catalog-miners' && github.event.repository.private == false && inputs.mode == 'aegis'",
      "needs": "aegis_fit",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONHASHSEED": "42",
        "TOKENIZERS_PARALLELISM": "false",
        "OMP_NUM_THREADS": "4",
        "MKL_NUM_THREADS": "4",
        "HF_HUB_OFFLINE": "1",
        "CUDA_VISIBLE_DEVICES": "",
        "DIAGNOSTIC_PUBLIC_REPOSITORY": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "verification/owners/content_moderation\n.github/workflows",
            "sparse-checkout-cone-mode": true
          }
        },
        {
          "name": "Standalone source and verdict-role failure gate",
          "timeout-minutes": 5,
          "run": "bash verification/owners/content_moderation/verify.sh"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.25.7",
            "cache": false
          }
        },
        {
          "name": "Hash-locked CPU dependencies and advisory audit",
          "timeout-minutes": 15,
          "run": "python3 -m venv \"$RUNNER_TEMP/cm-venv\"\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/content_moderation/support/training/requirements.lock\n\"$RUNNER_TEMP/cm-venv/bin/python\" -m pip check\n\"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/support/training/audit.py --lock verification/owners/content_moderation/support/training/requirements.lock --out \"$RUNNER_TEMP/cm-audit.txt\" --report \"$RUNNER_TEMP/cm-audit.json\""
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "aegis-handoff-${{ github.run_id }}",
            "path": "${{ runner.temp }}/cm-a1"
          }
        },
        {
          "name": "Frozen A1 independent audit and full reference engine",
          "timeout-minutes": 300,
          "run": "timeout --signal=TERM --kill-after=20s 17880 \"$RUNNER_TEMP/cm-venv/bin/python\" verification/owners/content_moderation/aegis_remote.py audit --root \"$RUNNER_TEMP/cm-a1\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "aegis-audit-diagnostics-${{ github.run_id }}",
            "path": "${{ runner.temp }}/cm-a1/evidence/",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "success()",
          "with": {
            "name": "aegis-registration-${{ github.run_id }}",
            "path": "${{ runner.temp }}/cm-a1/evidence/registration-ready.json\n${{ runner.temp }}/cm-a1/evidence/CONTENT_MODERATION.safetensors\n${{ runner.temp }}/cm-a1/evidence/CONTENT_MODERATION.safetensors.parser.json\n${{ runner.temp }}/cm-a1/evidence/source-manifest.json\n${{ runner.temp }}/cm-a1/evidence/baseline-coefficients.json",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
