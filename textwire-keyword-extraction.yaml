version: "1"
kind: miner
id: 7441
slug: textwire-keyword-extraction
protocol: generic
name: TextWire Keyword Extraction
description: >
  Representative topical keywords and keyphrases for a body of text, produced by a language
  model at request time. Send the text and the miner returns a comma separated list of the
  eight to fifteen most central terms, ordered by importance. The answer is produced with
  MiniMax under a commercial plan held by the operator, so this miner is not keyless. Serves
  the KEYWORD_EXTRACTION intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The body text to extract keywords from.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The comma separated keyword list.
    keywords:
      type: array
      description: The keywords as an array of strings.
    count:
      type: number
      description: How many keywords were returned.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /keywords
    external_path: /keywords
    method: GET
    description: >
      The keywords for one passage, the text as ?text= (or the whole question as ?question=).

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - KEYWORD_EXTRACTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The comma separated keyword list.
        source_path: summary
    integers:
      - index: 0
        name: count
        description: How many keywords were returned.
        source_path: count
  request:
    - endpoint: keywords
      method: GET
      query_params:
        text: { source: strings.0 }
