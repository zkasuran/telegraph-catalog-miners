version: "1"
kind: miner
id: 78326815
slug: zk-scholar-metrics
protocol: generic
name: ScholarWire Source-Scoped Research
description: >
  Source-grounded RESEARCH_QUERY_GENERAL answers from fetched public records
  and licensed excerpts. Exact DOI/title checks, separately scoped Crossref
  and OpenAlex citation counts, Crossref reference counts, publisher and type.
  Ambiguous titles retain distinct records; unavailable evidence is disclosed.
  Search coverage is bounded and a short brief may omit requested detail.
base_url: https://telegraph-scholar.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: detail
  code_path: error
endpoints:
  - path: /research
    external_path: /research
    method: GET
    description: >
      Copy the complete canonical research question verbatim into question.
      Returns source-attributed text or bibliographic values and uncertainty.
      Invalid or unsupported metric parameters return HTTP 400; source/identity
      failures may return HTTP 503. HTTP 200 does not establish sufficient
      evidence: inspect status, uncertainty and brief_limitation in the body.
      Full reference lists, global citation totals and broad synthesis are
      unsupported. Counts apply only to their explicitly named indexes.
    intents: [RESEARCH_QUERY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            description: >
              The actual full research question, verbatim, nonempty and at
              most 2048 UTF-8 bytes. Preserve DOI, title and index qualifiers.
            intents: [RESEARCH_QUERY_GENERAL]
input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
      minLength: 1
      maxLength: 2048
output_schema:
  type: object
  required: [answer, brief, source_count, sources]
  properties:
    answer:
      type: string
      description: One-paragraph source-attributed answer including uncertainty.
    brief:
      type: string
      maxLength: 80
      description: >
        Bounded plain-sentence summary. May be incomplete for long or compound
        requests; inspect brief_limitation and the full answer for omissions.
    source_count:
      type: integer
      minimum: 0
      maximum: 1000
    sources:
      type: array
      items: {type: string}
intent_mapping:
  RESEARCH_QUERY_GENERAL:
    endpoint: /research
    input:
      question:
        from: question
        how: Copy the complete canonical question verbatim without summarizing it.
    output:
      answer: {path: answer}
      brief: {path: brief}
      source_count: {path: source_count}
      sources: {path: sources}
semantics:
  signal_mapping:
    label_field: answer
    reason_field: answer
  supported_intents: [RESEARCH_QUERY_GENERAL]
