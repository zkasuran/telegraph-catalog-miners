version: "1"
kind: miner
id: 71268
slug: zk-vessel-area
protocol: generic
name: VesselWire Bounded AIS Area Reports
description: >
  Reports Fintraffic Digitraffic AIS records around an explicitly requested
  latitude and longitude within a radius greater than zero and at most 50 km.
  Returns at most 50 distinct MMSIs, newest records first, with normalized
  telemetry, per-record timestamps, freshness and available static metadata.
  Provider-filtered records use the documented default 24-hour window. They
  are not a current fleet census, proof of physical presence or absence, or
  independent vessel verification. Coverage is Fintraffic AIS reception, not
  worldwide. Fintraffic / digitraffic.fi data is CC BY 4.0 with attribution.
base_url: https://telegraph-vessel.margyn.workers.dev
docs:
  website: https://www.digitraffic.fi/en/marine-traffic/
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_VALUE
    message: Explicit information-only area request; at most 400 characters.
    param: question
    property: length
    value_num: 400
    operator: lte
errors:
  message_path: summary
  code_path: error
input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
      maxLength: 400
      description: >
        Verbatim explicit area request, for example 'Report AIS vessel telemetry
        within 5 km of latitude 60.17 longitude 24.94.' Use Report, List or Show;
        decimal-degree latitude -90..90 and longitude -180..180. No vessel
        identity constraint, historical/future condition, or verification claim.
output_schema:
  type: object
  properties:
    intent: {type: string}
    query_scope: {type: string}
    verdict: {type: string}
    summary: {type: string}
    source_url: {type: string}
    attribution: {type: string}
    as_of: {type: string}
    independently_verified: {type: boolean}
    returned_vessel_count: {type: integer}
    matching_identity_count: {type: integer}
    truncated: {type: boolean}
    vessels: {type: array, items: {type: object}}
endpoints:
  - path: /vessel-telemetry-verify
    external_path: /vessel-telemetry-verify
    method: GET
    description: >
      Report, List or Show AIS vessel telemetry within a stated radius in km
      of latitude and longitude. The complete question must follow the documented
      grammar. Other conditions are not silently dropped. No guessed vessel
      identities, default vessel, per-vessel upstream fan-out or independent
      presence/absence assertion.
    intents: [VESSEL_TELEMETRY_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            intents: ['*']
            description: Complete explicit AIS area report question, verbatim.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [VESSEL_TELEMETRY_VERIFY_GENERAL]
