version: '1'
kind: miner
id: 78472
slug: zk-routebrief
protocol: generic
name: RouteBrief Confirmed Ethereum Execution Decision
description: 'Keyless block-pinned quotes for exactly 1 ETH into Ethereum USDC, with two public RPC operators confirming all
  416 contract results. Compares Uniswap V2/V3/V4, Pancake V3 and Sushi V2 paths and disjoint splits in a bounded search.
  Returns exact highest gross output and a concise factual execution cost decision; detailed pool allocations and economic
  evidence are linked.

  '
base_url: https://telegraph-s2-routebrief.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
- code: ACCOUNT_QUOTA
  message: Conservative operating cap of 200 node calls per day.
  property: rate
  value_num: 200
  window_seconds: 86400
- code: MAX_PARAM_SIZE
  message: Exactly the fixed ETH/USDC pair, at most 32 bytes.
  param: pair
  property: size_bytes
  value_bytes: 32
  operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values:
  - ok
endpoints:
- path: /route
  external_path: /route
  method: GET
  description: 'Sell exactly 1000000000000000000 wei of ETH on Ethereum mainnet for USDC; send pair=ETH/USDC. amount_out is
    integer USDC base units, 1000000 per USDC. answer gives the exact highest gross quote in the bounded verified pool/path/split
    search and the conditional extra-cost decision versus the best single pool. Pool fees and market impact included; network
    gas and future proceeds are unmeasured. Bare /route and the literal {pair} query use this same fixed canonical trade.

    '
  intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
  params:
    query:
      required:
      - name: pair
        type: string
        intents:
        - OPTIMAL_EXECUTION_ROUTE_GENERAL
        description: 'Exactly ETH/USDC; exactly one ETH and Ethereum chain are fixed. Accepted values: ETH/USDC.'
input_schema:
  type: object
  additionalProperties: false
  required:
  - pair
  properties:
    pair:
      type: string
      enum:
      - ETH/USDC
      maxLength: 32
output_schema:
  type: object
  required:
  - status
  - summary
  - source
  - as_of
  properties:
    status:
      type: string
      enum:
      - ok
      - unavailable
    amount_out:
      type: integer
      minimum: 100000000
      maximum: 100000000000
    answer:
      type: string
    summary:
      type: string
    source:
      type:
      - string
      - 'null'
    as_of:
      type:
      - string
      - 'null'
    block_number:
      type: integer
    confirmed_sources:
      type: array
      items:
        type: string
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path:
      type: string
    error:
      type: object
  allOf:
  - if:
      properties:
        status:
          const: ok
    then:
      required:
      - amount_out
      - answer
      - block_number
      - confirmed_sources
      - evidence_path
semantics:
  signal_mapping:
    label_field: answer
    reason_field: summary
  supported_intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve ETH/USDC exactly; amount and Ethereum chain are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
