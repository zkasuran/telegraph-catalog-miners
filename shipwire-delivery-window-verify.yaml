version: "1"
kind: miner
id: 7605
slug: shipwire-delivery-window-verify
protocol: generic
name: ShipWire Delivery Window Verify
description: >
  Delivery-window check for a described order, answered by a language model at request time.
  Send the promised or claimed window and the facts around it such as the dispatch time, the
  service level, the destination and any disruption and the miner returns a clear verdict
  (consistent, inconsistent, at risk or insufficient information) with the reason and the
  window the facts actually support. This is judgement over the facts in the request, not a
  live carrier feed. The answer is produced with MiniMax under a commercial plan held by the
  operator, so this miner is not keyless. Serves the DELIVERY_WINDOW_VERIFY intent.
base_url: https://telegraph-ship.margyn.workers.dev

docs:
  documentation: https://telegraph-ship.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the promised window and the facts around it. Passing the whole question verbatim works too. A single passage, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: The full natural-language question, verbatim. The miner reads the subject from it, so passing the whole question works as well as passing the subject on its own.
    query:
      type: string
      description: The subject to assess, if sent on its own rather than inside a question.
    text:
      type: string
      description: The subject text to assess.
    window:
      type: string
      description: The promised or claimed delivery window to check.
    scenario:
      type: string
      description: The order and the facts around the delivery window.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of consistent, inconsistent, at risk or insufficient information.
    summary:
      type: string
      description: "The answer the node grades: the verdict or figure followed by one or two sentences of reasoning."
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /delivery-window-verify
    external_path: /delivery-window-verify
    method: GET
    description: >
      Delivery-window check for one described order, the window and facts as a query parameter
      (?question=...). Also accepts ?query=, ?text=, ?window= or ?scenario=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - DELIVERY_WINDOW_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The full graded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: delivery-window-verify
      method: GET
      query_params:
        question: { source: strings.1 }
