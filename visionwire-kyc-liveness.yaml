version: "1"
kind: miner
id: 7447
slug: visionwire-kyc-liveness
protocol: generic
name: VisionWire KYC Biometric Liveness
description: >
    Judge whether a selfie or liveness capture is a live human matching an identity document,
    rather than a mask, print or screen replay. Send the selfie as ?selfie_url= and the document
    as ?document_url=. Both URLs may instead be in the question. The miner returns a liveness
    and face-match verdict with the signs it can see. It states plainly that a visual pass has
    no depth, infrared or challenge-response signal so it is not a certified presentation-attack
    check. The answer is produced with MiniMax (MiniMax-M3.1-Flash-Preview), a multimodal model,
    under a commercial plan held by the operator, so this miner is not keyless. It reads the
    attached media and returns a genuine analysis with a calibrated confidence and an honest
    hedge. When the media cannot be read it says so plainly rather than guessing. Serves the
    KYC_BIOMETRIC_LIVENESS intent.
base_url: https://telegraph-vision.margyn.workers.dev

docs:
  documentation: https://telegraph-vision.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: selfie_url is a public URL to the selfie or liveness capture. document_url is the identity document. Both URLs may instead be carried in the question.
    param: selfie_url
    property: length
    value_num: 2000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the media URL from it, so
        passing the whole question works as well as the structured field.
    selfie_url:
      type: string
      description: >
        A public URL to the selfie or liveness capture.
    document_url:
      type: string
      description: >
        A public URL to the identity document image.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: >
        A short best-effort verdict label read from the analysis. The graded field is the summary.
    summary:
      type: string
      description: >
        The liveness and face-match analysis. This is the graded field.
    selfie_url:
      type: string
      description: >
        The selfie URL that was read.
    document_url:
      type: string
      description: >
        The document URL that was read, where supplied.
    confidence:
      type: number
      description: >
        0.9 for a completed analysis, lower when the media could not be read.
    model:
      type: string
      description: >
        The multimodal model that produced the reading.
    as_of:
      type: string
      description: >
        ISO 8601 timestamp the answer was produced.

endpoints:
  - path: /kyc-liveness
    external_path: /kyc-liveness
    method: GET
    description: >
        Liveness and face-match verdict, the selfie as ?selfie_url= and the identity document as
        ?document_url=. Also accepts both URLs in ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - KYC_BIOMETRIC_LIVENESS

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: selfie_url
        description: >
            The selfie URL that was read.
        source_path: selfie_url
      - index: 1
        name: document_url
        description: >
            The document URL that was read.
        source_path: document_url
      - index: 2
        name: summary
        description: >
            The liveness and face-match analysis.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: >
            Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: kyc-liveness
      method: GET
      query_params:
        selfie_url: { source: strings.0 }
        document_url: { source: strings.1 }
