version: '1'
kind: miner
id: 78475
slug: zk-routeatom
protocol: generic
name: RouteAtom Atomic Evidence Execution Plans
description: >-
  Exactly 1 ETH into Ethereum mainnet USDC: bounded Uniswap V2/V3/V4,
  Pancake V3 and Sushi V2 route/split comparison. Two independent public RPC
  operators reproduce all 416 results at one EIP-1898 canonical block hash.
  Exact input allocations, token paths, fees and conditional extra-cost decision.
  Opt-in inline evidence on the same route avoids a separate proof handoff race.
  Optional exact sizes additionally use an independently verified V3 search;
  BTC/USDC explicitly denotes WBTC held on Ethereum, not native Bitcoin execution.
base_url: https://telegraph-s2-routeatom.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: Conservative operating cap of 200 node calls per day.
    property: rate
    value_num: 200
    window_seconds: 86400
  - code: MAX_PARAM_SIZE
    message: Supported Ethereum pair symbol, at most 32 bytes.
    param: pair
    property: size_bytes
    value_bytes: 32
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >-
      Sell exactly 1000000000000000000 wei ETH on Ethereum mainnet into USDC;
      send pair=ETH/USDC. amount_out is integer USDC base units, 1000000 per USDC.
      answer gives every actual input allocation, token path, venue and fee in ppm,
      exact wrapping share and conditional cost decision versus a one-pool quote.
      Fees and price impact included; network gas and future proceeds unmeasured.
      Bounded gross maximum, not global/net optimality. All source simulations
      pinned to one canonical block hash. Bare /route and literal {pair} use
      the same fixed canonical trade. Optional amount is exact input-token size,
      default 1; sizes other than 1 ETH use V3 direct fee tiers and quarter splits.
      WBTC/USDC (BTC alias) also compares nine WETH two-hop paths; the alias means
      WBTC already held on Ethereum and excludes bridging native Bitcoin. Maximum
      100 ETH/WETH or 10 WBTC; unknown pairs and invalid/duplicate sizes are refused.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: ETH/USDC for the canonical intent; optional API pairs WETH/USDC, WBTC/USDC, BTC/USDC (WBTC on Ethereum).
        optional:
          - name: amount
            type: number
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Positive exact input-token size, default 1. Maximum 100 ETH/WETH or 10 WBTC. No exponent notation; at most 18 fractional digits for ETH/WETH or 8 for WBTC.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair: {type: string, enum: [ETH/USDC, WETH/USDC, WBTC/USDC, BTC/USDC], maxLength: 32}
    amount: {type: number, exclusiveMinimum: 0, maximum: 100}
  allOf:
    - if:
        properties: {pair: {enum: [WBTC/USDC, BTC/USDC]}}
      then:
        properties: {amount: {maximum: 10}}
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    status: {type: string, enum: [ok, unavailable]}
    amount_out: {type: integer, minimum: 1, maximum: 9007199254740991}
    answer: {type: string}
    summary: {type: string}
    source: {type: [string, 'null']}
    as_of: {type: [string, 'null']}
    block_number: {type: integer}
    block_hash: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}
    confirmed_sources:
      type: array
      items: {type: string}
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path: {type: string}
    source_evidence: {type: object}
    error: {type: object}
  allOf:
    - if:
        properties: {status: {const: ok}}
      then:
        required: [amount_out, answer, block_number, block_hash, confirmed_sources, evidence_path]
      else:
        not: {required: [amount_out]}
semantics:
  signal_mapping: {label_field: answer, reason_field: summary}
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair: {from: pair, how: Preserve ETH/USDC exactly for this canonical intent.}
      amount: {from: const, value: 1, how: Live version-4 intent fixes selling exactly one ETH on Ethereum.}
    output:
      amount_out: {path: amount_out, unit: 'USDC base units (6 decimals)'}
