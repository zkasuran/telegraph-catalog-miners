name: Bounded keyword centrality pilot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source-only packaged verification or frozen neural pilot
        type: choice
        required: true
        default: source
        options:
          - source
          - train_audit
          - serve
      package_url:
        description: Immutable licensed package URL for serving only
        type: string
        required: false
      report_url:
        description: Immutable complete measured registration-ready report
        type: string
        required: false
      report_sha256:
        description: Exact complete report byte hash
        type: string
        required: false
      slot:
        description: Actual installed adapter reservation slot
        type: string
        required: false
      forward_port:
        description: Actual installed adapter reservation forward port
        type: string
        required: false
      runnable_url:
        description: Actual installed adapter reservation route
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: keyword-centrality-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  source:
    if: ${{ inputs.mode == 'source' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OWNER_SOURCE_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run the standalone source and unreviewed-expansion contracts
        run: bash verification/owners/keyword_extraction/verify.sh
      - name: Bind source-only run identity
        run: |
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"source-result.json"; p.write_text(json.dumps({"family":"KEYWORD_EXTRACTION","run_id":int(os.environ["GITHUB_RUN_ID"]),"commit":os.environ["GITHUB_SHA"],"status":"SOURCE_GATE_PASSED","model_operations":0})+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyword-source-gate
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/source-result.json
  train:
    if: ${{ inputs.mode == 'train_audit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            /verification/*
            !/verification/packages/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Validate prepared source admission and immutable held-out bytes
        run: |
          bash verification/owners/keyword_extraction/verify.sh
          test -s verification/owners/keyword_extraction/approved/approved-manifest.json
          python3 -m json.tool verification/owners/keyword_extraction/config.json
      - name: Install and audit locked CPU dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/keyword-venv"
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/keyword_extraction/requirements.lock
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip check
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/dependency_audit.py --lock verification/owners/keyword_extraction/requirements.lock --out "$RUNNER_TEMP/keyword-requirements.txt" --report "$RUNNER_TEMP/keyword-dependency-audit.json"
      - name: Run bounded source-gated pilot
        timeout-minutes: 120
        run: |
          mkdir -p "$RUNNER_TEMP/keyword-pilot"
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/supervise.py --root "$RUNNER_TEMP/keyword-pilot" "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/remote.py --root "$RUNNER_TEMP/keyword-pilot" --data verification/owners/keyword_extraction/approved
      - name: Retain checkpoint terms on every outcome
        if: always()
        run: |
          python3 verification/owners/keyword_extraction/preserve.py --root "$RUNNER_TEMP/keyword-pilot"
          python3 verification/owners/keyword_extraction/artifact_layout.py --kind train --root "$RUNNER_TEMP/keyword-pilot" --dependency "$RUNNER_TEMP/keyword-dependency-audit.json" --licences verification/owners/keyword_extraction/licences.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keyword-centrality-pilot
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/keyword-pilot/*.json
            ${{ runner.temp }}/keyword-pilot/*.safetensors
  audit:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            /verification/*
            !/verification/packages/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: keyword-centrality-pilot
          path: ${{ runner.temp }}/keyword-bundle
      - name: Install and audit locked CPU dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/keyword-venv"
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/keyword_extraction/requirements.lock
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip check
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/dependency_audit.py --lock verification/owners/keyword_extraction/requirements.lock --out "$RUNNER_TEMP/keyword-audit-requirements.txt" --report "$RUNNER_TEMP/keyword-audit-dependencies.json"
      - name: Audit the frozen candidate once and emit only passing measured readiness
        timeout-minutes: 120
        run: |
          mkdir -p "$RUNNER_TEMP/keyword-audit"
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/supervise.py --root "$RUNNER_TEMP/keyword-audit" "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/audit_remote.py --root "$RUNNER_TEMP/keyword-audit" --bundle "$RUNNER_TEMP/keyword-bundle" --data verification/owners/keyword_extraction/approved
      - name: Keep actual audit diagnostics at the literal registration artifact root
        if: always()
        run: python3 verification/owners/keyword_extraction/artifact_layout.py --kind audit --root "$RUNNER_TEMP/keyword-audit" --dependency "$RUNNER_TEMP/keyword-audit-dependencies.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keyword-centrality-independent-audit
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/keyword-audit/*.json
            ${{ runner.temp }}/keyword-audit/*.log
  serve:
    if: ${{ inputs.mode == 'serve' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PACKAGE_URL: ${{ inputs.package_url }}
      REPORT_URL: ${{ inputs.report_url }}
      REPORT_SHA256: ${{ inputs.report_sha256 }}
      SLOT: ${{ inputs.slot }}
      FORWARD_PORT: ${{ inputs.forward_port }}
      RUNNABLE_URL: ${{ inputs.runnable_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: verification/owners/keyword_extraction
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Run source-only serving contracts
        run: bash verification/owners/keyword_extraction/verify.sh
      - name: Install and audit locked CPU runtime supervisor dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/keyword-venv"
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/keyword_extraction/requirements.lock
          "$RUNNER_TEMP/keyword-venv/bin/python" -m pip check
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/dependency_audit.py --lock verification/owners/keyword_extraction/requirements.lock --out "$RUNNER_TEMP/keyword-serving-requirements.txt" --report "$RUNNER_TEMP/keyword-serving-dependencies.json"
      - name: Start the identical verified executor and prepare only its public lease
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/keyword-serving"
          "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/supervise.py --profile serve --root "$RUNNER_TEMP/keyword-serving" "$RUNNER_TEMP/keyword-venv/bin/python" verification/owners/keyword_extraction/serve.py --root "$RUNNER_TEMP/keyword-serving" --package-url "$PACKAGE_URL" --report-url "$REPORT_URL" --report-sha256 "$REPORT_SHA256" --slot "$SLOT" --forward-port "$FORWARD_PORT" --runnable-url "$RUNNABLE_URL" >"$RUNNER_TEMP/keyword-serving/runner.log" 2>&1 &
          pid=$!
          printf '%s\n' "$pid" >"$RUNNER_TEMP/keyword-serving/process.pid"
          deadline=$((SECONDS+1450))
          while [ ! -f "$RUNNER_TEMP/keyword-serving/lease.json" ]; do
            kill -0 "$pid" || exit 1
            [ "$SECONDS" -lt "$deadline" ] || exit 1
            sleep 2
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyword-public-restricted-lease
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/keyword-serving/lease.json
      - name: Keep this exact restricted executor alive within its bounded lease
        timeout-minutes: 315
        run: |
          pid=$(python3 -c 'import os,pathlib;print((pathlib.Path(os.environ["RUNNER_TEMP"])/"keyword-serving/process.pid").read_text().strip())')
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"keyword-serving/supervisor.json").read_text()); assert r["returncode"]==0 and r["termination_reason"] is None, r'
      - name: Remove only this runner's ephemeral private forwarding key on every outcome
        if: always()
        run: python3 -c 'import os,pathlib; r=pathlib.Path(os.environ["RUNNER_TEMP"])/"keyword-serving"; [(r/p).unlink(missing_ok=True) for p in ("forward-key","forward-key.pub")]'
