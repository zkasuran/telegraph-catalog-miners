version: "1"
kind: miner
id: 7448
slug: audiowire-speech-to-text
protocol: generic
name: AudioWire Speech to Text
description: >
    Transcribe spoken audio into punctuated text with sentence timestamps and speaker labels.
    Send the audio URL or the whole question. The miner fetches the audio and returns the real
    transcript. The transcription is produced with MiniMax ASR (asr-1.0) under a commercial plan
    held by the operator, so this miner is not keyless. It fetches the audio and returns the
    real transcript. When the audio cannot be read it says so plainly. Serves the SPEECH_TO_TEXT
    intent.
base_url: https://telegraph-audio.margyn.workers.dev

docs:
  documentation: https://telegraph-audio.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: audio_url is a public URL to the audio file to transcribe. A whole question carrying the URL is accepted too.
    param: audio_url
    property: length
    value_num: 2000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the media URL from it, so
        passing the whole question works as well as the structured field.
    audio_url:
      type: string
      description: >
        A public URL to the audio file to transcribe.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: >
        The transcription. This is the graded field.
    transcript:
      type: string
      description: >
        The transcription text.
    duration:
      type: number
      description: >
        Audio length in seconds.
    n_speakers:
      type: integer
      description: >
        Number of distinct speakers detected.
    language:
      type: string
      description: >
        The language of the audio where detected.
    confidence:
      type: number
      description: >
        0.9 for a completed analysis, lower when the media could not be read.
    model:
      type: string
      description: >
        The multimodal model that produced the reading.
    as_of:
      type: string
      description: >
        ISO 8601 timestamp the answer was produced.

endpoints:
  - path: /transcribe
    external_path: /transcribe
    method: GET
    description: >
        Transcription of one audio file, the audio as ?audio_url=. Also accepts a whole question
        carrying the URL in ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - SPEECH_TO_TEXT

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: audio_url
        description: >
            The audio URL that was transcribed.
        source_path: audio_url
      - index: 1
        name: summary
        description: >
            The transcription.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: >
            Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: transcribe
      method: GET
      query_params:
        audio_url: { source: strings.0 }
