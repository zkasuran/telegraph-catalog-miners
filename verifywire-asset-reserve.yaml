version: "1"
kind: miner
id: 7379
slug: verifywire-asset-reserve
protocol: generic
name: VerifyWire Asset Reserve Attestation
description: >
  Checks that a token's reserve covers its supply, both figures read on-chain, so the ratio is
  reproducible by anyone. The clean case is a wrapped native coin: WETH holds ETH one for one in
  its own contract, so the reserve is the contract's native balance and the supply is
  totalSupply(). A caller can also name an external custodian with a reserve token, for an asset
  backed off its own contract. The miner then reads that custodian's balance against the token
  supply. It attests only the on-chain backing it can read; off-chain reserves such as bank
  deposits are not visible and are not claimed. Reads on Ethereum, Base, Arbitrum, Optimism and
  Polygon. Answers the ASSET_RESERVE_ATTESTATION intent. No API key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: name a wrapped-native token (WETH, WMATIC) by symbol or address. A custodian path also works by naming a token plus a reserve custodian address with a reserveToken. chain defaults to ethereum and the token defaults to the wrapped native coin.
    param: token
    property: length
    value_num: 80
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Is WETH on Base fully backed by
        ETH?". The miner reads the token and the chain from it, so passing the whole question works
        as well as the fields.
    chain:
      type: string
      description: Chain to read on, one of ethereum, base, arbitrum, optimism, polygon.
    token:
      type: string
      description: Token symbol or address whose reserve to attest.
    reserve:
      type: string
      description: Optional custodian address holding the reserve token.
    reserveToken:
      type: string
      description: Optional reserve token symbol or address held at the custodian.

output_schema:
  type: object
  properties:
    chain:
      type: string
      description: Chain the answer is for.
    chain_id:
      type: integer
      description: EVM chain id.
    token:
      type: string
      description: The attested token symbol.
    total_supply:
      type: string
      description: The token's total supply, read on-chain.
    reserve_amount:
      type: string
      description: The reserve amount backing the supply, read on-chain.
    reserve_asset:
      type: string
      description: What the reserve is held in, for example ETH.
    collateralization_percent:
      type: number
      description: Reserve over supply as a percentage.
    fully_backed:
      type: boolean
      description: True when collateralization is at or above 100%.
    verified:
      type: boolean
      description: True when the token is fully backed on-chain.
    confidence:
      type: number
      description: 0.98 for a direct supply and balance read.
    summary:
      type: string
      description: One sentence with the backing verdict and the figures.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /reserve
    external_path: /reserve
    method: GET
    description: >
      Attest a token's reserve against its supply as query parameters (?chain=ethereum&token=WETH),
      or name a custodian (?token=..&reserve=0x..&reserveToken=..). Also accepts a whole question in
      ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - ASSET_RESERVE_ATTESTATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: token
        description: The attested token symbol.
        source_path: token
      - index: 1
        name: reserve_asset
        description: What the reserve is held in.
        source_path: reserve_asset
      - index: 2
        name: summary
        description: One sentence with the backing verdict and the figures.
        source_path: summary
    integers:
      - index: 0
        name: chain_id
        description: EVM chain id.
        source_path: chain_id
        multiplier: 1
  request:
    - endpoint: reserve
      method: GET
      query_params:
        token: { source: strings.0 }
