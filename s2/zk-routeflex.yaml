version: '1'
kind: miner
id: 78479
slug: zk-routeflex
protocol: generic
name: RouteFlex Joint Cross-Venue Execution Routes
description: Independently confirmed 484-result Ethereum quote engine with joint disjoint
  Sushi/V2/V3/V4/hub allocation, exact gross output and conditional execution-cost
  budgets. Native canonical trade is exactly 1 ETH to USDC; exact-size ETH/WETH/WBTC
  API extensions are explicitly labelled.
base_url: https://telegraph-s2-routeflex.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
- code: ACCOUNT_QUOTA
  message: Conservative cap of 200 node calls per day; free public RPC capacity is
    best-effort.
  property: rate
  value_num: 200
  window_seconds: 86400
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values:
  - ok
endpoints:
- path: /route
  external_path: /route
  method: GET
  description: 'Sell exactly 1 ETH into Ethereum USDC for the canonical intent. Send
    pair=ETH/USDC; amount_out is integer USDC base units (1000000 per USDC), pool
    fees included, before actual gas. Joint disjoint cross-venue allocations retain
    lower-swap alternatives and exact extra-cost ceilings. /decision exposes full
    legs. Header X-Telegraph-Evidence: inline adds original two-operator evidence.
    Bare /route or literal {pair} uses the same fixed canonical trade. Optional exact
    decimal amount (up to 100 ETH or 10 WBTC) and WETH/USDC or WBTC/USDC are API extensions;
    BTC/USDC explicitly denotes WBTC held on Ethereum, never native Bitcoin execution.'
  intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
  params:
    query:
      required:
      - name: pair
        type: string
        intents:
        - OPTIMAL_EXECUTION_ROUTE_GENERAL
        description: Canonical ETH/USDC exactly; extension pairs WETH/USDC, WBTC/USDC
          or BTC/USDC (Ethereum WBTC only).
      optional:
      - name: amount
        type: string
        intents:
        - OPTIMAL_EXECUTION_ROUTE_GENERAL
        description: Positive exact decimal input-token size without exponents. Canonical
          trade is 1 ETH; other exact sizes use the explicitly bounded V3 extension,
          never a scaled canonical answer. Max 100 ETH/WETH or 10 WBTC.
input_schema:
  type: object
  additionalProperties: false
  required:
  - pair
  properties:
    pair:
      type: string
      enum:
      - ETH/USDC
      - WETH/USDC
      - WBTC/USDC
      - BTC/USDC
      maxLength: 9
    amount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,2})(\.[0-9]+)?$
output_schema:
  type: object
  required:
  - status
  - summary
  - source
  - as_of
  properties:
    status:
      type: string
      enum:
      - ok
      - unavailable
    amount_out:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    answer:
      type: string
    summary:
      type: string
    source:
      type:
      - string
      - 'null'
    as_of:
      type:
      - string
      - 'null'
    block_number:
      type: integer
    block_hash:
      type: string
      pattern: ^0x[0-9a-fA-F]{64}$
    confirmed_sources:
      type: array
      items:
        type: string
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path:
      type: string
    decision:
      type: object
    source_evidence:
      type: object
    error:
      type: object
  allOf:
  - if:
      properties:
        status:
          const: ok
    then:
      required:
      - amount_out
      - answer
      - block_number
      - block_hash
      - confirmed_sources
      - evidence_path
    else:
      not:
        required:
        - amount_out
semantics:
  signal_mapping:
    label_field: answer
    reason_field: summary
  supported_intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve canonical ETH/USDC exactly; chain and input amount are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
