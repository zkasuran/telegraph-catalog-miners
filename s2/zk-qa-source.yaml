version: '1'
kind: miner
id: 780019
slug: zk-qa-source
protocol: generic
name: ZK Source-Excerpt QA Candidate
description: Candidate source-excerpt retrieval for QUESTION_ANSWERING_GENERAL. Quotes
  complete sentences from a fetched English Wikipedia article, or a caller-supplied
  passage. Selection is lexical, not model-generated; it does not guarantee entailment,
  multi-hop reasoning or independent current-world verification. Not deployed or registered.
base_url: https://telegraph-text.margyn.workers.dev
rate_limit_per_sec: 2
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
- path: /answer
  external_path: /answer
  method: GET
  intents:
  - QUESTION_ANSWERING_GENERAL
  description: 'Quotes source evidence for one question. question must contain the
    complete original wording. Optional context is the only source when supplied.
    Inline passages must use Context: ... Question: ... or the reverse on separate
    lines. Returns summary and answer containing verbatim source sentences, citations,
    evidence and source receipts. source_excerpt is not a claim that semantic correctness
    was verified.'
  params:
    query:
      required:
      - name: question
        type: string
        intents:
        - '*'
        description: Complete natural-language question, verbatim; maximum 8000 characters.
      optional:
      - name: context
        type: string
        intents:
        - '*'
        description: Optional source passage; maximum 40000 characters. Quotes are
          attributed to the caller and not independently verified.
input_schema:
  type: object
  properties:
    question:
      type: string
      maxLength: 8000
    context:
      type: string
      maxLength: 40000
output_schema:
  type: object
  properties:
    summary:
      type: string
    answer:
      type: string
    verdict:
      type: string
    citations:
      type: array
    evidence:
      type: array
    upstream:
      type: array
    as_of:
      type: string
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents:
  - QUESTION_ANSWERING_GENERAL
errors:
  message_path: detail
  code_path: error
