version: "1"
kind: miner
id: 7444
slug: textwire-grammar-spell-check
protocol: generic
name: TextWire Grammar and Spell Check
description: >
  Grammar and spelling check for a text, produced by a language model at request time. Send
  the text and the miner returns the fully corrected version followed by one line per fix
  naming the original wording and its correction. The answer is produced with MiniMax under a
  commercial plan held by the operator, so this miner is not keyless. Serves the
  GRAMMAR_SPELL_CHECK intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The text to check for grammar and spelling errors.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The corrected text followed by the list of fixes.
    corrected_text:
      type: string
      description: The corrected text on its own.
    has_error:
      type: boolean
      description: True when at least one error was corrected.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /grammar
    external_path: /grammar
    method: GET
    description: >
      The grammar check for one passage, the text as ?text= (or the whole question as ?question=).

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - GRAMMAR_SPELL_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The corrected text and the fixes.
        source_path: summary
  request:
    - endpoint: grammar
      method: GET
      query_params:
        text: { source: strings.0 }
