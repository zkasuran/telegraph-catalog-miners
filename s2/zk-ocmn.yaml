version: "1"
kind: miner
id: 732261
slug: zk-ocmn
protocol: generic
name: ZK Authenticated Ethereum Account Metrics
description: >-
  Exact Ethereum mainnet native balance in Gwei and account nonce (tx_count) at
  the requested integer block. Account inclusion/exclusion proof authenticates
  both fields against a canonical state root witnessed by two named public RPC
  services. Historical finalized proof reuse retains original observation clocks.
  Account nonce is not a count of transfers or received transactions. Other chains
  and unavailable or contradictory evidence are refused; no replacement values.
base_url: https://telegraph-verify.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: error
input_schema:
  type: object
  required: [address, block]
  properties:
    address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
    block:
      type: integer
      minimum: 0
      maximum: 1000000000000
    chain:
      type: string
      enum: [ethereum]
    metric:
      type: string
      enum: [balance, tx_count]
output_schema:
  type: object
  required: [balance_gwei, tx_count, address, block, chain]
  properties:
    balance_gwei: {type: number}
    tx_count: {type: integer}
    address: {type: string}
    block: {type: string}
    chain: {type: string}
endpoints:
  - path: /metric
    external_path: /metric
    method: GET
    description: >-
      Read native ETH balance and account nonce at the exact requested mainnet
      block. metric selects which fact leads the summary; both authenticated
      values remain in JSON. HTTP400 for invalid input, HTTP502 for unavailable
      evidence. No latest or different-chain substitution.
    intents: [ONCHAIN_METRIC_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: Exact 20-byte hexadecimal Ethereum mainnet address.
          - name: block
            type: integer
            intents: ["*"]
            description: Exact nonnegative block number, at most 1000000000000.
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: Ethereum mainnet only; default ethereum.
          - name: metric
            type: string
            intents: ["*"]
            description: balance or tx_count (account nonce); default balance.
semantics:
  supported_intents: [ONCHAIN_METRIC_VERIFY_GENERAL]
  signal_mapping:
    label_field: summary
    reason_field: summary
intent_mapping:
  ONCHAIN_METRIC_VERIFY_GENERAL:
    endpoint: /metric
    input:
      address: {from: address, how: Copy the exact address; do not resolve a name.}
      block: {from: block, how: Copy the exact nonnegative integer block.}
      chain: {from: chain, how: Ethereum mainnet only; never substitute another chain.}
      metric: {from: metric, how: balance or tx_count from the canonical input.}
    output:
      balance_gwei: {path: balance_gwei, unit: Gwei}
      tx_count: {path: tx_count}
      address: {path: address}
      block: {path: block}
      chain: {path: chain}
