version: "1"
kind: miner
id: 70148
slug: zk-apih
protocol: generic
name: GuardWire Source-Backed API Health
description: >-
  Check a caller-named public HTTP(S) endpoint using one manual-redirect GET.
  Reports the actual HTTP code and header latency in milliseconds, plus
  separately attributed first-party publisher status where supported. Whole
  questions and bare hosts with explicit ports and paths are accepted.
base_url: https://telegraph-guard.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_VALUE
    message: Supply exactly one public HTTP(S) URL, hostname or supported provider, at most 2048 characters.
    param: url
    property: length
    value_num: 2048
    operator: lte
input_schema:
  type: object
  required: [url]
  properties:
    url:
      type: string
      maxLength: 2048
      description: Complete public endpoint URL, bare-host URL or whole question naming one endpoint.
output_schema:
  type: object
  required: [intent, url, summary, healthy, up, confidence, as_of]
  properties:
    intent: {type: string}
    url: {type: string}
    summary: {type: string}
    healthy: {type: [boolean, "null"]}
    up: {type: boolean}
    status_code: {type: [integer, "null"]}
    response_time_ms: {type: [integer, "null"]}
    confidence: {type: number}
    as_of: {type: string}
endpoints:
  - path: /api-health
    external_path: /api-health
    method: GET
    description: Live endpoint HTTP observation and separately attributed publisher/API status.
    intents: [API_HEALTH_CHECK_GENERAL]
    params:
      query:
        required:
          - name: url
            type: string
            intents: [API_HEALTH_CHECK_GENERAL]
            description: Complete endpoint or whole question naming one public endpoint; preserve port, path and query.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [API_HEALTH_CHECK_GENERAL]
