version: "1"
kind: miner
id: 73013
slug: zk-fr-net
protocol: generic
name: IGN France Network Driving ETA
description: >
  Keyless source-backed driving estimates on IGN's France road network, including
  documented overseas departments. Resolves French names and postal-qualified
  municipalities or accepts longitude,latitude points. Newly covered routes require
  typed source road steps and refuse confirmed ferry/maritime crossings without a
  driving-only duration. Municipality points are not building entrances. No live
  traffic or worldwide coverage; published resource bounds do not guarantee roads.
base_url: https://telegraph-s2-france-eta.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  documentation: https://cartes.gouv.fr/aide/fr/guides-utilisateur/utiliser-les-services-de-la-geoplateforme/calcul-itineraire/
limitations:
  - code: MAX_PARAM_SIZE
    message: Origin must be at most 256 UTF-8 bytes.
    param: origin
    property: size_bytes
    value_bytes: 256
    operator: lte
  - code: MAX_PARAM_SIZE
    message: Destination must be at most 256 UTF-8 bytes.
    param: destination
    property: size_bytes
    value_bytes: 256
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /eta
    external_path: /eta
    method: GET
    description: >
      Driving time in whole seconds on IGN's France road network including overseas
      departments. Supply French names, postal-qualified municipalities, full addresses
      or longitude,latitude decimal-degree strings. No live traffic. Newly covered routes
      require complete typed source road steps and refuse ferry/maritime crossings without
      a driving-only duration. The original mainland/Corsica request does not verify
      crossings. Ambiguity, missing nearby roads and unsupported routes return status error.
    intents: [ROUTE_ETA_GENERAL]
    params:
      query:
        required:
          - name: origin
            type: string
            intents: [ROUTE_ETA_GENERAL]
            description: French-network origin name, address or longitude,latitude; at most 256 UTF-8 bytes. Preserve input verbatim.
          - name: destination
            type: string
            intents: [ROUTE_ETA_GENERAL]
            description: French-network destination name, address or longitude,latitude; at most 256 UTF-8 bytes. Preserve input verbatim.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [ROUTE_ETA_GENERAL]
intent_mapping:
  ROUTE_ETA_GENERAL:
    endpoint: /eta
    input:
      origin:
        from: origin
        how: Send the supplied start point verbatim. Never invent coordinates; the Worker resolves French-network names itself.
      destination:
        from: destination
        how: Send the supplied end point verbatim. Never invent coordinates; the Worker resolves French-network names itself.
    output:
      duration:
        path: duration
        unit: seconds
