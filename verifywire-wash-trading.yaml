version: "1"
kind: miner
id: 7378
slug: verifywire-wash-trading
protocol: generic
name: VerifyWire Wash Trading Detection
description: >
  A heuristic read over a token's recent ERC-20 Transfer logs, scanned live over public RPC. It is
  a signal, not a proof of intent: it measures the patterns wash trading leaves behind. Reciprocal
  address pairs where value goes out and comes back, self-transfers, plus volume concentrated in a
  few senders all raise a bounded risk score the answer labels low, elevated or high. The block
  window is bounded and the node's log range is shrunk when it reports too many results, so a busy
  token can never exhaust the worker. Reads on Ethereum, Base, Arbitrum, Optimism and Polygon.
  Answers the WASH_TRADING_DETECTION intent. No API key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: name a token by its address (0x...) or symbol. chain defaults to ethereum. blocks is the scan window and defaults to 120, capped at 600. The score is a heuristic over Transfer logs, not a proof of intent.
    param: token
    property: length
    value_num: 80
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Does token 0xabc... show
        wash-trading patterns on Ethereum?". The miner reads the token and the chain from it, so
        passing the whole question works as well as the fields.
    chain:
      type: string
      description: Chain to read on, one of ethereum, base, arbitrum, optimism, polygon.
    token:
      type: string
      description: Token address or symbol whose Transfer logs to scan.
    blocks:
      type: string
      description: Scan window in blocks, defaults to 120, capped at 600.

output_schema:
  type: object
  properties:
    chain:
      type: string
      description: Chain the answer is for.
    chain_id:
      type: integer
      description: EVM chain id.
    contract_address:
      type: string
      description: The token scanned.
    symbol:
      type: string
      description: The token symbol.
    window_blocks:
      type: integer
      description: The block window actually scanned.
    transfers:
      type: integer
      description: How many Transfer logs were analyzed.
    reciprocal_pairs:
      type: integer
      description: Address pairs that sent value both ways in the window.
    risk_score:
      type: number
      description: A bounded 0 to 1 blend of the measured signals.
    risk_label:
      type: string
      description: LOW, ELEVATED or HIGH.
    verified:
      type: boolean
      description: True when the risk label is LOW.
    confidence:
      type: number
      description: 0.9 for a direct Transfer-log scan.
    summary:
      type: string
      description: One sentence with the risk verdict and the key figures.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /washtrade
    external_path: /washtrade
    method: GET
    description: >
      Scan a token's recent Transfer logs for wash-trading signals as query parameters
      (?chain=ethereum&token=0x..&blocks=120). Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: risk_label
        description: LOW, ELEVATED or HIGH.
        source_path: risk_label
      - index: 1
        name: symbol
        description: The token symbol.
        source_path: symbol
      - index: 2
        name: summary
        description: One sentence with the risk verdict and the key figures.
        source_path: summary
    integers:
      - index: 0
        name: chain_id
        description: EVM chain id.
        source_path: chain_id
        multiplier: 1
      - index: 1
        name: transfers
        description: How many Transfer logs were analyzed.
        source_path: transfers
        multiplier: 1
  request:
    - endpoint: washtrade
      method: GET
      query_params:
        token: { source: strings.1 }
