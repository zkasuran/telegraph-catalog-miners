version: "1"
kind: miner
id: 7444
slug: metricwire-mining-hashprice-verify
protocol: generic
name: MetricWire Mining Hashprice Verify
description: >
  Bitcoin hashprice, the daily USD revenue per unit of hashrate. It is derived from live public
  Bitcoin network stats (mempool.space, with blockstream.info as a fallback) and the Kraken BTC price:
  daily network revenue, the block subsidy plus fees over the last 144 blocks, times the BTC price,
  divided by the network hashrate. The hashprice is reported per TH/s and per PH/s per day, with the
  hashrate, difficulty and BTC price. Answers the MINING_HASHPRICE_VERIFY intent. No API key.
base_url: https://telegraph-metric.margyn.workers.dev

docs:
  documentation: https://telegraph-metric.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: No parameter is required. The hashprice is a single network-wide figure for Bitcoin, derived live. A whole question is accepted and ignored beyond confirming it asks about Bitcoin hashprice.
    param: question
    property: length
    value_num: 256
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is the current Bitcoin
        hashprice?". No parameter is needed; the figure is network-wide.

output_schema:
  type: object
  properties:
    hashprice_usd_th_day:
      type: number
      description: Hashprice in USD per TH/s per day.
    hashprice_usd_ph_day:
      type: number
      description: Hashprice in USD per PH/s per day.
    network_hashrate_ehs:
      type: number
      description: Network hashrate in EH/s.
    difficulty:
      type: number
      description: Current mining difficulty.
    btc_price_usd:
      type: number
      description: BTC price in USD used in the calculation.
    daily_revenue_btc:
      type: number
      description: Daily network revenue in BTC, subsidy plus fees over the last 144 blocks.
    confidence:
      type: number
      description: 0.95 with live fees, 0.85 on the subsidy-only fallback.
    summary:
      type: string
      description: One sentence with the hashprice per TH/s and per PH/s at several grains.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /hashprice
    external_path: /hashprice
    method: GET
    description: >
      The current Bitcoin hashprice, a single network-wide figure. Takes no parameter. A whole
      question in ?question= or ?query= is accepted.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: One sentence with the hashprice per TH/s and per PH/s.
        source_path: summary
    integers:
      - index: 0
        name: hashprice_usd_th_day_x1000000
        description: Hashprice in USD per TH/s per day, scaled by one million.
        source_path: hashprice_usd_th_day
        multiplier: 1000000
      - index: 1
        name: btc_price_usd_x100
        description: BTC price in USD, scaled by one hundred.
        source_path: btc_price_usd
        multiplier: 100
      - index: 2
        name: network_hashrate_ehs_x100
        description: Network hashrate in EH/s, scaled by one hundred.
        source_path: network_hashrate_ehs
        multiplier: 100
  request:
    - endpoint: hashprice
      method: GET
      query_params: {}
