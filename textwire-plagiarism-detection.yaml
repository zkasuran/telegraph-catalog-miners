version: "1"
kind: miner
id: 7447
slug: textwire-plagiarism-detection
protocol: generic
name: TextWire Plagiarism Detection
description: >
  Plagiarism and originality assessment. Given a source and a suspect text the miner measures
  their verbatim word trigram overlap and their embedding similarity and states a verdict.
  Given a single text it reports an indicator based originality reading, stated plainly as
  having no external corpus match. The answer is produced with MiniMax under a commercial plan
  held by the operator, so this miner is not keyless. Serves the PLAGIARISM_DETECTION intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: source is capped at 8000 characters. A single passage, not a batch.
    param: source
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    source:
      type: string
      description: The source text to compare against.
    suspect:
      type: string
      description: The suspect text to check. Pass a single text as ?text= for an indicator reading.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The overlap and paraphrase verdict.
    overlap_trigram_jaccard:
      type: number
      description: The word trigram Jaccard overlap of the pair, 0 to 1.
    verdict:
      type: string
      description: The overlap verdict in a few words.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /plagiarism
    external_path: /plagiarism
    method: GET
    description: >
      The plagiarism assessment, a pair as ?source= and ?suspect= or a single text as ?text=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - PLAGIARISM_DETECTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The plagiarism verdict.
        source_path: summary
  request:
    - endpoint: plagiarism
      method: GET
      query_params:
        source: { source: strings.0 }
