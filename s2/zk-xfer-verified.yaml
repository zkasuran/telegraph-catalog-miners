version: "1"
kind: miner
id: 70174
slug: zk-xfer-verified
protocol: generic
name: VerifyWire Corroborated Transfer Verification
description: >
  Verify one real transaction from its hash on Ethereum, Base, Arbitrum, Optimism,
  Polygon, Ethereum Sepolia, Base Sepolia or Bitcoin mainnet. Reads two independent
  public providers, reconciles inclusion and contents, and returns parties, native
  value, confirmations and correctly scoped execution/blob/L1 fees. Transfer-event
  amounts use token metadata at the containing block only when independently
  corroborated. Bitcoin reports UTXO input/output amounts and fees without guessing
  which output is change or who owns an address. Pending, absence and unavailable
  evidence are distinct. No language model generates facts.
base_url: https://telegraph-verify.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /transfer
    external_path: /transfer
    method: GET
    description: >
      Pass the full question verbatim in question. It must contain exactly one
      transaction hash and at most one network. Bitcoin txids are 64 hexadecimal
      characters; EVM hashes are 0x-prefixed. Optional hash and chain parameters
      must agree with the question. Never replace the requested network or hash.
      Missing evidence produces an HTTP failure, not an invented transaction.
    intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
            description: The complete user question verbatim, including the transaction hash and requested network.
        optional:
          - name: hash
            type: string
            intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
            description: Exact transaction hash; must agree with the question if provided.
          - name: chain
            type: string
            intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
            description: Supported network name; must agree with the question if provided.
input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
    hash:
      type: string
      pattern: "^(0x)?[0-9a-fA-F]{64}$"
    chain:
      type: string
output_schema:
  type: object
  properties:
    summary: {type: string}
    hash: {type: string}
    chain: {type: string}
    found: {type: boolean}
    status: {type: string}
    confirmations: {type: integer}
    value_wei: {type: string}
    value_native: {type: string}
    fee_wei: {type: [string, "null"]}
    gas_burned_wei: {type: [string, "null"]}
    transfer_events: {type: array}
    inputs: {type: array}
    outputs: {type: array}
    fee_sats: {type: [string, "null"]}
    independently_verified: {type: boolean}
    sources: {type: array}
    as_of: {type: string}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
