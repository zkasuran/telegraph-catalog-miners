version: "1"
kind: miner
id: 70853
slug: zk-window-intl
protocol: generic
name: Cross-Checked Domestic and International Delivery Windows
description: >-
  Reports published FedEx Ground and six UPS domestic service bounds, plus the
  UPS Worldwide Expedited international service range, from licensed public
  data independently cross-checked with carrier or publisher documentation.
  These are conditional standard service estimates, never lane availability
  verification, tracking results or promised parcel arrival dates. No model
  generates facts. Unsupported scopes return explicit unverified answers.
base_url: https://telegraph-ship.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  website: https://en.wikipedia.org/wiki/United_Parcel_Service
  documentation: https://www.pitneybowes.com/us/blog/ups-shipping-options.html
endpoints:
  - path: /delivery-window-verify
    external_path: /delivery-window-verify
    method: GET
    description: >-
      Copy the complete carrier/service and origin-to-destination route without
      dropping qualifications. FedEx Ground/FEDEX_GROUND covers verified US
      regions, including Alaska/Hawaii. UPS Ground, 3 Day Select, 2nd Day Air,
      Next Day Air, Next Day Air Saver and Next Day Air Early cover contiguous-US
      scopes. UPS Worldwide Expedited/UPS_WORLDWIDE_EXPEDITED covers conditional
      international estimates between different countries among United States,
      Canada, United Kingdom and France. Use full country names for country
      scopes; foreign cities must be London with GB/United Kingdom, Paris with
      FR/France, or Toronto with CA/Canada and optional ON. US city/state and
      verified ZIP-region forms are accepted. This is not a lane quote or parcel
      promise. Unsupported scopes return HTTP 200 without numeric bounds;
      malformed/duplicate/additional inputs return 422; expired sources that
      cannot be verified return 503.
    intents: [DELIVERY_WINDOW_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: carrier
            type: string
            intents: ["*"]
            description: Exact named carrier/service; max 256 UTF-8 bytes; do not substitute a service.
          - name: route
            type: string
            intents: ["*"]
            description: Complete origin to destination, max 256 UTF-8 bytes; preserve every qualification.
input_schema:
  type: object
  required: [carrier, route]
  additionalProperties: false
  properties:
    carrier: {type: string}
    route: {type: string}
output_schema:
  type: object
  required: [carrier, route, is_estimate, summary, answer]
  properties:
    carrier: {type: string}
    route: {type: string}
    transit_days_max: {type: number, minimum: 0, maximum: 365}
    transit_days_min: {type: number, minimum: 0, maximum: 365}
    is_estimate: {type: boolean}
    as_of: {type: string}
    source: {type: string}
    summary: {type: string}
    answer: {type: string}
    verification_status: {type: string}
    reason_code: {type: string}
intent_mapping:
  DELIVERY_WINDOW_VERIFY_GENERAL:
    endpoint: /delivery-window-verify
    input:
      carrier: {from: carrier, how: "Copy the exact requested carrier and service; never substitute."}
      route: {from: route, how: "Copy the entire route including qualifications; do not discard dates or claims."}
    output:
      carrier: {path: carrier}
      route: {path: route}
      transit_days_max: {path: transit_days_max, unit: days}
      transit_days_min: {path: transit_days_min, unit: days}
      is_estimate: {path: is_estimate}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [DELIVERY_WINDOW_VERIFY_GENERAL]
errors:
  message_path: summary
  code_path: error
