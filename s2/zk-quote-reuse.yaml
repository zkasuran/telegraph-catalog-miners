version: '1'
kind: miner
id: 780140
slug: zk-quote-reuse
protocol: generic
name: ZK Quotation-Aware Text Reuse
description: >-
  Compare caller-supplied source and suspect passages using deterministic Unicode
  lexical alignment, exact and normalized containment, and overlap evidence with
  original offsets. Distinguish matching lexical units inside detected quotations,
  outside quotations and in literal reference markup. Citation cues are syntax
  only; their validity is not verified. Properly attributed quotation overlap
  alone does not establish plagiarism. No model, corpus search or calibrated
  plagiarism probability; a lone passage without a reference yields inconclusive.
base_url: https://telegraph-text.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 2
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /plagiarism
    external_path: /plagiarism
    method: GET
    description: >-
      Compare two literal passages using source and suspect, each at most 8000
      UTF-16 code units. Preserve quotation marks and reference markup verbatim.
      Alternatively use question with Source: and Suspect: on separate line
      headers. A lone text or question without reference yields inconclusive.
      Quotation parsing supports paired straight double, curly double/single,
      guillemet and CJK marks, Markdown > lines and HTML blockquotes. HTML tag
      attributes and literal <ref> contents are excluded from quote scanning.
      Unclosed boundaries, plain indentation and straight single quotes are not
      counted. Citation cues and overlap are observations, not plagiarism labels.
      Duplicate parameters, empty passages and incomplete pairs return 400;
      oversized passages return 413 without truncation.
    intents: [PLAGIARISM_DETECTION_GENERAL]
    params:
      query:
        optional:
          - name: source
            type: string
            intents: ['*']
            description: Reference passage; required with suspect for direct comparison.
          - name: suspect
            type: string
            intents: ['*']
            description: Suspect passage; include its actual quotation and citation syntax.
          - name: text
            type: string
            intents: ['*']
            description: Lone passage, or suspect passage when source is supplied.
          - name: question
            type: string
            intents: ['*']
            description: Literal request with separate Source and Suspect line headers, or one passage.
input_schema:
  type: object
  properties:
    source: {type: string, maxLength: 8000}
    suspect: {type: string, maxLength: 8000}
    text: {type: string, maxLength: 8000}
    question: {type: string}
output_schema:
  type: object
  required: [summary, verdict, confidence, plagiarism_status, external_corpus_searched]
  properties:
    summary: {type: string}
    verdict: {type: string}
    confidence: {type: 'null'}
    plagiarism_status: {type: string, enum: [undetermined]}
    semantic_cosine: {type: 'null'}
    exact_match: {type: boolean}
    suspect_is_verbatim_excerpt: {type: boolean}
    normalized_lexical_exact_match: {type: boolean}
    suspect_is_normalized_lexical_excerpt: {type: boolean}
    longest_normalized_match_lexical_units: {type: integer}
    longest_normalized_match: {type: [object, 'null']}
    overlap_trigram_jaccard: {type: [number, 'null']}
    suspect_trigram_containment: {type: [number, 'null']}
    suspect_token_coverage_from_matching_trigrams: {type: [number, 'null']}
    matching_trigram_lexical_units_inside_quotations: {type: integer}
    matching_trigram_lexical_units_outside_quotations: {type: integer}
    matching_trigram_lexical_units_in_reference_markup: {type: integer}
    quotation_marked_lexical_units: {type: integer}
    quotation_spans: {type: array}
    quotation_spans_truncated: {type: boolean}
    unmatched_quotation_mark_count: {type: integer}
    citation_cues_present: {type: boolean}
    citation_cues: {type: array}
    citation_validity: {type: string, enum: [not_verified]}
    evidence: {type: array}
    external_corpus_searched: {type: boolean}
    offset_unit: {type: string}
    as_of: {type: string}
semantics:
  supported_intents: [PLAGIARISM_DETECTION_GENERAL]
  signal_mapping:
    label_field: summary
    reason_field: summary
errors:
  code_path: error
  message_path: summary
limitations:
  - code: MAX_PARAM_VALUE
    message: Each source is limited to 8000 UTF-16 code units; never truncated.
    param: source
    property: length
    value_num: 8000
    operator: lte
  - code: MAX_PARAM_VALUE
    message: Each suspect is limited to 8000 UTF-16 code units; never truncated.
    param: suspect
    property: length
    value_num: 8000
    operator: lte
