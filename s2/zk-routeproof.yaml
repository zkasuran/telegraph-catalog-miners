version: "1"
kind: miner
id: 78463
slug: zk-routeproof
protocol: generic
name: RouteProof Ethereum Pool Quotes
description: >
  Keyless block-pinned quotes for selling exactly 1 ETH into USDC on Ethereum.
  Compares four direct Uniswap V3 fee tiers through a single read-only RPC call.
  Reports the highest quoted USDC output, pool fees and price impact with evidence
  that a second RPC can reproduce at the same block.
base_url: https://telegraph-s2-routeproof.margyn.workers.dev
auth:
  type: none
docs:
  website: https://telegraph-s2-routeproof.margyn.workers.dev/health
  documentation: https://docs.uniswap.org/contracts/v3/reference/deployments/ethereum-deployments
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: This miner declares a conservative node-wide cap of 200 requests per day.
    property: rate
    value_num: 200
    window_seconds: 86400
  - code: MAX_PARAM_SIZE
    message: Pair is the fixed canonical ETH/USDC enum, at most 32 bytes.
    param: pair
    property: size_bytes
    value_bytes: 32
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >
      Quote exactly 1000000000000000000 wei of ETH sold for Ethereum USDC.
      Send pair=ETH/USDC. Returns amount_out in integer USDC base units, not dollars.
      ETH wraps 1:1 into WETH; the largest output among four direct Uniswap V3 pools
      is selected before network gas. Unsupported pairs are explicitly unavailable.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Fixed canonical enum ETH/USDC, exactly 1 ETH sold on Ethereum.
            accepted_fields:
              - value: ETH/USDC
                intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
                description: Sell exactly 1 ETH for Ethereum mainnet USDC.
input_schema:
  type: object
  additionalProperties: false
  properties:
    pair:
      type: string
      enum: [ETH/USDC]
      default: ETH/USDC
      maxLength: 32
output_schema:
  type: object
  properties:
    amount_out:
      type: integer
      minimum: 100000000
      maximum: 100000000000
      description: USDC base units, 1000000 units per USDC.
    summary: {type: string}
    source: {type: [string, "null"]}
    as_of: {type: [string, "null"]}
    observed_at: {type: string}
    confidence: {type: number, minimum: 0, maximum: 1}
    status: {type: string, enum: [ok, unavailable]}
    attribution: {type: string}
    readings: {type: object}
    error: {type: object}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve ETH/USDC exactly; the intent fixes the size at 1 ETH and chain at Ethereum.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
