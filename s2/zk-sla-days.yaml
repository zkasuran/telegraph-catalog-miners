version: "1"
kind: miner
id: 781308
slug: zk-sla-days
protocol: generic
name: Public Homepage Availability — Bounded Day Windows
description: >-
  Reports Upptime's ODbL-licensed availability observations for Google homepage,
  English Wikipedia homepage, and Hacker News homepage. Supports fixed last N days
  for integer N from 1 through 365, plus the provider's last 24 hours, last 7 days,
  last month and last year statistics. Fixed-day results are two-decimal estimates
  from rounded daily incident minutes, with bounded partial-day allocations;
  ambiguous estimates abstain. These are single-monitor homepage observations,
  not product-wide availability or customer-specific contractual SLA compliance.
  Source revision, publication time, measurement basis and licence accompany each
  answer. No SLA target or compliance decision is presumed.
base_url: https://telegraph-ship.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  website: https://demo.upptime.js.org/
  documentation: https://github.com/upptime/upptime
errors:
  code_path: error
  message_path: summary
endpoints:
  - path: /sla-compliance
    external_path: /sla-compliance
    method: GET
    description: >-
      Get numeric uptime_pct in percent for the explicit service and historical
      period. Copy both canonical inputs without inferring a different service or
      window. Fixed last N days accepts integers 1 through 365. Last month/year
      retain the provider's separate calendar-lookback/fixed-denominator definitions.
      Unsupported scopes, unavailable sources and ambiguous boundary allocations
      return an error without a numeric uptime. Each success includes source data
      under ODbL with attribution and exact source revision.
    intents: [SLA_COMPLIANCE_GENERAL]
    params:
      query:
        required:
          - name: service
            type: string
            intents: ["*"]
            description: Explicit Google, Wikipedia or Hacker News homepage scope.
          - name: period
            type: string
            intents: ["*"]
            description: Last N days for integer N 1–365, last 24 hours, last month or last year.
input_schema:
  type: object
  required: [service, period]
  properties:
    service:
      type: string
      enum: [Google, Google homepage, Wikipedia, English Wikipedia homepage, Hacker News, Hacker News homepage]
    period:
      type: string
      pattern: '^last (24 hours|([1-9]|[1-9][0-9]|[12][0-9]{2}|3[0-5][0-9]|36[0-5]) days?|month|year)$'
output_schema:
  type: object
  required: [service, period, uptime_pct, source, source_revision, as_of, data_license]
  properties:
    service: {type: string}
    period: {type: string}
    uptime_pct: {type: number, minimum: 0, maximum: 100}
    source: {type: string}
    source_revision: {type: string}
    as_of: {type: string}
    data_license: {type: string}
intent_mapping:
  SLA_COMPLIANCE_GENERAL:
    endpoint: /sla-compliance
    input:
      service: {from: service}
      period: {from: period}
    output:
      service: {path: service}
      uptime_pct: {path: uptime_pct, unit: percent}
      period: {path: period}
semantics:
  supported_intents: [SLA_COMPLIANCE_GENERAL]
  signal_mapping:
    label_field: summary
    reason_field: source
