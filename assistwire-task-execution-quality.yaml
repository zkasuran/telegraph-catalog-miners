version: "1"
kind: miner
id: 7442
slug: assistwire-task-execution-quality
protocol: generic
name: AssistWire Task Execution Quality
description: >
  TASK_EXECUTION_QUALITY answers for queries that supply an agent or job's output together with the
  task it was given, produced by a language model at request time. Send the task, the output and any
  rubric or required schema. The miner returns a quality assessment of whether the output did
  what was asked, meets each criterion, matches the schema, with an overall verdict and the reasons
  tied to the rubric. The answer is produced with MiniMax under a commercial plan held by the
  operator, so this miner is not keyless. Serves the TASK_EXECUTION_QUALITY intent.
base_url: https://telegraph-assist.margyn.workers.dev

docs:
  documentation: https://telegraph-assist.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the task, the output and the rubric. A single execution, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language query, verbatim, carrying the task, the agent output and any
        rubric or schema, for example 'Here is the task spec and the agent output: score it against
        this rubric and the required JSON schema.'. The miner reads what to score from it.
    text:
      type: string
      description: The task, the output and the rubric, if supplied on their own.
    output:
      type: string
      description: The agent or job output to assess, an alternative name for the text.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the assessment, a short label for a reader.
    summary:
      type: string
      description: The quality assessment of the execution against the task and the rubric.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /task-quality
    external_path: /task-quality
    method: GET
    description: >
      Assess one execution, the task and output as a query parameter (?text=...). Also accepts a
      whole question in ?question= or ?query= or the output in ?output=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TASK_EXECUTION_QUALITY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the assessment.
        source_path: headline
      - index: 1
        name: summary
        description: The quality assessment of the execution.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: task-quality
      method: GET
      query_params:
        text: { source: strings.1 }
