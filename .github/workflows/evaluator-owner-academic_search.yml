{
  "name": "Academic title scorer CPU qualification",
  "on": {"workflow_dispatch": {"inputs": {
    "mode": {"description": "Bounded training or verified serving", "type": "choice", "options": ["train", "serve"], "default": "train", "required": true},
    "package_url": {"type": "string", "default": ""},
    "package_sha256": {"type": "string", "default": ""},
    "package_keccak": {"type": "string", "default": ""},
    "report_url": {"type": "string", "default": ""},
    "report_sha256": {"type": "string", "default": ""},
    "slot": {"type": "string", "default": "0"},
    "forward_port": {"type": "string", "default": "0"},
    "runnable_url": {"type": "string", "default": ""}
  }}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "academic-owner-${{ inputs.mode }}", "cancel-in-progress": false},
  "jobs": {"academic": {
    "runs-on": "ubuntu-24.04",
    "timeout-minutes": 350,
    "env": {"PYTHONDONTWRITEBYTECODE": "1", "TOKENIZERS_PARALLELISM": "false", "OMP_NUM_THREADS": "4", "MKL_NUM_THREADS": "4", "OPENBLAS_NUM_THREADS": "4", "CUDA_VISIBLE_DEVICES": "", "HF_HUB_DISABLE_IMPLICIT_TOKEN": "1"},
    "steps": [
      {"uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": {"persist-credentials": false, "sparse-checkout-cone-mode": false, "sparse-checkout": "/verification/owners/academic_search/\n/verification/registration/common.py\n/.github/workflows/evaluator-owner-academic_search.yml"}},
      {"name": "Actual packaged source gate", "run": "bash verification/owners/academic_search/verify.sh", "timeout-minutes": 3},
      {"uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16", "with": {"go-version": "1.25.7", "cache": false}},
      {"name": "Pinned CPU dependencies and actual advisory audit", "if": "${{ inputs.mode == 'train' }}", "timeout-minutes": 15,
       "run": "python3 -m venv \"$RUNNER_TEMP/academic-venv\"\n\"$RUNNER_TEMP/academic-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/academic_search/requirements.lock\n\"$RUNNER_TEMP/academic-venv/bin/python\" -m pip check\nmkdir -p \"$RUNNER_TEMP/academic-result\"\n\"$RUNNER_TEMP/academic-venv/bin/python\" verification/owners/academic_search/dependency_audit.py --lock verification/owners/academic_search/requirements.lock --out \"$RUNNER_TEMP/academic-audit-requirements.txt\" --report \"$RUNNER_TEMP/academic-result/dependency-audit.json\""},
      {"name": "Frozen training audit export and real reference engine", "if": "${{ inputs.mode == 'train' }}", "timeout-minutes": 320,
       "run": "timeout --signal=TERM --kill-after=20s 18900 \"$RUNNER_TEMP/academic-venv/bin/python\" verification/owners/academic_search/pipeline.py --root \"$RUNNER_TEMP/academic-result\""},
      {"name": "Preserve licensed success and failure evidence", "id": "preserve", "if": "${{ always() && inputs.mode == 'train' }}", "timeout-minutes": 3,
       "run": "python3 verification/owners/academic_search/preserve.py --root \"$RUNNER_TEMP/academic-result\""},
      {"name": "Upload bounded actual qualification artifact", "if": "${{ always() && inputs.mode == 'train' && steps.preserve.outcome == 'success' }}", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
       "with": {"name": "academic-owner-result-${{ github.run_id }}", "retention-days": 7, "if-no-files-found": "error", "path": "${{ runner.temp }}/academic-result/public-results/"}},
      {"name": "Prepare byte-identical executor and restricted public lease", "if": "${{ inputs.mode == 'serve' }}", "timeout-minutes": 20,
       "env": {"PACKAGE_URL": "${{ inputs.package_url }}", "PACKAGE_SHA": "${{ inputs.package_sha256 }}", "PACKAGE_KECCAK": "${{ inputs.package_keccak }}", "REPORT_URL": "${{ inputs.report_url }}", "REPORT_SHA": "${{ inputs.report_sha256 }}", "SLOT": "${{ inputs.slot }}", "FORWARD_PORT": "${{ inputs.forward_port }}", "RUNNABLE_URL": "${{ inputs.runnable_url }}"},
       "run": "python3 verification/owners/academic_search/serving.py prepare --root \"$RUNNER_TEMP/academic-serving\" --package-url \"$PACKAGE_URL\" --package-sha256 \"$PACKAGE_SHA\" --package-keccak \"$PACKAGE_KECCAK\" --report-url \"$REPORT_URL\" --report-sha256 \"$REPORT_SHA\" --slot \"$SLOT\" --forward-port \"$FORWARD_PORT\" --runnable-url \"$RUNNABLE_URL\""},
      {"name": "Upload ONLY restricted public forwarding lease", "if": "${{ inputs.mode == 'serve' }}", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
       "with": {"name": "academic-owner-lease-${{ github.run_id }}", "retention-days": 1, "if-no-files-found": "error", "path": "${{ runner.temp }}/academic-serving/restricted-public-lease.json"}},
      {"name": "Bounded forwarding after automatic key activation", "if": "${{ inputs.mode == 'serve' }}", "timeout-minutes": 300,
       "run": "timeout --signal=TERM --kill-after=20s 18000 python3 verification/owners/academic_search/serving.py forward --root \"$RUNNER_TEMP/academic-serving\""}
    ]
  }}
}
