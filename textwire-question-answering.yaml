version: "1"
kind: miner
id: 7445
slug: textwire-question-answering
protocol: generic
name: TextWire Question Answering
description: >
  Open domain and context bounded question answering, produced by a language model at request
  time. Send the question (and an optional context passage) and the miner returns a direct,
  complete answer leading with the answer then the supporting facts. The answer is produced
  with MiniMax under a commercial plan held by the operator, so this miner is not keyless.
  Serves the QUESTION_ANSWERING intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The question to answer, optionally with a context passage.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The direct answer with its supporting facts.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /answer
    external_path: /answer
    method: GET
    description: >
      The answer to one question, passed as ?text= or ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - QUESTION_ANSWERING

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The answer.
        source_path: summary
  request:
    - endpoint: answer
      method: GET
      query_params:
        text: { source: strings.0 }
