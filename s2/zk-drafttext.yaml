version: '1'
kind: miner
id: 789421
slug: zk-drafttext
protocol: generic
name: DraftText source-faithful writing
description: >-
  Generates requested writing with GPT-OSS 120B through Cloudflare Workers AI's free daily allocation.
  Preserves supplied facts when rewriting. No API key or payment path is exposed.
  Failed or incomplete upstream answers are explicitly unavailable and omit scored fields.
base_url: https://telegraph-s2-drafttext.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://developers.cloudflare.com/workers-ai/models/gpt-oss-120b/
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: Conservative cap of 20 new calls per day; shared free-account capacity can be exhausted earlier.
    property: rate
    value_num: 20
    window_seconds: 86400
  - code: MINER_RATE
    message: At most one new request per 1.1 seconds per isolate.
    property: rate
    value_num: 1
    window_seconds: 2
  - code: MAX_PARAM_SIZE
    message: prompt must be no more than 4096 UTF-8 bytes.
    param: prompt
    property: size_bytes
    value_bytes: 4096
    operator: lte
  - code: SHORT_FORM_ONLY
    message: Short-form writing below 400 words with at most 2048 model completion tokens including reasoning.
errors:
  status_path: status
  success_values: [ok]
  message_path: summary
  code_path: code
input_schema:
  type: object
  properties:
    prompt:
      type: string
      minLength: 1
      maxLength: 4096
      description: Writing task and any source text whose facts must be preserved.
output_schema:
  type: object
  properties:
    text: {type: string}
    title: {type: string}
    brief: {type: string, maxLength: 80}
    summary: {type: string}
    confidence: {type: number, minimum: 0, maximum: 1}
    source: {type: string}
    as_of: {type: string}
    status: {type: string, enum: [ok, unavailable]}
endpoints:
  - path: /generate
    external_path: /generate
    method: GET
    description: >-
      Write, rewrite or format short text according to prompt. Supply factual source material inside prompt.
      Returns text and title plus brief, computed from the opening sentence with an 80-character cap.
      Empty or invalid input returns a fast unavailable response without a fabricated answer.
    intents: [TEXT_GENERATION_GENERAL]
    params:
      query:
        required:
          - name: prompt
            type: string
            intents: [TEXT_GENERATION_GENERAL]
            description: A nonempty writing task with source content, at most 4096 UTF-8 bytes, requesting under 400 words.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [TEXT_GENERATION_GENERAL]
intent_mapping:
  TEXT_GENERATION_GENERAL:
    endpoint: /generate
    input:
      prompt:
        from: prompt
        how: Copy the complete writing instruction and any supplied source text verbatim.
    output:
      text: {path: text}
      title: {path: title}
      brief: {path: brief}
