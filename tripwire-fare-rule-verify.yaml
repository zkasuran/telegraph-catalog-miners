version: "1"
kind: miner
id: 7607
slug: tripwire-fare-rule-verify
protocol: generic
name: TripWire Fare Rule Verify
description: >
  Airline fare-rule check, answered by a language model at request time. Send the fare
  conditions and the action to check such as a change, a cancellation, a refund, a no-show or
  a baggage allowance and the miner returns a clear verdict (permitted, not permitted,
  permitted with a fee, conditional or insufficient information) naming the rule that decides
  it and any fee, deadline or condition. This reads the stated rules, so no GDS or airline
  inventory feed is used. The answer is produced with MiniMax under a commercial plan held by
  the operator, so this miner is not keyless. Serves the FARE_RULE_VERIFY intent.
base_url: https://telegraph-trip.margyn.workers.dev

docs:
  documentation: https://telegraph-trip.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the fare rules and the action to check. Passing the whole question verbatim works too. A single passage, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: The full natural-language question, verbatim. The miner reads the subject from it, so passing the whole question works as well as passing the subject on its own.
    query:
      type: string
      description: The subject to assess, if sent on its own rather than inside a question.
    text:
      type: string
      description: The subject text to assess.
    rules:
      type: string
      description: The fare conditions or ticket rules to apply.
    scenario:
      type: string
      description: The fare rules and the action to check against them.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of permitted, not permitted, permitted with a fee, conditional or insufficient information.
    summary:
      type: string
      description: "The answer the node grades: the verdict or figure followed by one or two sentences of reasoning."
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /fare-rule-verify
    external_path: /fare-rule-verify
    method: GET
    description: >
      Fare-rule check for one ticket, the rules and the action as a query parameter
      (?question=...). Also accepts ?query=, ?text=, ?rules= or ?scenario=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - FARE_RULE_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The full graded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: fare-rule-verify
      method: GET
      query_params:
        question: { source: strings.1 }
