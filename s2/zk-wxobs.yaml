{
  "version": "1",
  "kind": "miner",
  "id": 78131,
  "slug": "zk-wxobs",
  "protocol": "generic",
  "name": "SkyWire Recorded Weather Verification",
  "description": "Recorded daily station observations for a named place or caller coordinates and exact past date. NOAA GHCN-Daily primary with a bounded original ECCC daily-observation fallback when Canadian NOAA records are absent or unavailable; official ECCC CSV corroboration, IEM/NWS distribution checks, 50 km station limit, quality flags and provenance. Missing values and unresolved identities are withheld. No current forecast is substituted for a past observation.",
  "base_url": "https://telegraph-sky.margyn.workers.dev",
  "auth": {
    "type": "none"
  },
  "rate_limit_per_sec": 1,
  "cache_ttl_sec": 60,
  "circuit_threshold": 5,
  "circuit_cooldown_seconds": 30,
  "docs": {
    "documentation": "https://telegraph-sky.margyn.workers.dev/",
    "website": "https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily"
  },
  "errors": {
    "message_path": "summary",
    "status_path": "status",
    "success_values": [
      "observed",
      "partially_verified"
    ]
  },
  "input_schema": {
    "type": "object",
    "required": [
      "location",
      "date"
    ],
    "properties": {
      "location": {
        "type": "string",
        "minLength": 1,
        "maxLength": 256,
        "description": "City/place with state/country, or latitude,longitude."
      },
      "date": {
        "type": "string",
        "format": "date",
        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
        "description": "Valid past calendar date in YYYY-MM-DD."
      }
    }
  },
  "output_schema": {
    "type": "object",
    "properties": {
      "location": {
        "type": "string"
      },
      "date": {
        "type": "string",
        "format": "date"
      },
      "temp_max_c": {
        "type": [
          "number",
          "null"
        ]
      },
      "temp_min_c": {
        "type": [
          "number",
          "null"
        ]
      },
      "precipitation_mm": {
        "type": [
          "number",
          "null"
        ]
      },
      "condition": {
        "type": [
          "string",
          "null"
        ]
      },
      "summary": {
        "type": "string"
      },
      "status": {
        "type": "string"
      }
    }
  },
  "endpoints": [
    {
      "path": "/forecast-verify",
      "external_path": "/forecast-verify",
      "method": "GET",
      "description": "Copy canonical location and exact past date as query parameters; returns recorded station high/low in Celsius and precipitation in mm with source provenance.",
      "intents": [
        "WEATHER_FORECAST_VERIFY_GENERAL"
      ],
      "params": {
        "query": {
          "required": [
            {
              "name": "location",
              "type": "string",
              "intents": [
                "*"
              ],
              "description": "Requested place plus state/country or caller coordinates, verbatim."
            },
            {
              "name": "date",
              "type": "string",
              "intents": [
                "*"
              ],
              "description": "Requested past YYYY-MM-DD date, verbatim; never substitute today."
            }
          ]
        }
      }
    }
  ],
  "semantics": {
    "signal_mapping": {
      "label_field": "summary",
      "reason_field": "summary"
    },
    "supported_intents": [
      "WEATHER_FORECAST_VERIFY_GENERAL"
    ]
  },
  "intent_mapping": {
    "WEATHER_FORECAST_VERIFY_GENERAL": {
      "endpoint": "/forecast-verify",
      "input": {
        "location": {
          "from": "location",
          "how": "Copy verbatim."
        },
        "date": {
          "from": "date",
          "how": "Copy requested YYYY-MM-DD past date verbatim."
        }
      },
      "output": {
        "location": {
          "path": "location"
        },
        "date": {
          "path": "date"
        },
        "condition": {
          "path": "condition"
        },
        "temp_max_c": {
          "path": "temp_max_c",
          "unit": "degrees Celsius"
        },
        "temp_min_c": {
          "path": "temp_min_c",
          "unit": "degrees Celsius"
        },
        "precipitation_mm": {
          "path": "precipitation_mm",
          "unit": "mm"
        }
      }
    }
  }
}
