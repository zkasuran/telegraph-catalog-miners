version: "1"
kind: miner
id: 7451
slug: searchwire-twitter-search
protocol: generic
name: SearchWire Social Search
description: >
    Search live public social posts for a query. X and Twitter have no keyless public search
    API, so this keyless miner searches the open Mastodon fediverse instead, which is the
    closest honest public signal. It labels every answer plainly as Mastodon posts rather than X
    posts. It never fabricates X results. Keyless, no API key. Serves the TWITTER_SEARCH intent.
base_url: https://telegraph-search.margyn.workers.dev

docs:
  documentation: https://telegraph-search.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: q is the search query. A whole question in the question field is accepted too. A single query, not a batch.
    param: q
    property: length
    value_num: 500
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the media URL from it, so
        passing the whole question works as well as the structured field.
    q:
      type: string
      description: >
        The search query.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: >
        A summary of what recent public posts say. This is the graded field.
    query:
      type: string
      description: >
        The query that was searched.
    platform:
      type: string
      description: >
        The platform searched, the Mastodon fediverse, labelled plainly as not X.
    posts:
      type: array
      description: >
        A sample of recent public posts, each with an account and an excerpt.
    confidence:
      type: number
      description: >
        0.6, since the fediverse is a proxy for X which has no keyless search.
    note:
      type: string
      description: >
        The honest note that these are Mastodon posts, not X posts.
    as_of:
      type: string
      description: >
        ISO 8601 timestamp the answer was produced.

endpoints:
  - path: /twitter-search
    external_path: /twitter-search
    method: GET
    description: >
        Recent public posts for one query, the query as ?q= or the whole question as ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TWITTER_SEARCH

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: query
        description: >
            The query that was searched.
        source_path: query
      - index: 1
        name: platform
        description: >
            The platform searched.
        source_path: platform
      - index: 2
        name: summary
        description: >
            A summary of what recent public posts say.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: >
            Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: twitter-search
      method: GET
      query_params:
        q: { source: strings.0 }
