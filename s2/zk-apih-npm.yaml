version: "1"
kind: miner
id: 70149
slug: zk-apih-npm
protocol: generic
name: GuardWire Public API Health
description: >-
  Live manual-redirect HTTP GET to the public endpoint the caller names,
  with actual status and header latency in milliseconds. Separately reports
  documented first-party publisher health for GitHub, Cloudflare, Discord,
  DigitalOcean, Vercel, Coinbase, npm and Claude/Anthropic where supported.
  A returned authentication or method error is not called a global outage.
base_url: https://telegraph-guard.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_VALUE
    message: Exactly one public HTTP(S) endpoint, bare host or supported provider, at most 2048 characters.
    param: url
    property: length
    value_num: 2048
    operator: lte
input_schema:
  type: object
  required: [url]
  properties:
    url:
      type: string
      maxLength: 2048
      description: Complete endpoint URL or verbatim question naming one endpoint/provider; preserve port, path and query.
output_schema:
  type: object
  required: [intent, url, summary, healthy, up, confidence, as_of]
  properties:
    intent: {type: string}
    url: {type: string}
    summary: {type: string}
    healthy: {type: [boolean, "null"]}
    up: {type: boolean}
    status_code: {type: [integer, "null"]}
    response_time_ms: {type: [integer, "null"]}
    confidence: {type: number}
    as_of: {type: string}
endpoints:
  - path: /api-health
    external_path: /api-health
    method: GET
    description: Live HTTP observation of one endpoint and separately attributed official API/service status.
    intents: [API_HEALTH_CHECK_GENERAL]
    params:
      query:
        required:
          - name: url
            type: string
            intents: [API_HEALTH_CHECK_GENERAL]
            description: Complete public endpoint or whole question naming one supported service; preserve all URL components.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [API_HEALTH_CHECK_GENERAL]
