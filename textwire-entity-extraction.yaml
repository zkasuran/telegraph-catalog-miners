version: "1"
kind: miner
id: 7442
slug: textwire-entity-extraction
protocol: generic
name: TextWire Entity Extraction
description: >
  Named entity extraction for a text, produced by a language model at request time. Send the
  text and the miner returns the people, organizations, locations and dates it names, grouped
  by type, with real character offsets computed against the source. The answer is produced
  with MiniMax under a commercial plan held by the operator, so this miner is not keyless.
  Serves the ENTITY_EXTRACTION intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The text to extract named entities from.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The entities grouped under People, Organizations, Locations and Dates.
    entities:
      type: object
      description: The entities as an object keyed by type, each with text and character offsets.
    count:
      type: number
      description: How many entities were returned.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /entities
    external_path: /entities
    method: GET
    description: >
      The named entities for one passage, the text as ?text= (or the whole question as ?question=).

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - ENTITY_EXTRACTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The entities grouped by type.
        source_path: summary
    integers:
      - index: 0
        name: count
        description: How many entities were returned.
        source_path: count
  request:
    - endpoint: entities
      method: GET
      query_params:
        text: { source: strings.0 }
