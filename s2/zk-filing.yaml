version: "1"
kind: miner
id: 77131
slug: zk-filing
protocol: generic
name: Filing Window
description: >
  Keyless SEC filing counts for named issuers and explicit filing-date windows.
  Returns all matching form titles and live filing-metadata links with acceptance times and accession numbers.
  Reads SEC submissions and any intersecting history files; refuses incomplete coverage.
base_url: https://telegraph-s2-filing.margyn.workers.dev
auth:
  type: none
docs:
  website: https://telegraph-s2-filing.margyn.workers.dev/health
  documentation: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_SIZE
    message: Entity and period are limited to 256 UTF-8 bytes each.
    property: size_bytes
    value_bytes: 256
    operator: lte
    param: entity
  - code: MAX_PARAM_VALUE
    message: Search windows are limited to ten years, three history files and 500 matching filings.
    property: value
    value_num: 500
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: ["ok"]
endpoints:
  - path: /filings
    external_path: /filings
    method: GET
    description: >
      Count SEC EDGAR filings for entity during period, based on inclusive filing dates.
      Entity is an exact issuer name, stock ticker or CIK. An optional exact form suffix
      in entity, such as Tesla 10-Q or AAPL 10-K, filters the count without including amendments.
      Period accepts last N days, weeks, months or years; YYYY; YYYY-Qn; since YYYY-MM-DD;
      a single YYYY-MM-DD; or YYYY-MM-DD..YYYY-MM-DD. Rolling windows use UTC calendar dates.
      Returns complete matching titles and Worker-hosted live filing-metadata URLs.
      Each URL verifies one accession in the SEC API and includes the official SEC index and document links.
      Metadata links work without a SEC contact header; official documents retain SEC access requirements.
      Supports SEC issuers only and does not interpret filing-body financial disclosures.
    intents: [REGULATORY_FILING_MONITOR_GENERAL]
    params:
      query:
        required:
          - name: entity
            type: string
            intents: ["*"]
            description: Exact issuer name, ticker or numeric CIK, optionally followed by an exact SEC form code; at most 256 UTF-8 bytes.
          - name: period
            type: string
            intents: ["*"]
            description: Inclusive filing-date period, e.g. last 12 months, 2026-Q3 or 2026-07-01..2026-09-30; at most 256 UTF-8 bytes.
        optional:
          - name: form
            type: string
            intents: ["*"]
            description: Exact SEC form code, e.g. 10-K, 10-Q, 8-K or 10-K/A; defaults to all forms.
input_schema:
  type: object
  properties:
    entity: {type: string, maxLength: 256}
    period: {type: string, maxLength: 256}
    form: {type: string, maxLength: 28}
output_schema:
  type: object
  properties:
    entity: {type: string}
    filing_count: {type: integer, minimum: 0, maximum: 500}
    filings: {type: array, items: {type: string}}
    urls: {type: array, items: {type: string}}
    summary: {type: string}
    source: {type: string}
    as_of: {type: string}
    confidence: {type: number, minimum: 0, maximum: 1}
    status: {type: string}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [REGULATORY_FILING_MONITOR_GENERAL]
intent_mapping:
  REGULATORY_FILING_MONITOR_GENERAL:
    endpoint: /filings
    input:
      entity:
        from: entity
        how: Keep the issuer name, ticker or CIK; retain an exact SEC form suffix if the request includes one.
      period:
        from: period
        how: Use last N days, weeks, months or years, YYYY, YYYY-Qn, since YYYY-MM-DD or YYYY-MM-DD..YYYY-MM-DD.
    output:
      entity: {path: entity}
      filing_count: {path: filing_count, unit: filings}
      filings: {path: filings, how: Copy the full title list in its existing newest-first order.}
      urls: {path: urls, how: Copy the full URL list in the same order as filings.}
