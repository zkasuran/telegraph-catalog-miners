version: "1"
kind: miner
id: 731076
slug: zk-regr-ci
protocol: generic
name: ZK Public CI Regression Verifier
description: >-
  Verify public GitHub Actions CI outcomes for an exact run or commit.
  Compare source-backed CI outcomes with explicit evidence levels: detailed REST
  job comparisons, or public workflow-summary comparisons when REST is limited.
  Report scoped CI passes and abstain on missing evidence; do not infer software
  causality or individual assertions from workflow summaries.
base_url: https://telegraph-s2-regr-ci.margyn.workers.dev
auth:
  type: none
endpoints:
  - path: /verify
    external_path: /verify
    method: GET
    description: >-
      Verify the change using published GitHub Actions CI job and step results.
      Pass the canonical change string verbatim. Preferred input is a public
      https://github.com/owner/repo/actions/runs/123 URL; optionally provide
      baseline_run_URL -> current_run_URL in that order for the same repository.
      Also accepts a public commit URL, pull-request URL, or owner/repo@commitSHA.
      To select the keyless public-page route explicitly, include the words
      "public workflow summary" in change before the run URL(s). Public-summary
      comparisons require an explicit earlier-created same-branch push baseline
      and report workflow-level outcomes only, not individual jobs or tests.
      On the REST route, a successful executed job supports a scoped CI pass;
      a job regression requires a uniquely matched previously successful check.
      No scored boolean is emitted when verification is inconclusive.
    intents: [REGRESSION_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: change
            type: string
            intents: [REGRESSION_VERIFY_GENERAL]
            description: >-
              Public GitHub repository and exact CI run or commit to check,
              supplied as a URL or owner/repo@commitSHA; optionally two run URLs
              in baseline -> current order. Preserve the complete canonical
              change string; maximum 16000 characters. Private repositories,
              arbitrary code snippets, and unsupported CI services cannot be verified.
input_schema:
  type: object
  required: [change]
  properties:
    change:
      type: string
      minLength: 1
      maxLength: 16000
output_schema:
  type: object
  required: [verdict, failing_tests, summary, source, as_of]
  properties:
    regression_found:
      type: boolean
      description: Present only for a verifiable scoped CI pass or check regression.
    verdict:
      type: string
      enum: [pass, fail, inconclusive]
    failing_tests:
      type: array
      items:
        type: object
    summary:
      type: string
    source:
      type: [string, "null"]
    as_of:
      type: [string, "null"]
intent_mapping:
  REGRESSION_VERIFY_GENERAL:
    endpoint: /verify
    input:
      change:
        from: change
        how: Copy the complete canonical change string verbatim, preserving any baseline -> current run URL order.
    output:
      regression_found:
        path: regression_found
        how: Copy the boolean verbatim; when absent the result is missing, never infer false from an inconclusive verdict.
      verdict:
        path: verdict
      failing_tests:
        path: failing_tests
        how: >-
          Copy the evidence-level-labelled list: REST job/step records or public
          workflow filename records; never infer individual failed assertions.
      summary:
        path: summary
semantics:
  supported_intents: [REGRESSION_VERIFY_GENERAL]
  signal_mapping:
    label_field: verdict
    reason_field: summary
errors:
  message_path: error
  code_path: code
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 60
