version: "1"
kind: miner
id: 7453
slug: tradewire-commerce-purchase-verify
protocol: generic
name: TradeWire Commerce Purchase Verify
description: >
  Verify whether a described purchase or receipt is internally consistent and plausible. Send the
  purchase, its line items, totals, tax, currency, date, merchant and payment method. The miner
  first checks the arithmetic it can (line items multiply out, subtotal plus tax equals the total),
  then returns a clear verdict (verified, discrepancy found, cannot verify or insufficient
  information) naming the decisive check. The verdict is produced with MiniMax under a commercial
  plan held by the operator and grounded in the deterministic checks, so this miner is not keyless.
  Serves the COMMERCE_PURCHASE_VERIFY intent.
base_url: https://telegraph-trade.margyn.workers.dev

docs:
  documentation: https://telegraph-trade.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the purchase or receipt to verify, with its figures. A single document, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full purchase or receipt to verify, verbatim, with its line items, subtotal, tax and
        total. Passing the whole question works as well as passing the document on its own.
    query:
      type: string
      description: The purchase or receipt to verify.
    text:
      type: string
      description: The purchase or receipt text to verify.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of Verified, Discrepancy found, Cannot verify or Insufficient information.
    summary:
      type: string
      description: The verdict followed by one or two sentences naming the checks and any discrepancy with the figures.
    checks_passed:
      type: array
      description: The arithmetic relationships that reconciled.
    discrepancies:
      type: array
      description: The arithmetic relationships that did not reconcile.
    confidence:
      type: number
      description: 0.95 for a grounded model verdict, lower when degraded to arithmetic only.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /purchase-verify
    external_path: /purchase-verify
    method: GET
    description: >
      Verify one described purchase or receipt, as a query parameter (?question=...). Also accepts
      ?query= or ?text=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - COMMERCE_PURCHASE_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The purchase verification verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The verdict plus the decisive check and any discrepancy.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: purchase-verify
      method: GET
      query_params:
        question: { source: strings.1 }
