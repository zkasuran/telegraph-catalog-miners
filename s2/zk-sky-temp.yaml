version: "1"
kind: miner
id: 730401
slug: zk-sky-temp
protocol: generic
name: SkyWire Source-Mapped Temperature
description: >
  Current-hour air-temperature estimate at a caller's place or coordinates from
  MET Norway Locationforecast, with a separately timestamped independent nearby
  NOAA METAR observation when available. Primary Celsius value is source-copied,
  not averaged with different sites. Explicit source identity, model valid time,
  observation age, station distance and unavailable-data errors. Station metadata
  covers the global NOAA Aviation Weather Center catalogue.
base_url: https://telegraph-sky.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  documentation: https://telegraph-sky.margyn.workers.dev/
errors:
  message_path: error
endpoints:
  - path: /weather
    external_path: /weather
    method: GET
    description: >
      Current air-temperature estimate in degrees Celsius for location, a place
      name or signed latitude,longitude pair. Source-reported current weather
      scalars are also returned when present. No historical or future temperature
      is presented as a current observation. A nearby station observation is only
      the fallback if the point model is unavailable, with that fact disclosed.
    intents: [WEATHER_CHECK_TEMPERATURE]
    params:
      query:
        required:
          - name: location
            type: string
            intents: ["*"]
            description: >
              Preserve the requested city/place or latitude,longitude exactly.
              Latitude -90..90, longitude -180..180. Do not substitute an airport,
              another city, or a default location.
input_schema:
  type: object
  required: [location]
  properties:
    location:
      type: string
      description: City/place or latitude,longitude for current air temperature.
output_schema:
  type: object
  required: [temperature_c, measurement_kind, valid_at, source_url]
  properties:
    temperature_c:
      type: number
      description: The single primary air-temperature value in degrees Celsius.
    measurement_kind:
      type: string
      description: point_model_estimate or disclosed nearby_station_observation fallback.
    valid_at:
      type: string
      description: Valid UTC model timestamp or actual station observation timestamp.
    source_url:
      type: string
      description: Public API URL for the primary source.
    station:
      type: object
      description: Independent nearby station report, timestamp and distance, if available.
    summary:
      type: string
      description: Source-backed direct answer and source/availability context.
intent_mapping:
  WEATHER_CHECK_TEMPERATURE:
    endpoint: /weather
    input:
      location:
        from: location
        how: Preserve the caller's city/place or signed latitude,longitude string.
    output:
      temperature_c:
        path: temperature_c
        unit: degrees Celsius
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [WEATHER_CHECK_TEMPERATURE]
