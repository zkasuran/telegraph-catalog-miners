version: '1'
kind: miner
id: 70201
slug: zk-media-image
protocol: generic
name: Media Evidence Image
description: Keyless image provenance and signed-byte integrity checks using the C2PA
  Rust WASM SDK. Reads the supplied JPEG or PNG, verifies embedded signatures and
  hashes and extracts bounded EXIF/XMP declarations. An invalid signature, absent
  provenance or an untrusted signer does not establish a fake scene; those cases are
  inconclusive.
base_url: https://telegraph-s2-media.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://telegraph-s2-media.margyn.workers.dev/health
limitations:
- code: MAX_PARAM_VALUE
  message: Direct HTTPS JPEG or PNG image, up to 1 MiB, on raw.githubusercontent.com,
    spec.c2pa.org, upload.wikimedia.org or images-assets.nasa.gov; no redirects.
  param: image_url
  property: length
  value_num: 2048
  operator: lte
rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
input_schema:
  type: object
  properties:
    image_url:
      type: string
      format: uri
      maxLength: 2048
      description: Direct HTTPS JPEG or PNG image, up to 1 MiB, on raw.githubusercontent.com,
        spec.c2pa.org, upload.wikimedia.org or images-assets.nasa.gov; no redirects.
output_schema:
  type: object
  properties:
    verdict:
      type: string
      enum:
      - Authentic
      - Likely authentic
      - Manipulated
      - Likely manipulated
      - Synthetic
      - Inconclusive
    confidence:
      type: number
      minimum: 0
      maximum: 1
    evidence:
      type: array
    summary:
      type: string
    source:
      type:
      - string
      - 'null'
    as_of:
      type: string
endpoints:
- path: /image
  external_path: /image
  method: GET
  description: Direct HTTPS JPEG or PNG image, up to 1 MiB, on raw.githubusercontent.com,
    spec.c2pa.org, upload.wikimedia.org or images-assets.nasa.gov; no redirects. Returns
    provenance scope explicitly; not a face-swap or scene-truth detector.
  intents:
  - IMAGE_VERIFICATION_GENERAL
  params:
    query:
      required:
      - name: image_url
        type: string
        intents:
        - IMAGE_VERIFICATION_GENERAL
        description: Direct HTTPS JPEG or PNG image, up to 1 MiB, on raw.githubusercontent.com,
          spec.c2pa.org, upload.wikimedia.org or images-assets.nasa.gov; no redirects.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents:
  - IMAGE_VERIFICATION_GENERAL
intent_mapping:
  IMAGE_VERIFICATION_GENERAL:
    endpoint: /image
    input:
      image_url:
        from: image_url
    output:
      verdict:
        path: verdict
      confidence:
        path: confidence
        unit: fraction (0-1)
      evidence:
        path: evidence
      summary:
        path: summary
on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
    - index: 0
      name: verdict
      description: Canonical verdict on image provenance or integrity, within the
        stated scope.
      source_path: verdict
