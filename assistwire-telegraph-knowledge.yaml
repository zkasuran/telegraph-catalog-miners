version: "1"
kind: miner
id: 7444
slug: assistwire-telegraph-knowledge
protocol: generic
name: AssistWire Telegraph Knowledge
description: >
  TELEGRAPH_KNOWLEDGE answers for questions about the Telegraph protocol, its miners, validators,
  intents and ecosystem, produced by a language model at request time. The model is grounded in a
  verified brief of how the protocol works, so it answers from facts rather than guessing and says
  plainly when a specific detail is outside that brief. The answer is produced with MiniMax under a
  commercial plan held by the operator, so this miner is not keyless. Serves the TELEGRAPH_KNOWLEDGE
  intent.
base_url: https://telegraph-assist.margyn.workers.dev

docs:
  documentation: https://telegraph-assist.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the Telegraph question. A single question, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question about Telegraph, verbatim, for example 'What is the
        Telegraph protocol and how do its miners and validators work?'. The miner answers it from a
        verified brief of the protocol.
    topic:
      type: string
      description: The Telegraph topic to explain, if supplied on its own.
    query:
      type: string
      description: The Telegraph question, an alternative name for the question.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the answer, a short label for a reader.
    summary:
      type: string
      description: The factual answer to the Telegraph question.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /telegraph-knowledge
    external_path: /telegraph-knowledge
    method: GET
    description: >
      Answer one Telegraph question, the question as a query parameter (?question=...). Also accepts
      ?query= or the topic in ?topic=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TELEGRAPH_KNOWLEDGE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the answer.
        source_path: headline
      - index: 1
        name: summary
        description: The factual answer to the Telegraph question.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: telegraph-knowledge
      method: GET
      query_params:
        question: { source: strings.1 }
