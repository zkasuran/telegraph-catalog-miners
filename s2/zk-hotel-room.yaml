version: "1"
kind: miner
id: 7311554
slug: zk-hotel-room
protocol: generic
name: ZK Hotel Bounded Direct Room Offers
description: >-
  Source-backed exact-stay offers for one room, two adults and no children.
  Ordinary Xotelo quotes require a stay shorter than one calendar month.
  Longer stays require a completed mapped Kampaeng Ngam Superior room offer
  in THB, or an Off Beat Guesthouse twin/shared-bathroom room offer in EUR.
  If the Offbeat twin room explicitly refuses, its already-published Queen
  room with balcony and shared bathroom is checked for the same full stay.
  Missing or incomplete evidence is an error, never invented hotel-wide sold out.
base_url: https://telegraph-s2-hotel-live.margyn.workers.dev
auth: {type: none}
cache_ttl_sec: 0
rate_limit_per_sec: 1
limitations:
  - code: SOURCE_QUOTA
    message: Sparse source use; at most one new node request every ten seconds.
    property: rate
    value_num: 1
    window_seconds: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /availability
    external_path: /availability
    method: GET
    description: >-
      Supply hotel, check_in (YYYY-MM-DD), and nights (1–365). Exact catalog
      property names, known keys and Tripadvisor URLs are accepted. Occupancy
      is one room, two adults, no children. Ordinary Xotelo stays must be shorter
      than one calendar month and at most 30 nights; THB prices are the lowest
      returned channel rate. Longer stays are conditional on completed direct
      Kampaeng Ngam Superior or Offbeat twin/shared-bathroom room offers.
      An explicit Offbeat twin-room refusal permits one Queen/balcony/shared-
      bathroom room fallback, with unchanged dates and occupancy. Direct THB
      or EUR prices are nightly averages of one completed full-stay room offer,
      not a global minimum. Taxes, cancellation and OTA product equivalence are
      unverified. Availability is not a reservation guarantee.
    intents: [HOTEL_AVAILABILITY_GENERAL]
    params:
      query:
        required:
          - name: hotel
            type: string
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: Exact property identity; at most 256 UTF-8 bytes.
          - name: check_in
            type: string
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: YYYY-MM-DD; historical stays unsupported.
          - name: nights
            type: integer
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: Integer 1–365; long stays need a completed mapped direct offer.
input_schema:
  type: object
  required: [hotel, check_in, nights]
  properties:
    hotel: {type: string, minLength: 1, maxLength: 256}
    check_in: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    nights: {type: integer, minimum: 1, maximum: 365}
output_schema:
  type: object
  required: [hotel, check_in, available, price_per_night, currency, source, as_of, summary]
  properties:
    hotel: {type: string}
    check_in: {type: string}
    available: {type: boolean}
    price_per_night: {type: number, minimum: 0, maximum: 1000000}
    currency: {type: string}
    source: {type: string}
    as_of: {type: string}
    summary: {type: string}
errors:
  code_path: error.code
  message_path: error.message
  status_path: status
  success_values: [ok]
semantics:
  supported_intents: [HOTEL_AVAILABILITY_GENERAL]
  signal_mapping: {label_field: available, reason_field: summary}
intent_mapping:
  HOTEL_AVAILABILITY_GENERAL:
    endpoint: /availability
    input:
      hotel: {from: hotel, how: "Preserve exact property identity and location."}
      check_in: {from: check_in, how: "Check-in date, YYYY-MM-DD."}
      nights: {from: nights, how: "Integer nights; never truncate or split the stay."}
    output:
      hotel: {path: hotel}
      check_in: {path: check_in}
      available: {path: available}
      price_per_night: {path: price_per_night, unit: currency units}
      currency: {path: currency}
