version: '1'
kind: miner
id: 780031
slug: zk-qa-proof
protocol: generic
name: ZK Verbatim QA Proof Candidate
description: Unpromoted source-only QA implementation candidate. Deployment required
  before registration. Verbatim Wikipedia or supplied-context spans with source sentences,
  offsets, revisions and CC BY-SA attribution; lexical relevance, not verified general
  reasoning. Unsupported current facts and comparisons abstain.
base_url: https://telegraph-text.margyn.workers.dev
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
- path: /answer
  external_path: /answer
  method: GET
  intents:
  - QUESTION_ANSWERING_GENERAL
  description: Complete original question in question. Optional context/passages are
    the only evidence when supplied. Source excerpts with citations and offsets; no
    model generation or calibrated confidence.
  params:
    query:
      required:
      - name: question
        type: string
        intents:
        - '*'
        description: Complete original question, maximum 8000 characters.
      optional:
      - name: context
        type: string
        intents:
        - '*'
        description: Caller passage, maximum 40000 characters; not independently verified.
input_schema:
  type: object
  properties:
    question:
      type: string
      maxLength: 8000
    context:
      type: string
      maxLength: 40000
output_schema:
  type: object
  properties:
    summary:
      type: string
    answer:
      type: string
    verdict:
      type: string
    citations:
      type: array
    evidence:
      type: array
    upstream:
      type: array
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents:
  - QUESTION_ANSWERING_GENERAL
errors:
  message_path: detail
  code_path: error
