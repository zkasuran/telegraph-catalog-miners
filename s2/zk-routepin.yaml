version: '1'
kind: miner
id: 78474
slug: zk-routepin
protocol: generic
name: RoutePin Hash-Pinned Ethereum Execution Plans
description: >-
  Exactly 1 ETH into Ethereum mainnet USDC: complete bounded Uniswap V2/V3/V4,
  Pancake V3 and Sushi V2 route/split comparison. Two independent public RPC
  operators reproduce all 416 results at one EIP-1898 canonical block hash.
  Exact input allocations, token paths, fees and conditional extra-cost decision.
base_url: https://telegraph-s2-routepin.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: Conservative operating cap of 200 node calls per day.
    property: rate
    value_num: 200
    window_seconds: 86400
  - code: MAX_PARAM_SIZE
    message: Fixed ETH/USDC pair, at most 32 bytes.
    param: pair
    property: size_bytes
    value_bytes: 32
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >-
      Sell exactly 1000000000000000000 wei ETH on Ethereum mainnet into USDC;
      send pair=ETH/USDC. amount_out is integer USDC base units, 1000000 per USDC.
      answer gives every actual input allocation, token path, venue and fee in ppm,
      exact wrapping share and conditional cost decision versus a one-pool quote.
      Fees and price impact included; network gas and future proceeds unmeasured.
      Bounded gross maximum, not global/net optimality. All source simulations
      pinned to one canonical block hash. Bare /route and literal {pair} use
      the same fixed canonical trade; no unsupported pair or amount is guessed.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Exactly ETH/USDC; one ETH and Ethereum mainnet are fixed.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair: {type: string, enum: [ETH/USDC], maxLength: 32}
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    status: {type: string, enum: [ok, unavailable]}
    amount_out: {type: integer, minimum: 100000000, maximum: 100000000000}
    answer: {type: string}
    summary: {type: string}
    source: {type: [string, 'null']}
    as_of: {type: [string, 'null']}
    block_number: {type: integer}
    block_hash: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}
    confirmed_sources:
      type: array
      items: {type: string}
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path: {type: string}
    error: {type: object}
  allOf:
    - if:
        properties: {status: {const: ok}}
      then:
        required: [amount_out, answer, block_number, block_hash, confirmed_sources, evidence_path]
      else:
        not: {required: [amount_out]}
semantics:
  signal_mapping: {label_field: answer, reason_field: summary}
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair: {from: pair, how: Preserve ETH/USDC exactly; amount and chain are fixed.}
    output:
      amount_out: {path: amount_out, unit: 'USDC base units (6 decimals)'}
