version: "1"
kind: miner
id: 731963
slug: zk-secaudit
protocol: generic
name: SecAudit exact-version security review
description: >
  Keyless security review of pinned dependencies and supplied code snippets.
  Reads OSV advisories with source-linked severity and patch boundaries.
  Deduplicates CVE, GHSA and PYSEC aliases into unique defects.
  Bounded syntax checks identify six CWE patterns without executing code.
base_url: https://telegraph-s2-secaudit.margyn.workers.dev
auth:
  type: none
docs:
  website: https://osv.dev
  documentation: https://google.github.io/osv.dev/post-v1-query/
rate_limit_per_sec: 2
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_SIZE
    message: target must be at most 16000 UTF-8 bytes and contain at most four pinned package versions.
    param: target
    property: size_bytes
    value_bytes: 16000
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /review
    external_path: /review
    method: GET
    description: >
      Review the canonical target string verbatim. Accept exact dependencies such as
      npm:lodash@4.17.15, django==2.2.0, maven:org.apache.logging.log4j:log4j-core@2.14.1,
      versioned package URLs or a package.json with pinned dependencies.
      Also accepts source snippets or added diff lines for six bounded CWE syntax checks.
      Do not send a repository URL alone. No arbitrary URL fetch or code execution occurs.
      Returns verdict, vulnerability_count in whole vulnerabilities, issues most serious first
      and summary. Unknown or incomplete reads have null count and explicit error status.
    intents: [SECURITY_REVIEW_GENERAL]
    params:
      query:
        required:
          - name: target
            type: string
            intents: [SECURITY_REVIEW_GENERAL]
            description: >
              The entire canonical target as supplied, containing code or pinned package versions.
              Preserve registry and version. npm:name@version and PyPI name==version are supported.
              No version ranges or unversioned package names. At most four distinct dependencies.
input_schema:
  type: object
  properties:
    target:
      type: string
      maxLength: 16000
      description: Canonical target string with pinned dependencies or supplied source code.
output_schema:
  type: object
  required: [verdict, vulnerability_count, issues, summary, status, source, as_of, confidence]
  properties:
    verdict:
      type: string
      enum: [Secure, Needs changes, Insecure]
    vulnerability_count:
      type: [number, "null"]
      minimum: 0
      maximum: 100000
      description: Unique known dependency defects plus individual matched code weaknesses; null when incomplete.
    issues:
      type: array
      items:
        type: object
    summary:
      type: string
    confidence:
      type: number
      minimum: 0
      maximum: 1
    status:
      type: string
      enum: [ok, partial, unavailable]
    source:
      type: array
      items:
        type: string
    as_of:
      type: string
    attribution:
      type: array
      items:
        type: object
    coverage:
      type: object
    error:
      type: object
intent_mapping:
  SECURITY_REVIEW_GENERAL:
    endpoint: /review
    input:
      target:
        from: target
        how: Copy the entire target verbatim, preserving all package versions and source code.
    output:
      verdict:
        path: verdict
      vulnerability_count:
        path: vulnerability_count
        unit: vulnerabilities
      issues:
        path: issues
      summary:
        path: summary
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents: [SECURITY_REVIEW_GENERAL]
on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        source_path: verdict
        description: Security verdict from this bounded review.
    integers:
      - index: 0
        name: vulnerability_count
        source_path: vulnerability_count
        description: Unique defects or matched weaknesses, whole vulnerabilities; never publish a missing count as zero.
