version: "1"
kind: miner
id: 7609
slug: tripwire-transit-lock
protocol: generic
name: TripWire Transit Lock Verify
description: >
  Transit-protection check for a multi-leg journey, answered by a language model at request
  time. Send the itinerary with its connection or layover and the miner returns a clear
  verdict (protected, not protected, at risk or insufficient information) naming the factors
  that decide it such as the connection time against the minimum connection time, a single
  ticket versus separate tickets, a change of airport or terminal, through-checked baggage or
  a transit visa. This reads the stated itinerary, so no booking feed is used. The answer is
  produced with MiniMax under a commercial plan held by the operator, so this miner is not
  keyless. Serves the TRAVEL_TRANSIT_LOCK intent.
base_url: https://telegraph-trip.margyn.workers.dev

docs:
  documentation: https://telegraph-trip.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the itinerary and the connection to check. Passing the whole question verbatim works too. A single passage, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: The full natural-language question, verbatim. The miner reads the subject from it, so passing the whole question works as well as passing the subject on its own.
    query:
      type: string
      description: The subject to assess, if sent on its own rather than inside a question.
    text:
      type: string
      description: The subject text to assess.
    itinerary:
      type: string
      description: The multi-leg journey with its connection or layover.
    scenario:
      type: string
      description: The itinerary and the connection to check.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of protected, not protected, at risk or insufficient information.
    summary:
      type: string
      description: "The answer the node grades: the verdict or figure followed by one or two sentences of reasoning."
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /transit-lock
    external_path: /transit-lock
    method: GET
    description: >
      Transit-protection check for one itinerary, the journey as a query parameter
      (?question=...). Also accepts ?query=, ?text=, ?itinerary= or ?scenario=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TRAVEL_TRANSIT_LOCK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The full graded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: transit-lock
      method: GET
      query_params:
        question: { source: strings.1 }
