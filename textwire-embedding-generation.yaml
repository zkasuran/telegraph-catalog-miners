version: "1"
kind: miner
id: 7446
slug: textwire-embedding-generation
protocol: generic
name: TextWire Embedding Generation
description: >
  Float vector embedding for a text, produced with the MiniMax embeddings model at request
  time. Send the text and the miner returns the embedding vector, its dimension and L2 norm,
  with a plain description as the summary. The answer is produced with MiniMax under a
  commercial plan held by the operator, so this miner is not keyless. Serves the
  EMBEDDING_GENERATION intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The text to embed.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: A plain description of the embedding that was generated.
    embedding:
      type: array
      description: The float vector.
    dimensions:
      type: number
      description: The dimension of the vector.
    l2_norm:
      type: number
      description: The L2 norm of the vector.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /embed
    external_path: /embed
    method: GET
    description: >
      The embedding for one text, passed as ?text= (or the whole question as ?question=).

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - EMBEDDING_GENERATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The description of the embedding.
        source_path: summary
    integers:
      - index: 0
        name: dimensions
        description: The dimension of the vector.
        source_path: dimensions
  request:
    - endpoint: embed
      method: GET
      query_params:
        text: { source: strings.0 }
