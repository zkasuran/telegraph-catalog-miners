name: PRODUCT_AUTHENTICITY source and model development
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source-only gate or real remote CPU development, not registration.
        type: choice
        options: [source, develop, develop_broad, recover_broad]
        default: source
        required: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Actual source-only release gate
        env:
          PRODUCT_REPORT_DIR: ${{ runner.temp }}/product-authenticity-source
        run: bash verification/owners/product_authenticity/verify.sh
      - name: Record actual full-source audit admission
        run: python3 verification/owners/product_authenticity/audit_admission/audit_source_admission.py --snapshot verification/owners/product_authenticity/audit_admission/sources > "${{ runner.temp }}/product-authenticity-source/audit-admission.json"
      - name: Preserve source-only reports, not model audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-authenticity-source-admission
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/product-authenticity-source/*.json
  develop:
    if: ${{ inputs.mode == 'develop' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned free CPU dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/product_authenticity/development/requirements.lock
      - name: Real training, validation, full parser and reference engine development
        run: python3 verification/owners/product_authenticity/development/remote_develop.py --root "${{ runner.temp }}/product-authenticity-development"
      - name: Preserve actual bounded development assets, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-authenticity-development
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/product-authenticity-development/development-report.json
            ${{ runner.temp }}/product-authenticity-development/dataset-gate.json
            ${{ runner.temp }}/product-authenticity-development/selection.json
            ${{ runner.temp }}/product-authenticity-development/parser-result.json
            ${{ runner.temp }}/product-authenticity-development/frozen-answer-only-baseline.json
            ${{ runner.temp }}/product-authenticity-development/reference-runtime.log
            ${{ runner.temp }}/product-authenticity-development/PRODUCT_AUTHENTICITY.safetensors
            ${{ runner.temp }}/product-authenticity-development/checkpoint/*.safetensors
            ${{ runner.temp }}/product-authenticity-development/checkpoint/*.pt
  broad:
    if: ${{ inputs.mode == 'develop_broad' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned free CPU dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/product_authenticity/development/requirements.lock
      - name: Real broader source-grounded CPU development
        run: python3 verification/owners/product_authenticity/broad_development/remote_broad.py --root "${{ runner.temp }}/product-authenticity-broad"
      - name: Preserve bounded actual broad results and licensed checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-authenticity-broad-development
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/product-authenticity-broad/development-report.json
            ${{ runner.temp }}/product-authenticity-broad/dataset-gate.json
            ${{ runner.temp }}/product-authenticity-broad/data/data-report.json
            ${{ runner.temp }}/product-authenticity-broad/selection.json
            ${{ runner.temp }}/product-authenticity-broad/parser-result.json
            ${{ runner.temp }}/product-authenticity-broad/frozen-answer-only-baseline.json
            ${{ runner.temp }}/product-authenticity-broad/frozen-token-length-baseline.json
            ${{ runner.temp }}/product-authenticity-broad/source-shortcut-report.json
            ${{ runner.temp }}/product-authenticity-broad/reference-runtime.log
            ${{ runner.temp }}/product-authenticity-broad/PRODUCT_AUTHENTICITY.safetensors
            ${{ runner.temp }}/product-authenticity-broad/checkpoint/*.safetensors
            ${{ runner.temp }}/product-authenticity-broad/checkpoint/*.pt
  recover:
    if: ${{ inputs.mode == 'recover_broad' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned public CPU dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/product_authenticity/development/requirements.lock
      - name: Recover the exact selected delta without training
        run: python3 verification/owners/product_authenticity/recovery/recover.py --root "${{ runner.temp }}/product-authenticity-recovery"
      - name: Preserve actual recovery reports and licensed restored checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-authenticity-recovery
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/product-authenticity-recovery/recovery-report.json
            ${{ runner.temp }}/product-authenticity-recovery/tensor-roundtrip.json
            ${{ runner.temp }}/product-authenticity-recovery/native-validation-scores.json
            ${{ runner.temp }}/product-authenticity-recovery/parser-result.json
            ${{ runner.temp }}/product-authenticity-recovery/data/data-report.json
            ${{ runner.temp }}/product-authenticity-recovery/reference-runtime.log
            ${{ runner.temp }}/product-authenticity-recovery/restored/*.safetensors
            ${{ runner.temp }}/product-authenticity-recovery/restored/*.pt
