# UNPUBLISHED NEW MINER CANDIDATE; not the fetched skywire-forecast registration.
# Same candidate/identity as zk-sky-forecast2.yaml; register at most once.
# Original legacy registration: raw/recheck-our-yaml.body.
# Provenance and intent mismatch: recheck-our-provenance.json.
# Unpublished NEW miner candidate for WEATHER_FORECAST_GENERAL.
# New identity; this does not modify the registered skywire-forecast YAML.
version: "1"
kind: miner
id: 73156
slug: zk-sky-forecast2
protocol: generic
name: SkyWire Source Window Forecast
description: >-
  Exact 1–240-hour point-model forecast windows from MET Norway and NOAA GFS.
  NWS and ECCC supply independent national forecasts and published precipitation
  probabilities where available. Temperature extrema are source-sample extrema;
  peak precipitation chance retains its source periods or timestamps, coverage and
  disagreement, and is not a whole-window event probability. No inferred odds.
base_url: https://telegraph-sky.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /forecast
    external_path: /forecast
    method: GET
    description: >-
      Forecast for a named city or decimal latitude,longitude reference point over
      window_hours from request time. Full question or when may specify a local
      calendar window if window_hours is absent; source-backed known city timezones
      or caller-supplied IANA timezone are required. Missing probabilities stay null.
    intents: [WEATHER_FORECAST_GENERAL]
    params:
      query:
        required:
          - name: location
            type: string
            intents: ["*"]
            description: City/place name or decimal latitude,longitude, at most 256 bytes.
        optional:
          - name: window_hours
            type: integer
            intents: ["*"]
            description: Exact future window, integer 1–240 hours; overrides calendar wording.
          - name: question
            type: string
            intents: ["*"]
            description: Verbatim original forecast question.
          - name: when
            type: string
            intents: ["*"]
            description: Local calendar window such as tomorrow morning or this weekend.
          - name: focus
            type: string
            intents: ["*"]
            description: Requested aspect such as rain, wind, temperature, snow or freeze.
          - name: timezone
            type: string
            intents: ["*"]
            description: IANA timezone for calendar windows if not known for the place.
          - name: days
            type: integer
            intents: ["*"]
            description: Legacy rolling length, 1–10 days; default 3.
input_schema:
  type: object
  required: [location]
  properties:
    location: {type: string, minLength: 1, maxLength: 256}
    window_hours: {type: integer, minimum: 1, maximum: 240}
    question: {type: string}
    when: {type: string}
    focus: {type: string}
    timezone: {type: string}
    days: {type: integer, minimum: 1, maximum: 10}
output_schema:
  type: object
  required: [location, when, temp_max_c, temp_min_c, summary, sources, coverage]
  properties:
    location: {type: string}
    when: {type: string}
    temp_max_c: {type: number}
    temp_min_c: {type: number}
    precipitation_probability_pct: {type: [number, "null"]}
    condition: {type: [string, "null"]}
    summary: {type: string}
    sources: {type: array}
    coverage: {type: object}
intent_mapping:
  WEATHER_FORECAST_GENERAL:
    endpoint: /forecast
    input:
      location: {from: location}
      window_hours: {from: window_hours}
    output:
      location: {path: location}
      when: {path: when}
      temp_max_c: {path: temp_max_c, unit: degrees Celsius}
      temp_min_c: {path: temp_min_c, unit: degrees Celsius}
      precipitation_probability_pct: {path: precipitation_probability_pct, unit: percent}
      condition: {path: condition}
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [WEATHER_FORECAST_GENERAL]
errors:
  message_path: error
docs:
  documentation: https://telegraph-sky.margyn.workers.dev/
