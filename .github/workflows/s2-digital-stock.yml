name: Digital allocation stock
on:
  push:
    paths:
      - s2/seven-miners/**
      - .github/workflows/s2-digital-stock.yml
  pull_request:
    paths:
      - s2/seven-miners/**
      - .github/workflows/s2-digital-stock.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify the exact stock package
        run: bash s2/seven-miners/verify.sh
