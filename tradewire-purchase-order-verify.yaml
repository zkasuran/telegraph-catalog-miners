version: "1"
kind: miner
id: 7454
slug: tradewire-purchase-order-verify
protocol: generic
name: TradeWire Purchase Order Verify
description: >
  Verify a purchase order. Send the PO with its line items, quantities, unit prices, line totals,
  subtotal, tax, shipping and grand total. The miner first checks that each quantity times unit
  price equals the line total, that the line totals sum to the subtotal and that the subtotal plus
  tax plus shipping equals the grand total, then returns a clear verdict (verified, discrepancy
  found, cannot verify or insufficient information) naming any figure that does not reconcile. The
  verdict is produced with MiniMax under a commercial plan held by the operator and grounded in the
  deterministic checks, so this miner is not keyless. Serves the PURCHASE_ORDER_VERIFY intent.
base_url: https://telegraph-trade.margyn.workers.dev

docs:
  documentation: https://telegraph-trade.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the purchase order to verify, with its figures. A single document, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full purchase order to verify, verbatim, with its line items, subtotal, tax, shipping
        and grand total. Passing the whole question works as well as passing the document on its own.
    query:
      type: string
      description: The purchase order to verify.
    text:
      type: string
      description: The purchase order text to verify.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of Verified, Discrepancy found, Cannot verify or Insufficient information.
    summary:
      type: string
      description: The verdict followed by one or two sentences naming the checks and any figure that does not reconcile.
    checks_passed:
      type: array
      description: The arithmetic relationships that reconciled.
    discrepancies:
      type: array
      description: The arithmetic relationships that did not reconcile.
    confidence:
      type: number
      description: 0.95 for a grounded model verdict, lower when degraded to arithmetic only.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /po-verify
    external_path: /po-verify
    method: GET
    description: >
      Verify one purchase order, as a query parameter (?question=...). Also accepts ?query= or ?text=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - PURCHASE_ORDER_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The purchase order verification verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The verdict plus the decisive check and any discrepancy.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: po-verify
      method: GET
      query_params:
        question: { source: strings.1 }
