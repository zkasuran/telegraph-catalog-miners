version: "1"
kind: miner
id: 714110
slug: zk-gridreliable
protocol: generic
name: ZK Reliable CAISO Day-Ahead Prices
description: Exact observed CAISO day-ahead USD/MWh prices for the requested operator node and UTC settlement hour, with bounded fetches, publisher fallback and source timestamps; never estimates missing prices.
base_url: https://telegraph-s2-caisodam.margyn.workers.dev
auth:
  type: none
cache_ttl_sec: 0
rate_limit_per_sec: 2
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /price
    external_path: /price
    method: GET
    description: Fetch an exact CAISO day-ahead locational marginal price in USD per MWh. Use NP15, SP15, ZP26, DLAP_PGAE, DLAP_SCE, DLAP_SDGE, TH_PACE_GEN or an exact CAISO operator node ID. Supply interval_start as offset-aware RFC3339 resolving to an exact UTC hour, preserving the requested instant. Missing intervals return HTTP 404 with null price. Only CAISO DAM is supported; never assume a node or change grids or dates.
    intents: [GRID_POWER_PRICE_GENERAL]
    params:
      query:
        required:
          - name: node_or_zone
            type: string
            intents: [GRID_POWER_PRICE_GENERAL]
            description: Exact CAISO node ID such as TH_NP15_GEN-APND or DLAP_PGAE-APND. Accepted aliases NP15, SP15, ZP26, TH_NP15_GEN, TH_SP15_GEN, TH_ZP26_GEN, DLAP_PGAE, DLAP_SCE, DLAP_SDGE and TH_PACE_GEN expand only to their listed operator IDs. Do not choose a different node.
          - name: interval_start
            type: string
            intents: [GRID_POWER_PRICE_GENERAL]
            description: Requested hourly settlement start in RFC3339 with Z or a known UTC offset. Half/quarter-hour offset representations are accepted when they resolve to an exact UTC hour. Never replace historical time with now.
input_schema:
  type: object
  required: [node_or_zone, interval_start]
  additionalProperties: false
  properties:
    node_or_zone: {type: string, minLength: 2, maxLength: 100}
    interval_start:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:00(?:\.000)?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$'
output_schema:
  type: object
  required: [lmp_usd_per_mwh, node_or_zone, market, interval_start, currency, summary, source, as_of]
  properties:
    lmp_usd_per_mwh: {type: number, minimum: -2000, maximum: 20000}
    node_or_zone: {type: string}
    market: {type: string, enum: [DAM]}
    interval_start: {type: string, format: date-time}
    currency: {type: string, enum: [USD]}
    summary: {type: string}
    source: {type: string, format: uri}
    as_of: {type: string, format: date-time}
intent_mapping:
  GRID_POWER_PRICE_GENERAL:
    endpoint: /price
    input:
      node_or_zone:
        from: node_or_zone
        how: Preserve the exact requested CAISO operator ID or a listed unambiguous alias. Never infer a node when none is supplied.
      interval_start:
        from: interval_start
        how: Requested offset-aware RFC3339 settlement instant, resolving to a UTC hour; never substitute today for a historical date.
    output:
      lmp_usd_per_mwh: {path: lmp_usd_per_mwh, unit: USD per MWh}
      node_or_zone: {path: node_or_zone}
      market: {path: market}
      interval_start: {path: interval_start}
      currency: {path: currency}
semantics:
  supported_intents: [GRID_POWER_PRICE_GENERAL]
  signal_mapping:
    label_field: lmp_usd_per_mwh
    reason_field: summary
errors:
  message_path: error.message
  code_path: error.code
docs:
  website: https://kardashevlabs.org/
  documentation: https://www.dryos.ai/data/caiso/dam-lmp
