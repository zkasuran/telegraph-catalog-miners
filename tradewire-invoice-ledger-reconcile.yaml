version: "1"
kind: miner
id: 7455
slug: tradewire-invoice-ledger-reconcile
protocol: generic
name: TradeWire Invoice Ledger Reconcile
description: >
  Reconcile an invoice against a purchase order, a ledger entry or a payment record. Send the
  invoice total with the purchase order or ledger amount and any line items. The miner computes
  the variance and checks the totals, then returns a clear verdict (reconciled, discrepancy found,
  cannot reconcile or insufficient information) naming any mismatch in amount, quantity, line items
  or reference. The verdict is produced with MiniMax under a commercial plan held by the operator
  and grounded in the deterministic arithmetic, so this miner is not keyless. Serves the
  INVOICE_LEDGER_RECONCILE intent.
base_url: https://telegraph-trade.margyn.workers.dev

docs:
  documentation: https://telegraph-trade.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the invoice and the purchase order or ledger to reconcile it against. A single pair, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full invoice with the purchase order or ledger amount to reconcile against, verbatim.
        Passing the whole question works as well as passing the figures on their own.
    query:
      type: string
      description: The invoice and the purchase order or ledger to reconcile.
    text:
      type: string
      description: The invoice and ledger text to reconcile.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of Reconciled, Discrepancy found, Cannot reconcile or Insufficient information.
    summary:
      type: string
      description: The verdict followed by one or two sentences giving the variance and any mismatch.
    checks_passed:
      type: array
      description: The arithmetic relationships that reconciled.
    discrepancies:
      type: array
      description: The arithmetic relationships that did not reconcile.
    confidence:
      type: number
      description: 0.95 for a grounded model verdict, lower when degraded to arithmetic only.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /invoice-reconcile
    external_path: /invoice-reconcile
    method: GET
    description: >
      Reconcile one invoice against a purchase order or ledger, as a query parameter (?question=...).
      Also accepts ?query= or ?text=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - INVOICE_LEDGER_RECONCILE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The reconciliation verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The verdict plus the variance and any mismatch.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: invoice-reconcile
      method: GET
      query_params:
        question: { source: strings.1 }
