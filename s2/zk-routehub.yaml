version: "1"
kind: miner
id: 78469
slug: zk-routehub
protocol: generic
name: RouteHub Verified Ethereum Routing
description: >
  Block-pinned execution quotes for exactly 1 ETH into Ethereum USDC.
  Retains Uniswap V2/V3/V4, Pancake V3 and Sushi V2 routes and adds native
  ETH/USDT/USDC V4 paths with disjoint 0.05-ETH allocations. Gives bounded
  highest gross output, complete pool/token flows and simpler cost alternatives.
  Pool fees and market impact included; network gas excluded.
base_url: https://telegraph-s2-routehub.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: This miner conservatively caps node traffic at 200 calls per day.
    property: rate
    value_num: 200
    window_seconds: 86400
  - code: MAX_PARAM_SIZE
    message: Fixed ETH/USDC enum only, at most 32 bytes.
    param: pair
    property: size_bytes
    value_bytes: 32
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >
      Sell exactly 1000000000000000000 wei ETH for Ethereum mainnet USDC;
      send pair=ETH/USDC. amount_out is integer USDC base units, 1000000 per
      USDC. Quotes include pool fees and market impact, exclude network gas.
      Compares fifteen direct pools, DAI/USDT paths and sparse 0.05-ETH
      split allocations, including native-ETH V4 USDT/USDC two-hop routes.
      The shared final V4 pool is used at most once in any candidate.
      Native V4 uses ETH directly; only WETH-route shares wrap ETH 1:1.
      Gives complete selected-route flows and simpler output/cost alternatives;
      extra-cost budgets are gross differences, not gas estimates.
      One HTTP batch contains two simulations; both must use the same block.
      Bare /route and literal {pair} probes use the fixed canonical trade.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Fixed ETH/USDC enum; exactly 1 ETH on Ethereum mainnet.
            accepted_fields:
              - value: ETH/USDC
                intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
                description: Exactly 1 ETH into Ethereum USDC.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair: {type: string, enum: [ETH/USDC], maxLength: 32}
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    amount_out: {type: integer, minimum: 100000000, maximum: 100000000000}
    status: {type: string, enum: [ok, unavailable]}
    summary: {type: string}
    source: {type: [string, "null"]}
    as_of: {type: [string, "null"]}
    observed_at: {type: string}
    evidence_path: {type: string}
    readings:
      type: object
      required: [pair, chain_id, amount_in_wei, block_number, selected_route, execution_frontier, gas_comparison]
      properties:
        pair: {const: ETH/USDC}
        chain_id: {const: 1}
        amount_in_wei: {const: "1000000000000000000"}
        block_number: {type: integer, minimum: 1}
        selected_route:
          type: object
          required: [route_id, amount_out, legs]
          properties:
            route_id: {type: string}
            amount_out: {type: integer}
            legs: {type: array, minItems: 1, items: {type: object}}
        execution_frontier: {type: array, minItems: 1, items: {type: object}}
        gas_comparison: {type: object}
    error: {type: object}
  allOf:
    - if:
        properties:
          status: {const: ok}
      then:
        required: [amount_out, readings, observed_at, evidence_path]
      else:
        not:
          required: [amount_out]
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve ETH/USDC exactly; size and Ethereum chain are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
