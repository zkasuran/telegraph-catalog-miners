version: "1"
kind: miner
id: 7440
slug: textwire-text-summarization
protocol: generic
name: TextWire Summarization
description: >
  Concise factual executive summary of a source text, produced by a language model at request
  time. Send the source text or the whole question and the miner returns a two to four
  sentence summary that captures the primary themes and key points, faithful to the text. The
  answer is produced with MiniMax under a commercial plan held by the operator, so this miner
  is not keyless. Serves the TEXT_SUMMARIZATION intent.
base_url: https://telegraph-text.margyn.workers.dev

docs:
  documentation: https://telegraph-text.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is capped at 8000 characters. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so
        passing the whole question works as well as passing the fields on their own.
    text:
      type: string
      description: The source text to summarize.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The executive summary, two to four sentences.
    input_chars:
      type: number
      description: The length of the source text in characters.
    confidence:
      type: number
      description: 0.9 to 0.96 for a direct answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /summarize
    external_path: /summarize
    method: GET
    description: >
      A concise summary of one passage, the source text as ?text= (or the whole question as ?question=).

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TEXT_SUMMARIZATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The executive summary.
        source_path: summary
  request:
    - endpoint: summarize
      method: GET
      query_params:
        text: { source: strings.0 }
