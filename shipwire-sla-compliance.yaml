version: "1"
kind: miner
id: 7606
slug: shipwire-sla-compliance
protocol: generic
name: ShipWire SLA Compliance
description: >
  Service-level-agreement compliance check, answered by a language model at request time. Send
  the agreed SLA terms and the measured results such as uptime, response time, resolution time
  or an on-time rate and the miner returns a clear verdict (compliant, breached, at risk or
  insufficient information) naming the metric that decides it, the agreed target, the measured
  value and the margin or shortfall. This is judgement over the numbers in the request. The
  answer is produced with MiniMax under a commercial plan held by the operator, so this miner
  is not keyless. Serves the SLA_COMPLIANCE intent.
base_url: https://telegraph-ship.margyn.workers.dev

docs:
  documentation: https://telegraph-ship.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: question is the agreed SLA terms and the measured results. Passing the whole question verbatim works too. A single passage, not a batch.
    param: question
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: The full natural-language question, verbatim. The miner reads the subject from it, so passing the whole question works as well as passing the subject on its own.
    query:
      type: string
      description: The subject to assess, if sent on its own rather than inside a question.
    text:
      type: string
      description: The subject text to assess.
    sla:
      type: string
      description: The agreed SLA terms and the measured results.
    scenario:
      type: string
      description: The SLA terms and the results to check against them.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict, one of compliant, breached, at risk or insufficient information.
    summary:
      type: string
      description: "The answer the node grades: the verdict or figure followed by one or two sentences of reasoning."
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /sla-compliance
    external_path: /sla-compliance
    method: GET
    description: >
      SLA compliance for one agreement, the terms and results as a query parameter
      (?question=...). Also accepts ?query=, ?text=, ?sla= or ?scenario=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - SLA_COMPLIANCE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in a short phrase.
        source_path: verdict
      - index: 1
        name: summary
        description: The full graded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: sla-compliance
      method: GET
      query_params:
        question: { source: strings.1 }
