{
  "name": "THREAT_IP_REPUTATION owner learning",
  "run-name": "THREAT_IP_REPUTATION ${{ inputs.mode }} ${{ inputs.owner_attempt }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "owner_attempt": {
          "description": "Exact owner attempt",
          "type": "string",
          "required": true
        },
        "mode": {
          "description": "Source check or validation-frozen development training",
          "type": "choice",
          "options": [
            "source-check",
            "train-development"
          ],
          "default": "source-check",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "owner-threat-ip-learning",
    "cancel-in-progress": false
  },
  "jobs": {
    "learn": {
      "if": "github.repository == 'zkasuran/telegraph-catalog-miners'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "OMP_NUM_THREADS": "4"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "verification/owners/threat_ip_reputation"
          }
        },
        {
          "name": "Actual source-only packaged gate",
          "timeout-minutes": 3,
          "run": "bash verification/owners/threat_ip_reputation/verify.sh"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "if": "inputs.mode == 'train-development'",
          "with": {
            "go-version": "1.25.7",
            "cache": false
          }
        },
        {
          "name": "Install exact audited CPU dependencies",
          "if": "inputs.mode == 'train-development'",
          "timeout-minutes": 20,
          "run": "python3 -m venv \"$RUNNER_TEMP/threat-ip-venv\" && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/threat_ip_reputation/learn/requirements.lock && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -m pip check && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" verification/owners/threat_ip_reputation/learn/audit.py --lock verification/owners/threat_ip_reputation/learn/requirements.lock --out \"$RUNNER_TEMP/threat-ip-audit-requirements.txt\" --report \"$RUNNER_TEMP/threat-ip-audit.json\""
        },
        {
          "name": "Actual bounded training, parser and reference engine",
          "if": "inputs.mode == 'train-development'",
          "timeout-minutes": 295,
          "run": "timeout --signal=TERM --kill-after=15s 17400 \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -W error verification/owners/threat_ip_reputation/learn/remote.py --root \"$RUNNER_TEMP/threat-ip-learner\""
        },
        {
          "name": "Retain exact licensed candidate and failure evidence",
          "if": "always() && inputs.mode == 'train-development'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "threat-ip-development",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/threat-ip-learner/candidate-report.json\n${{ runner.temp }}/threat-ip-learner/training-data-gate.json\n${{ runner.temp }}/threat-ip-learner/tokenizer-check.json\n${{ runner.temp }}/threat-ip-learner/frozen-controls.json\n${{ runner.temp }}/threat-ip-learner/package-manifest.json\n${{ runner.temp }}/threat-ip-learner/runtime-proof.json\n${{ runner.temp }}/threat-ip-learner/reference-engine.log\n${{ runner.temp }}/threat-ip-learner/THREAT_IP_REPUTATION.safetensors\n${{ runner.temp }}/threat-ip-learner/untrained.safetensors"
          }
        }
      ]
    }
  }
}
