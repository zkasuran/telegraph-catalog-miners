version: "1"
kind: miner
id: 73819
slug: zk-cadbank
protocol: generic
name: VerifyWire CAD Daily Benchmark
description: >
  Latest published Bank of Canada daily-average USD/CAD reference rate,
  independently checked against the ECB fixing. This is not an intraday executable
  quote. If BoC cannot be verified, returns a clearly labelled ECB fallback.
  Bank of Canada data is available free of charge at
  https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=5;
  ECB rates are free at https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml.
  Source attribution and transformations are disclosed per answer; no endorsement
  by either central bank is implied. The service charge is for verification and
  formatting, not access to the central banks' freely available data.
base_url: https://telegraph-verify.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://telegraph-verify.margyn.workers.dev/
  website: https://www.bankofcanada.ca/valet/docs
rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
input_schema:
  type: object
  required: [currency]
  properties:
    currency:
      type: string
      enum: [CAD]
output_schema:
  type: object
  required: [rate, rate_unit, fixing_date, source]
  properties:
    rate: {type: number}
    rate_unit: {type: string}
    fixing_date: {type: string}
    source: {type: string}
    data_notice: {type: string}
    cross_check: {type: object}
endpoints:
  - path: /fxnow
    external_path: /fxnow
    method: GET
    description: >
      Read the latest USD/CAD daily benchmark as CAD per USD. Send currency=CAD.
      Returns numeric rate, dated observation, named source, free-source notice,
      and independent ECB comparison. No live tradable quote or spread is asserted.
    intents: [FX_NOW_CAD]
    params:
      query:
        required:
          - name: currency
            type: string
            intents: [FX_NOW_CAD]
            description: CAD, the canonical quote currency priced per one USD.
intent_mapping:
  FX_NOW_CAD:
    endpoint: /fxnow
    input:
      currency:
        from: currency
        how: Preserve the canonical currency, upper case; this miner serves CAD only.
    output:
      rate:
        path: rate
        unit: "{key} per USD"
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [FX_NOW_CAD]
