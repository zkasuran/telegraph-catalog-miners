version: "1"
kind: miner
id: 7433
slug: codewire-code-patch-verify
protocol: generic
name: CodeWire Patch Verify
description: >
  CODE_PATCH_VERIFY answers that verify whether a code patch correctly fixes its issue, produced by a reasoning language model at request time. Send the patch or diff and its context as the patch parameter or pass the whole question. The miner gives a one sentence verdict then names what the patch changes, why it does or does not address the root cause and any remaining bug, regression risk or missing test.

  The answer is produced with MiniMax under a commercial plan held by the operator, so this miner is not keyless. Serves the CODE_PATCH_VERIFY intent.
base_url: https://telegraph-code.margyn.workers.dev

docs:
  documentation: https://telegraph-code.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: patch is the input to work on. A single request, not a batch.
    param: patch
    property: length
    value_num: 20000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so passing the
        whole question works as well as passing the input on its own.
    patch:
      type: string
      description: The patch or diff and its context, if supplied on its own.
    diff:
      type: string
      description: The diff to verify, an alternative name for the patch.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the answer, a short label for a reader.
    summary:
      type: string
      description: The CODE_PATCH_VERIFY answer the node grades.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /patch-verify
    external_path: /patch-verify
    method: GET
    description: >
      Answer one request, the input as a query parameter (?patch=...). Also accepts the whole question in
      ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CODE_PATCH_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the answer.
        source_path: headline
      - index: 1
        name: summary
        description: The CODE_PATCH_VERIFY answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: patch-verify
      method: GET
      query_params:
        patch: { source: strings.1 }
