version: "1"
kind: miner
id: 7443
slug: assistwire-customer-ticket-resolution
protocol: generic
name: AssistWire Customer Ticket Resolution
description: >
  CUSTOMER_TICKET_RESOLUTION answers for queries that supply a support conversation or ticket and
  ask how well it was handled, produced by a language model at request time. Send the ticket or
  thread and the miner returns an assessment of whether the issue was resolved, whether policy was
  followed, the tone and empathy, the likely customer satisfaction, with an overall verdict and the
  reasons. The answer is produced with MiniMax under a commercial plan held by the operator, so
  this miner is not keyless. Serves the CUSTOMER_TICKET_RESOLUTION intent.
base_url: https://telegraph-assist.margyn.workers.dev

docs:
  documentation: https://telegraph-assist.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the support ticket or conversation. A single ticket, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language query, verbatim, carrying the support thread and the question
        about it, for example 'Here is a support thread: was the issue resolved and did the agent
        follow refund policy?'. The miner reads what to assess from it.
    text:
      type: string
      description: The support ticket or conversation, if supplied on its own.
    ticket:
      type: string
      description: The support ticket to assess, an alternative name for the text.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the assessment, a short label for a reader.
    summary:
      type: string
      description: The assessment of how well the ticket was handled.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /ticket-resolution
    external_path: /ticket-resolution
    method: GET
    description: >
      Assess one ticket, the ticket as a query parameter (?text=...). Also accepts a whole question
      in ?question= or ?query= or the thread in ?ticket=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CUSTOMER_TICKET_RESOLUTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the assessment.
        source_path: headline
      - index: 1
        name: summary
        description: The assessment of how well the ticket was handled.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: ticket-resolution
      method: GET
      query_params:
        text: { source: strings.1 }
