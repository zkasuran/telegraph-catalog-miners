version: "1"
kind: miner
id: 973707
slug: zk-xstate-general
protocol: generic
name: VerifyWire Cross-Chain State Observations
description: >
  Observes ERC-20 totalSupply or compares one explicit read-only EVM contract
  call across named chains for CROSS_CHAIN_STATE_VERIFY_GENERAL. Each state
  read is pinned to its reported canonical block hash. Reports source errors,
  coverage and second-RPC corroboration separately. Supports Ethereum, Base,
  Arbitrum, Optimism, Polygon, Sepolia and Base Sepolia when the requested
  token or contract exists there and public RPC history is available.
  Separate chain snapshots are not an atomic cross-chain state, bridge-backing
  proof, message execution proof or Merkle inclusion proof. Unsupported tasks
  and ambiguous inputs are rejected; missing history is not replaced by latest.
base_url: https://telegraph-verify.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://telegraph-verify.margyn.workers.dev/
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /crosschain
    external_path: /crosschain
    method: GET
    intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
    description: >
      Pass the complete state-comparison question verbatim in question or query,
      or supply token and chains for ERC-20 totalSupply. For a raw eth_call,
      supply to, data and chains. block accepts latest, safe, finalized or an
      explicit nonnegative block height; preserve requested historical heights
      and finality wording. Never convert a requested date to latest. The same
      selector applies separately on each chain. Unsupported bridge/message
      proof tasks are not answered by substituting a token supply comparison.
    params:
      query:
        optional:
          - name: question
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: Complete original question verbatim, up to 8192 characters; retain chains, method, contract and historical/finality constraints.
          - name: query
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: Alias for question; pass the complete original text, not a shortened token symbol.
          - name: token
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: Exactly one supported ERC-20 symbol or complete 0x-prefixed 20-byte contract address; totalSupply only, not circulating or global supply.
          - name: chains
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: Comma-separated chain names or chain IDs, at most seven; every requested chain is retained or the request is rejected.
          - name: to
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: One 0x-prefixed 20-byte contract address for a raw view-call comparison; data must also be supplied, and this contract must exist on the requested chains.
          - name: data
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: Even-length 0x-prefixed eth_call calldata, at most 8194 characters; to must also be supplied.
          - name: block
            type: string
            intents: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
            description: latest, safe, finalized or a nonnegative decimal/hex block height; defaults to latest only if the question supplies no history or finality constraint.

input_schema:
  type: object
  properties:
    question:
      type: string
      maxLength: 8192
    query:
      type: string
      maxLength: 8192
    token:
      type: string
    chains:
      type: string
    to:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
    data:
      type: string
      pattern: "^0x([0-9a-fA-F]{2})*$"
      maxLength: 8194
    block:
      type: string
      pattern: "^(latest|safe|finalized|[0-9]+|0x[0-9a-fA-F]+)$"

output_schema:
  type: object
  properties:
    intent:
      type: string
      enum: [CROSS_CHAIN_STATE_VERIFY_GENERAL]
    mode:
      type: string
      enum: [token_supply, view_call]
    chains:
      type: array
      items: {type: string}
    chains_verified:
      type: integer
      description: Number of requested chains with an observed state, not the number independently corroborated.
    complete:
      type: boolean
      description: Whether every requested chain returned its requested state.
    verified:
      type: boolean
      description: All requested observations corroborated by a second named RPC service, with finality boundaries corroborated when requested; not a cryptographic bridge proof.
    independently_verified:
      type: boolean
    reads:
      type: array
      items: {type: object}
      description: Per-chain state or failure, including sources, errors and canonical block metadata where available.
    unreachable:
      type: array
      items: {type: string}
    identical:
      type: boolean
      description: In view_call mode only, complete coverage of at least two chains with equal return bytes.
    aggregate_supply_exact:
      type: [string, "null"]
      description: In token_supply mode only, exact decimal sum of observed listed contracts; partial when complete is false, not global or circulating supply.
    confidence:
      type: number
    summary:
      type: string
    as_of:
      type: string

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY_GENERAL
