version: '1'
kind: miner
id: 71622
slug: zk-code-deps
protocol: generic
name: Code Evidence Dependency Review
description: Review one exact dependency as npm:name@version or pip:name@version. Validate the published registry version
  then count complete non-withdrawn GitHub-reviewed advisories. Supports scoped npm names. Excludes malware, unreviewed reports
  and transitive dependencies. Zero records does not certify security. No source code, contracts or arbitrary sites are reviewed.
base_url: https://telegraph-s2-code-evidence.margyn.workers.dev
docs:
  documentation: https://telegraph-s2-code-evidence.margyn.workers.dev/
limitations:
- code: MAX_PARAM_SIZE
  message: Input is limited to 512 UTF-8 bytes.
  param: target
  property: size_bytes
  value_bytes: 512
  operator: lte
- code: PUBLIC_API_QUOTA
  message: At most 15 calls per hour for this descriptor. Both descriptors share a keyless GitHub API source.
  property: rate
  value_num: 15
  window_seconds: 3600
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values:
  - ok
input_schema:
  type: object
  required:
  - target
  additionalProperties: false
  properties:
    target:
      type: string
      maxLength: 512
      description: Review one exact dependency as npm:name@version or pip:name@version. Validate the published registry version
        then count complete non-withdrawn GitHub-reviewed advisories. Supports scoped npm names. Excludes malware, unreviewed
        reports and transitive dependencies. Zero records does not certify security. No source code, contracts or arbitrary
        sites are reviewed.
output_schema:
  type: object
  properties:
    verdict:
      type:
      - string
      - 'null'
      description: Security verdict
      enum:
      - Secure
      - Needs changes
      - Insecure
      - null
    vulnerability_count:
      type:
      - number
      - 'null'
      description: Number of known vulnerabilities or weaknesses found
    issues:
      type:
      - array
      - 'null'
      description: Vulnerability ids or weakness categories (CVE, GHSA, CWE, OWASP), most serious first
    summary:
      type: string
    status:
      type: string
      enum:
      - ok
      - unavailable
    confidence:
      type: number
    source:
      type:
      - string
      - 'null'
    as_of:
      type: string
endpoints:
- path: /security
  external_path: /security
  method: GET
  description: Review one exact dependency as npm:name@version or pip:name@version. Validate the published registry version
    then count complete non-withdrawn GitHub-reviewed advisories. Supports scoped npm names. Excludes malware, unreviewed
    reports and transitive dependencies. Zero records does not certify security. No source code, contracts or arbitrary sites
    are reviewed.
  intents:
  - SECURITY_REVIEW_GENERAL
  params:
    query:
      required:
      - name: target
        type: string
        intents:
        - SECURITY_REVIEW_GENERAL
        description: Review one exact dependency as npm:name@version or pip:name@version. Validate the published registry
          version then count complete non-withdrawn GitHub-reviewed advisories. Supports scoped npm names. Excludes malware,
          unreviewed reports and transitive dependencies. Zero records does not certify security. No source code, contracts
          or arbitrary sites are reviewed.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
    confidence_field: confidence
  supported_intents:
  - SECURITY_REVIEW_GENERAL
intent_mapping:
  SECURITY_REVIEW_GENERAL:
    endpoint: /security
    input:
      target:
        from: target
        how: Review one exact dependency as npm:name@version or pip:name@version. Validate the published registry version
          then count complete non-withdrawn GitHub-reviewed advisories. Supports scoped npm names. Excludes malware, unreviewed
          reports and transitive dependencies. Zero records does not certify security. No source code, contracts or arbitrary
          sites are reviewed.
    output:
      verdict:
        path: verdict
      vulnerability_count:
        path: vulnerability_count
        unit: vulnerabilities
      issues:
        path: issues
      summary:
        path: summary
