version: "1"
kind: miner
id: 73157
slug: zk-event-classify
protocol: generic
name: ZK Source-Checked Event Results
description: >-
  Resolve specific settled public-event questions from public source records.
  Formula One 2020–2025 race winners and championship winners use a pinned F1DB
  archive independently checked against Wikipedia. Race classifications, placing,
  top-N, points and disqualification questions only use independently agreeing
  F1DB/Wikipedia entries; full results explicitly disclose unconfirmed entries.
  German league fixtures require both teams and a complete date. Explicit
  full-time conditions use Openfootball scores checked against OpenLigaDB;
  equality at integer goal lines abstains. Named finals, Super Bowls and US
  presidential elections have bounded Wikipedia winner extraction. Unsupported,
  future, ambiguous and conflicting questions abstain. No generated event facts.
base_url: https://telegraph-trade.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  documentation: https://telegraph-trade.margyn.workers.dev/event-outcome/classifications
input_schema:
  type: object
  required: [event]
  properties:
    event:
      type: string
      maxLength: 300
      description: Copy the complete canonical event string verbatim, preserving the date, participants and proposition polarity.
output_schema:
  type: object
  properties:
    event: {type: string}
    summary: {type: string}
    outcome: {type: string, enum: ["yes", "no", "unresolved"]}
    resolved_yes:
      type: boolean
      description: Present only for an independently sourced settled proposition; absent on unresolved answers.
    resolved: {type: boolean}
    winner: {type: [string, "null"]}
    resolved_at: {type: [string, "null"]}
    sources: {type: array, items: {type: string}}
endpoints:
  - path: /event-outcome
    external_path: /event-outcome
    method: GET
    description: Resolve one exact settled event or supported source-checkable proposition. Copy the user's full question into event without paraphrasing or dropping the condition.
    intents: [EVENT_OUTCOME_RESOLUTION_GENERAL]
    params:
      query:
        required:
          - name: event
            type: string
            intents: ["*"]
            description: Verbatim complete canonical event question; retain year, fixture date, names, condition and negation.
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [EVENT_OUTCOME_RESOLUTION_GENERAL]
intent_mapping:
  EVENT_OUTCOME_RESOLUTION_GENERAL:
    endpoint: /event-outcome
    input:
      event:
        from: event
        how: Copy the complete canonical event question verbatim. Never reduce it to a generic winner query or remove a conditional proposition.
    output:
      event: {path: event}
      outcome: {path: outcome}
      resolved_yes:
        path: resolved_yes
        how: Read the exact boolean; if absent on unresolved, report missing rather than false.
      winner: {path: winner}
      resolved_at: {path: resolved_at}
      sources: {path: sources}
