version: "1"
kind: miner
id: 7351
slug: guardwire-api-health-check
protocol: generic
name: GuardWire API Health Check
description: >
  Health of an HTTP API endpoint, read live at request time. It makes one manual-redirect GET to
  the URL the caller names and reports whether the host answered, the HTTP status code and the
  response time in milliseconds. Healthy means the host answered with a status below 400; a 4xx or
  5xx is reachable but not healthy and an edge failure is down. Answers the API_HEALTH_CHECK
  intent. No API key, the request is our own connection to a public address, so no third-party
  data licence is involved. No port scanning, no path probing, only the single request to the URL
  named.
base_url: https://telegraph-guard.margyn.workers.dev

docs:
  documentation: https://telegraph-guard.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: url is an absolute http or https URL such as https://api.example.com/health. A bare host works too and https is assumed. A whole question is accepted, the URL is read from it.
    param: url
    property: length
    value_num: 2048
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Is https://api.github.com
        healthy?". The miner reads the URL from it, so passing the whole question works as well as
        naming the URL.
    url:
      type: string
      description: Absolute URL of the API endpoint to check, for example https://api.example.com. A bare host works too.

output_schema:
  type: object
  properties:
    url:
      type: string
      description: The URL the answer refers to.
    healthy:
      type: boolean
      description: Whether the host answered with a status below 400.
    up:
      type: boolean
      description: Whether the host answered a live request at all.
    status_code:
      type: integer
      description: HTTP status code of the immediate response.
    response_time_ms:
      type: integer
      description: Time in milliseconds from request to response.
    https:
      type: boolean
      description: Whether the URL uses https.
    redirect_location:
      type: string
      description: The Location header when the response is a redirect.
    confidence:
      type: number
      description: 0.96 when the host answered, 0.9 on a TLS failure, 0.8 when down.
    summary:
      type: string
      description: One sentence on health, status code and response time.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /api-health
    external_path: /api-health
    method: GET
    description: >
      Health of one API endpoint, the URL as a query parameter (?url=https://api.example.com).
      Also accepts a whole question in ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - API_HEALTH_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: url
        description: The URL the answer refers to.
        source_path: url
      - index: 1
        name: summary
        description: One sentence on health, status code and response time.
        source_path: summary
    integers:
      - index: 0
        name: status_code
        description: HTTP status code of the immediate response.
        source_path: status_code
        multiplier: 1
      - index: 1
        name: response_time_ms
        description: Time in milliseconds from request to response.
        source_path: response_time_ms
        multiplier: 1
  request:
    - endpoint: api-health
      method: GET
      query_params:
        url: { source: strings.0 }
