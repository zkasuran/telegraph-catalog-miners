version: "1"
kind: miner
id: 7350
slug: guardwire-dns-record-lookup
protocol: generic
name: GuardWire DNS Record Lookup
description: >
  DNS records for a name, read live over DNS-over-HTTPS at request time. It resolves the record
  type asked (A, AAAA, MX, TXT, NS, CNAME, SOA, CAA, SRV or PTR, default A) through Cloudflare
  1.1.1.1 with Google dns.google as the fallback, then returns the values and their count in one
  sentence. Answers the DNS_RECORD_LOOKUP intent. No API key, nothing cached that can go stale.
  DNS is a protocol lookup of the name's own published zone, so no third-party dataset licence is
  involved.
base_url: https://telegraph-guard.margyn.workers.dev

docs:
  documentation: https://telegraph-guard.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: name is a domain such as example.com or github.com. A full URL or a whole question is accepted too, the name is read from it. type is a record type such as A, AAAA, MX, TXT, NS or CNAME.
    param: name
    property: length
    value_num: 253
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What are the MX records for
        github.com?". The miner reads the name and the record type from it, so passing the whole
        question works as well as naming them.
    name:
      type: string
      description: Domain name to look up, for example example.com. A full URL works too, the host is read from it.
    type:
      type: string
      description: Record type to resolve, for example A, AAAA, MX, TXT, NS or CNAME. Defaults to A.

output_schema:
  type: object
  properties:
    name:
      type: string
      description: The domain name the answer refers to.
    record_type:
      type: string
      description: The record type resolved.
    record_count:
      type: integer
      description: Number of records of that type.
    records:
      type: array
      description: The record values as strings (objects with priority and host for MX).
    cname_chain:
      type: array
      description: Any CNAME aliases seen in front of the answer.
    dns_status:
      type: string
      description: The DNS response code, for example NOERROR or NXDOMAIN.
    resolver:
      type: string
      description: Which public resolver answered, Cloudflare 1.1.1.1 or Google dns.google.
    confidence:
      type: number
      description: 0.97 for records found, 0.95 for NXDOMAIN, 0.9 for none of that type.
    summary:
      type: string
      description: One sentence naming the domain, the record type, the count and the values.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /dns
    external_path: /dns
    method: GET
    description: >
      Records for one name, the name as a query parameter (?name=example.com) and the record type
      in ?type=. Also accepts a whole question in ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: name
        description: The domain name the answer refers to.
        source_path: name
      - index: 1
        name: record_type
        description: The record type resolved.
        source_path: record_type
      - index: 2
        name: summary
        description: One sentence naming the domain, the record type, the count and the values.
        source_path: summary
    integers:
      - index: 0
        name: record_count
        description: Number of records of that type.
        source_path: record_count
        multiplier: 1
  request:
    - endpoint: dns
      method: GET
      query_params:
        name: { source: strings.0 }
