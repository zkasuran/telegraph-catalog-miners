[package]
name = "zk_comparator"
version = "1.0.0"
edition = "2021"
description = "Telegraph comparator module: the network's reference comparison rule (Exact, AbsTol, RelTol, PassFail)."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
