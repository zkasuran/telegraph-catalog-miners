version: '1'
kind: miner
id: 78470
slug: zk-routecost
protocol: generic
name: RouteCost Verified Ethereum Execution Economics
description: 'Block-pinned real execution quotes for exactly 1 ETH into Ethereum USDC. Compares Uniswap V2/V3/V4, Pancake
  V3 and Sushi V2 paths and disjoint splits, retaining the complete same-team RouteHub search. Adds per-hop fee-adjusted price
  impact and conditional incremental-gas break-even ceilings from the same block''s base fee. Reports highest gross output;
  transaction gas and realized proceeds remain unmeasured.

  '
base_url: https://telegraph-s2-routecost.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
- code: ACCOUNT_QUOTA
  message: This miner conservatively caps node traffic at 200 calls per day.
  property: rate
  value_num: 200
  window_seconds: 86400
- code: MAX_PARAM_SIZE
  message: Fixed ETH/USDC enum only, at most 32 bytes.
  param: pair
  property: size_bytes
  value_bytes: 32
  operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values:
  - ok
endpoints:
- path: /route
  external_path: /route
  method: GET
  description: 'Sell exactly 1000000000000000000 wei ETH for Ethereum mainnet USDC; send pair=ETH/USDC. amount_out is integer
    USDC base units, 1000000 per USDC, with pool fees and market impact included and network gas excluded. Compares fifteen
    direct pools, DAI/USDT paths and sparse 0.05-ETH split allocations including native-ETH V4 USDT hub paths. Shared pools
    are never counted twice; only WETH-route shares wrap ETH 1:1. Gives selected pool/token flows, per-hop fee-adjusted marginal
    price impact, simpler alternatives and conditional incremental-gas ceilings. Gas ceilings use actual block base fee and
    the observed one-pool quote as ETH valuation; priority fees and actual transaction gas are unmeasured. One HTTP batch
    contains two simulations and one block-header read; source block number, parent and timestamp must agree. No net/global
    optimum or guaranteed realized proceeds is asserted. Bare /route and literal {pair} probes use the fixed canonical trade.

    '
  intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
  params:
    query:
      required:
      - name: pair
        type: string
        intents:
        - OPTIMAL_EXECUTION_ROUTE_GENERAL
        description: 'Fixed ETH/USDC enum; exactly 1 ETH on Ethereum mainnet. Accepted values: ETH/USDC.'
input_schema:
  type: object
  additionalProperties: false
  required:
  - pair
  properties:
    pair:
      type: string
      enum:
      - ETH/USDC
      maxLength: 32
output_schema:
  type: object
  required:
  - status
  - summary
  - source
  - as_of
  properties:
    amount_out:
      type: integer
      minimum: 100000000
      maximum: 100000000000
    status:
      type: string
      enum:
      - ok
      - unavailable
    summary:
      type: string
    source:
      type:
      - string
      - 'null'
    as_of:
      type:
      - string
      - 'null'
    observed_at:
      type: string
    evidence_path:
      type: string
    readings:
      type: object
      required:
      - pair
      - chain_id
      - amount_in_wei
      - block_number
      - selected_route
      - execution_frontier
      - selected_leg_economics
      - network_cost
      properties:
        pair:
          const: ETH/USDC
        chain_id:
          const: 1
        amount_in_wei:
          const: '1000000000000000000'
        block_number:
          type: integer
          minimum: 1
        selected_route:
          type: object
          required:
          - route_id
          - amount_out
          - legs
          properties:
            route_id:
              type: string
            amount_out:
              type: integer
            legs:
              type: array
              minItems: 1
              items:
                type: object
        execution_frontier:
          type: array
          minItems: 1
          items:
            type: object
        selected_leg_economics:
          type: array
          minItems: 1
          items:
            type: object
        network_cost:
          type: object
          required:
          - base_fee_per_gas_wei
          - block_hash
          - comparisons
          - transaction_gas_estimated
          - priority_fee_included
          properties:
            base_fee_per_gas_wei:
              type: string
              pattern: ^[1-9][0-9]*$
            block_hash:
              type: string
              pattern: ^0x[0-9a-fA-F]{64}$
            comparisons:
              type: array
              items:
                type: object
            transaction_gas_estimated:
              const: false
            priority_fee_included:
              const: false
    error:
      type: object
  allOf:
  - if:
      properties:
        status:
          const: ok
    then:
      required:
      - amount_out
      - readings
      - observed_at
      - evidence_path
    else:
      not:
        required:
        - amount_out
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents:
  - OPTIMAL_EXECUTION_ROUTE_GENERAL
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve ETH/USDC exactly; size and Ethereum chain are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
