version: "1"
kind: miner
id: 7450
slug: searchwire-web-search
protocol: generic
name: SearchWire Web Search
description: >
    Answer a query that needs externally-sourced grounding from keyless public sources:
    Wikipedia search and page extracts plus the DuckDuckGo Instant Answer API. The miner returns
    a grounded summary with the sources a reader can check and states plainly that this is
    encyclopedic and instant-answer grounding, not a real-time breaking-news feed. Keyless, no
    API key. Wikipedia text is CC BY-SA 4.0 and is attributed in the answer. Serves the
    WEB_SEARCH intent.
base_url: https://telegraph-search.margyn.workers.dev

docs:
  documentation: https://telegraph-search.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: q is the search query. A whole question in the question field is accepted too. A single query, not a batch.
    param: q
    property: length
    value_num: 500
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the media URL from it, so
        passing the whole question works as well as the structured field.
    q:
      type: string
      description: >
        The search query.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: >
        The grounded answer. This is the graded field.
    query:
      type: string
      description: >
        The query that was searched.
    sources:
      type: array
      description: >
        The sources used, each with a title and a URL.
    confidence:
      type: number
      description: >
        0.8 for a grounded answer, lower when sources are thin.
    attribution:
      type: string
      description: >
        The credit lines the sources require.
    as_of:
      type: string
      description: >
        ISO 8601 timestamp the answer was produced.

endpoints:
  - path: /web-search
    external_path: /web-search
    method: GET
    description: >
        Grounded answer for one query, the query as ?q= or the whole question as ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - WEB_SEARCH

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: query
        description: >
            The query that was searched.
        source_path: query
      - index: 1
        name: summary
        description: >
            The grounded answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: >
            Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: web-search
      method: GET
      query_params:
        q: { source: strings.0 }
