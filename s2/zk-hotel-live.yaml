version: "1"
kind: miner
id: 7311550
slug: zk-hotel-live
protocol: generic
name: ZK Hotel Live
description: >-
  Source-backed hotel stay offers from Xotelo's free hotel-prices API, with exact
  property identity, dates and nightly units. Covers a partial catalog of 801
  properties across eight searched cities, using one room for two adults and no
  children. Abstains on unknown properties, fewer than two reported channel offers,
  upstream failures and unsupported stays; never treats missing data as sold out.
base_url: https://telegraph-s2-hotel-live.margyn.workers.dev
auth:
  type: none
cache_ttl_sec: 0
rate_limit_per_sec: 1
limitations:
  - code: SOURCE_QUOTA
    message: Sparse source use; at most one new node request every ten seconds.
    property: rate
    value_num: 1
    window_seconds: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /availability
    external_path: /availability
    method: GET
    description: >-
      Get current hotel offers for an exact catalog property and requested dates.
      Use hotel, check_in (YYYY-MM-DD), and nights (1–27). Hotel may be its exact
      catalog name, name plus catalog city, known Xotelo full key, or known
      Tripadvisor property URL. One room, two adults, no children; currency THB.
      Positive availability requires at least two channel offers reported by
      Xotelo. Unknown or single-channel results are errors, not sold out. Room
      types, tax inclusion and cancellation terms are not provided by the source.
    intents: [HOTEL_AVAILABILITY_GENERAL]
    params:
      query:
        required:
          - name: hotel
            type: string
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: Exact catalog property name, known key or Tripadvisor URL; at most 256 UTF-8 bytes.
          - name: check_in
            type: string
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: Check-in date in YYYY-MM-DD; historical stays are unsupported.
          - name: nights
            type: integer
            intents: [HOTEL_AVAILABILITY_GENERAL]
            description: Number of nights, 1–27; checkout is calculated in UTC without splitting the stay.
input_schema:
  type: object
  required: [hotel, check_in, nights]
  properties:
    hotel: {type: string, minLength: 1, maxLength: 256}
    check_in: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    nights: {type: integer, minimum: 1, maximum: 27}
output_schema:
  type: object
  required: [hotel, check_in, available, price_per_night, currency, source, as_of, summary]
  properties:
    hotel: {type: string}
    check_in: {type: string}
    available: {type: boolean}
    price_per_night: {type: number, minimum: 0, maximum: 1000000}
    currency: {type: string}
    source: {type: string}
    as_of: {type: string}
    summary: {type: string}
errors:
  code_path: error.code
  message_path: error.message
  status_path: status
  success_values: [ok]
semantics:
  supported_intents: [HOTEL_AVAILABILITY_GENERAL]
  signal_mapping:
    label_field: available
    reason_field: summary
intent_mapping:
  HOTEL_AVAILABILITY_GENERAL:
    endpoint: /availability
    input:
      hotel: {from: hotel, how: "Preserve the exact property name and location; do not substitute a different hotel."}
      check_in: {from: check_in, how: "Check-in date, YYYY-MM-DD."}
      nights: {from: nights, how: "Number of nights as an integer; do not truncate or split the stay."}
    output:
      hotel: {path: hotel}
      check_in: {path: check_in}
      available: {path: available}
      price_per_night: {path: price_per_night, unit: currency units}
      currency: {path: currency}
