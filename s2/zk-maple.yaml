version: '1'
kind: miner
id: 711637
slug: zk-maple
protocol: generic
name: Maple Canadian Sanctions Evidence
description: >-
  Independent, keyless screening against Global Affairs Canada's consolidated
  autonomous SEMA/JVCFOA sanctions list, including listed individuals, entities,
  vessels and publisher aliases. Uses the Canadian government XML rather than
  an OFAC mirror or another miner. Deterministic token alignment handles omitted
  middle names, name order, accents and close spelling. A negative covers only
  this Canadian list; name alerts do not confirm identity. Every result identifies
  its source, publication date, fetch time and SHA-256.
base_url: https://telegraph-s2-maple.margyn.workers.dev
auth:
  type: none
docs:
  documentation: https://telegraph-s2-maple.margyn.workers.dev/health
rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: error.message
  code_path: error.code
limitations:
  - code: MAX_PARAM_SIZE
    message: Name must be at most 256 UTF-8 bytes.
    param: name
    property: size_bytes
    value_bytes: 256
    operator: lte
input_schema:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
      description: One person, entity or vessel name; no full question or wallet address.
output_schema:
  type: object
  properties:
    name: {type: string}
    matched: {type: boolean}
    matches: {type: array, items: {type: object}}
    lists: {type: array, items: {type: string}}
    match_score: {type: number, minimum: 0, maximum: 1}
    summary: {type: string}
    source: {type: array, items: {type: object}}
    as_of: {type: string}
endpoints:
  - path: /screen
    external_path: /screen
    method: GET
    description: >-
      Screen exactly one person or entity using ?name=. This checks the complete
      official Canadian consolidated autonomous sanctions XML, with publisher
      aliases, reordered names, omitted middle names and close spelling. Return
      matched as a Canadian-list name alert, not confirmed identity or global
      sanctions clearance. Do not put a full question, wallet, DOB or country in name.
    intents: [SANCTIONS_SCREENING_MATCH_GENERAL]
    params:
      query:
        required:
          - name: name
            type: string
            intents: [SANCTIONS_SCREENING_MATCH_GENERAL]
            description: Person or entity name, 1 to 256 UTF-8 bytes, copied verbatim.
intent_mapping:
  SANCTIONS_SCREENING_MATCH_GENERAL:
    endpoint: /screen
    input:
      name:
        from: name
        how: Copy the single person or entity name verbatim from the canonical name input.
    output:
      name: {path: name}
      matched: {path: matched}
      matches: {path: matches}
      lists: {path: lists}
      match_score: {path: match_score, unit: 'fraction (0-1)'}
semantics:
  signal_mapping:
    label_field: matched
    reason_field: summary
  supported_intents: [SANCTIONS_SCREENING_MATCH_GENERAL]
