version: "1"
kind: miner
id: 7375
slug: verifywire-onchain-metric
protocol: generic
name: VerifyWire Onchain Metric Verify
description: >
  A specific value read from a blockchain node at a stated block height or latest, which is
  what marks this intent apart from a plain lookup. Serves a raw contract view call, a storage
  slot, a token balance held by an address, plus a transaction's gas used with its first
  Transfer log amount, each anchored to the block it was read at. Read over public RPC on
  Ethereum, Base, Arbitrum, Optimism and Polygon. Answers the ONCHAIN_METRIC_VERIFY intent. No
  API key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: name a metric by its parameters. A view call needs to and data, a storage read needs address and slot, a token balance needs token and holder, a transaction metric needs hash. block is a height or latest and defaults to latest. chain defaults to ethereum.
    param: to
    property: length
    value_num: 80
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "At block 21000000 on
        Ethereum, how much gas did tx 0xabc... use?". The miner reads the metric and the
        block anchor from it, so passing the whole question works as well as the fields.
    chain:
      type: string
      description: Chain to read on, one of ethereum, base, arbitrum, optimism, polygon.
    block:
      type: string
      description: Block height or the word latest. Defaults to latest.
    to:
      type: string
      description: Contract address for a view call.
    data:
      type: string
      description: Calldata (0x...) for a view call.
    slot:
      type: string
      description: Storage slot for a storage read, with the contract in address.
    token:
      type: string
      description: Token address or symbol for a balance read.
    holder:
      type: string
      description: Address whose token balance to read.
    hash:
      type: string
      description: Transaction hash for a gas-used and Transfer-log read.

output_schema:
  type: object
  properties:
    chain:
      type: string
      description: Chain the answer is for.
    chain_id:
      type: integer
      description: EVM chain id.
    metric:
      type: string
      description: Which metric was read, one of view_call, storage, token_balance, gas_used.
    block:
      type: string
      description: The block anchor the value was read at.
    value:
      type: string
      description: The raw value read, when the metric is a call or a storage slot.
    value_uint:
      type: string
      description: The value decoded as an unsigned integer, when it is a 32-byte word.
    confidence:
      type: number
      description: 0.97 to 0.98 for a direct on-chain read.
    summary:
      type: string
      description: One sentence naming the value and the block it was read at.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /metric
    external_path: /metric
    method: GET
    description: >
      Read one metric at a block as query parameters (?chain=ethereum&to=0x..&data=0x..&block=latest).
      Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: metric
        description: Which metric was read.
        source_path: metric
      - index: 1
        name: block
        description: The block anchor the value was read at.
        source_path: block
      - index: 2
        name: summary
        description: One sentence naming the value and the block it was read at.
        source_path: summary
    integers:
      - index: 0
        name: chain_id
        description: EVM chain id.
        source_path: chain_id
        multiplier: 1
  request:
    - endpoint: metric
      method: GET
      query_params:
        metric: { source: strings.0 }
