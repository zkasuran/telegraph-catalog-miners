{
  "name": "THREAT_IP_REPUTATION owner learning",
  "run-name": "THREAT_IP_REPUTATION qualified ${{ inputs.mode }} ${{ inputs.owner_attempt }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "owner_attempt": {
          "description": "Exact owner attempt",
          "type": "string",
          "required": true
        },
        "mode": {
          "description": "Source check or validation-frozen development training",
          "type": "choice",
          "options": [
            "source-check",
            "train-development",
            "replay-runtime",
            "train-variant2",
            "continue-variant2",
            "audit-once",
            "serve"
          ],
          "default": "source-check",
          "required": true
        },
        "source_commit": {
          "type": "string",
          "description": "Exact immutable licensed audit-source commit, required for audit-once",
          "required": false,
          "default": ""
        },
        "audit_run_id": {
          "type": "string",
          "description": "Actual verified serving input audit_run_id",
          "required": false,
          "default": ""
        },
        "report_sha256": {
          "type": "string",
          "description": "Actual verified serving input report_sha256",
          "required": false,
          "default": ""
        },
        "slot": {
          "type": "string",
          "description": "Actual verified serving input slot",
          "required": false,
          "default": ""
        },
        "forward_port": {
          "type": "string",
          "description": "Actual verified serving input forward_port",
          "required": false,
          "default": ""
        },
        "runnable_url": {
          "type": "string",
          "description": "Actual verified serving input runnable_url",
          "required": false,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "owner-threat-ip-learning",
    "cancel-in-progress": false
  },
  "jobs": {
    "learn": {
      "if": "github.repository == 'zkasuran/telegraph-catalog-miners'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "OMP_NUM_THREADS": "4"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "verification/owners/threat_ip_reputation"
          }
        },
        {
          "name": "Actual source-only packaged gate",
          "timeout-minutes": 3,
          "run": "bash verification/owners/threat_ip_reputation/verify.sh"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "if": "inputs.mode != 'source-check'",
          "with": {
            "go-version": "1.25.7",
            "cache": false
          }
        },
        {
          "name": "Exact candidate and fresh source preflight",
          "id": "audit_source",
          "if": "inputs.mode == 'audit-once'",
          "timeout-minutes": 8,
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "AUDIT_SOURCE_COMMIT": "${{ inputs.source_commit }}"
          },
          "run": "gh run download 44643126816 --repo zkasuran/telegraph-catalog-miners --name threat-ip-development --dir \"$RUNNER_TEMP/threat-ip-audit-candidate\" && python3 -W error verification/owners/threat_ip_reputation/learn/audit_source.py --commit \"$AUDIT_SOURCE_COMMIT\" --out \"$RUNNER_TEMP/threat-ip-independent-audit/source-capture\" --lock verification/owners/threat_ip_reputation/learn/candidate-lock.json --base-source verification/owners/threat_ip_reputation/learn/audit-base --development verification/owners/threat_ip_reputation/learn/data-v2/train.jsonl verification/owners/threat_ip_reputation/learn/data-v2/validation.jsonl && python3 -c 'import json,os; p=os.environ[\"RUNNER_TEMP\"]+\"/threat-ip-independent-audit/source-capture/source-preflight.json\"; print(\"ready=\"+str(json.load(open(p))[\"status\"]==\"AUDIT_SOURCE_READY\").lower())' >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Install exact audited CPU dependencies",
          "if": "inputs.mode != 'serve' && (inputs.mode != 'audit-once' || steps.audit_source.outputs.ready == 'true')",
          "timeout-minutes": 20,
          "run": "python3 -m venv \"$RUNNER_TEMP/threat-ip-venv\" && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/threat_ip_reputation/learn/requirements.lock && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -m pip check && \"$RUNNER_TEMP/threat-ip-venv/bin/python\" verification/owners/threat_ip_reputation/learn/audit.py --lock verification/owners/threat_ip_reputation/learn/requirements.lock --out \"$RUNNER_TEMP/threat-ip-audit-requirements.txt\" --report \"$RUNNER_TEMP/threat-ip-audit.json\""
        },
        {
          "name": "Actual bounded training, parser and reference engine",
          "if": "inputs.mode == 'train-development' || inputs.mode == 'train-variant2' || inputs.mode == 'continue-variant2'",
          "timeout-minutes": 295,
          "run": "VARIANT=original; WARM=; if [ \"${{ inputs.mode }}\" = train-variant2 ]; then VARIANT=compact-elapsed-v2; fi; if [ \"${{ inputs.mode }}\" = continue-variant2 ]; then VARIANT=compact-elapsed-v2-continued; gh run download 44622772244 --repo zkasuran/telegraph-catalog-miners --name threat-ip-development --dir \"$RUNNER_TEMP/threat-ip-parent\"; WARM=\"--warm-start $RUNNER_TEMP/threat-ip-parent/THREAT_IP_REPUTATION.safetensors\"; fi; timeout --signal=TERM --kill-after=15s 17400 \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -W error verification/owners/threat_ip_reputation/learn/remote.py --root \"$RUNNER_TEMP/threat-ip-learner\" --variant \"$VARIANT\" $WARM",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Retain exact licensed candidate and failure evidence",
          "if": "always() && (inputs.mode == 'train-development' || inputs.mode == 'train-variant2' || inputs.mode == 'continue-variant2')",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "threat-ip-development",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/threat-ip-learner/candidate-report.json\n${{ runner.temp }}/threat-ip-learner/training-data-gate.json\n${{ runner.temp }}/threat-ip-learner/tokenizer-check.json\n${{ runner.temp }}/threat-ip-learner/frozen-controls.json\n${{ runner.temp }}/threat-ip-learner/package-manifest.json\n${{ runner.temp }}/threat-ip-learner/runtime-proof.json\n${{ runner.temp }}/threat-ip-learner/reference-engine.log\n${{ runner.temp }}/threat-ip-learner/THREAT_IP_REPUTATION.safetensors\n${{ runner.temp }}/threat-ip-learner/untrained.safetensors\n${{ runner.temp }}/threat-ip-learner/parser-result.json\n${{ runner.temp }}/threat-ip-learner/warm-start-proof.json"
          }
        },
        {
          "name": "Download exact licensed failed checkpoints",
          "if": "inputs.mode == 'replay-runtime'",
          "timeout-minutes": 5,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh run download 44586142914 --repo zkasuran/telegraph-catalog-miners --name threat-ip-development --dir \"$RUNNER_TEMP/threat-ip-original\""
        },
        {
          "name": "Actual parser and reference recovery without retraining",
          "if": "inputs.mode == 'replay-runtime'",
          "timeout-minutes": 90,
          "run": "timeout --signal=TERM --kill-after=15s 5300 \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -W error verification/owners/threat_ip_reputation/learn/replay.py --root \"$RUNNER_TEMP/threat-ip-recovery\" --input \"$RUNNER_TEMP/threat-ip-original\""
        },
        {
          "name": "Preserve recovery identity and genuine failure",
          "if": "always() && inputs.mode == 'replay-runtime'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "threat-ip-runtime-recovery",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/threat-ip-recovery/*.json\n${{ runner.temp }}/threat-ip-recovery/*.log\n${{ runner.temp }}/threat-ip-recovery/*.safetensors"
          }
        },
        {
          "name": "Actual independent frozen reference-engine audit",
          "if": "inputs.mode == 'audit-once' && steps.audit_source.outputs.ready == 'true'",
          "timeout-minutes": 295,
          "run": "timeout --signal=TERM --kill-after=15s 17400 \"$RUNNER_TEMP/threat-ip-venv/bin/python\" -W error verification/owners/threat_ip_reputation/learn/remote_audit.py --root \"$RUNNER_TEMP/threat-ip-independent-audit\" --candidate \"$RUNNER_TEMP/threat-ip-audit-candidate\""
        },
        {
          "name": "Retain actual audit or source blocker evidence",
          "if": "always() && inputs.mode == 'audit-once'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "threat-ip-independent-audit",
            "retention-days": 7,
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/threat-ip-independent-audit/source-capture/receipt.json\n${{ runner.temp }}/threat-ip-independent-audit/source-capture/source-preflight.json\n${{ runner.temp }}/threat-ip-independent-audit/source-capture/tree.json\n${{ runner.temp }}/threat-ip-independent-audit/audit-started.json\n${{ runner.temp }}/threat-ip-independent-audit/audit.jsonl\n${{ runner.temp }}/threat-ip-independent-audit/registration-ready.json\n${{ runner.temp }}/threat-ip-independent-audit/trained-parser.json\n${{ runner.temp }}/threat-ip-independent-audit/untrained-parser.json\n${{ runner.temp }}/threat-ip-independent-audit/trained-runtime.json\n${{ runner.temp }}/threat-ip-independent-audit/untrained-runtime.json\n${{ runner.temp }}/threat-ip-independent-audit/trained-engine.log\n${{ runner.temp }}/threat-ip-independent-audit/untrained-engine.log\n${{ runner.temp }}/threat-ip-independent-audit/live-class-proof.json\n${{ runner.temp }}/threat-ip-independent-audit/THREAT_IP_REPUTATION.safetensors\n${{ runner.temp }}/threat-ip-independent-audit/source-capture/entity-history/**"
          }
        },
        {
          "name": "Prepare exact passing audited reference executor and public lease",
          "if": "inputs.mode == 'serve'",
          "timeout-minutes": 25,
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "AUDIT_RUN_ID": "${{ inputs.audit_run_id }}",
            "REPORT_SHA256": "${{ inputs.report_sha256 }}",
            "RESERVED_SLOT": "${{ inputs.slot }}",
            "FORWARD_PORT": "${{ inputs.forward_port }}",
            "RUNNABLE_URL": "${{ inputs.runnable_url }}"
          },
          "run": "[[ \"$AUDIT_RUN_ID\" =~ ^[1-9][0-9]*$ ]] && gh run download \"$AUDIT_RUN_ID\" --repo zkasuran/telegraph-catalog-miners --name threat-ip-independent-audit --dir \"$RUNNER_TEMP/threat-ip-audit-result\" && python3 -c 'import json,os; r=json.load(open(os.environ[\"RUNNER_TEMP\"]+\"/threat-ip-audit-result/registration-ready.json\")); v={\"family\":\"THREAT_IP_REPUTATION\",\"package_keccak\":r[\"package_keccak\"],\"slot\":int(os.environ[\"RESERVED_SLOT\"]),\"forward_port\":int(os.environ[\"FORWARD_PORT\"]),\"runnable_url\":os.environ[\"RUNNABLE_URL\"],\"ssh_host\":\"98.95.110.88\",\"ssh_user\":\"telegraph-verify\"}; json.dump(v,open(os.environ[\"RUNNER_TEMP\"]+\"/threat-ip-reservation.json\",\"w\"))' && timeout --signal=TERM --kill-after=15s 1400 python3 -W error verification/owners/threat_ip_reputation/learn/serving.py --mode prepare --root \"$RUNNER_TEMP/threat-ip-serving\" --audit \"$RUNNER_TEMP/threat-ip-audit-result\" --reservation \"$RUNNER_TEMP/threat-ip-reservation.json\" --report-sha256 \"$REPORT_SHA256\""
        },
        {
          "name": "Upload ONLY the verified restricted public lease",
          "if": "inputs.mode == 'serve'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "threat-ip-serving-lease",
            "if-no-files-found": "error",
            "retention-days": 1,
            "path": "${{ runner.temp }}/threat-ip-serving/lease.json"
          }
        },
        {
          "name": "Run identical bounded public reference executor",
          "if": "inputs.mode == 'serve'",
          "timeout-minutes": 295,
          "run": "timeout --signal=TERM --kill-after=15s 17400 python3 -W error verification/owners/threat_ip_reputation/learn/serving.py --mode run --root \"$RUNNER_TEMP/threat-ip-serving\""
        },
        {
          "name": "Remove ONLY this runner ephemeral forwarding key",
          "if": "always() && inputs.mode == 'serve'",
          "run": "python3 -W error verification/owners/threat_ip_reputation/learn/serving.py --mode cleanup --root \"$RUNNER_TEMP/threat-ip-serving\""
        }
      ]
    }
  }
}
