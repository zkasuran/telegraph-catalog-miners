version: "1"
kind: miner
id: 78466
slug: zk-routefine
protocol: generic
name: RouteFine Verified Ethereum Routing
description: >
  Keyless block-pinned quotes for exactly 1 ETH into Ethereum USDC. Compares
  ten Uniswap V2/V3, Pancake V3 and Sushi V2 direct pools, DAI/USDT hub routes,
  and sparse 0.05-ETH split allocations. Refines three low-fee V3 direct curves
  and V2 allocations, retaining tenth/quarter sizes elsewhere. Aggregates shared hub input before its final
  swap. Returns maximum gross output in a bounded search, integer USDC base
  units and independently reproducible pool evidence; network gas excluded.
base_url: https://telegraph-s2-routefine.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: This miner conservatively caps node traffic at 200 calls per day.
    property: rate
    value_num: 200
    window_seconds: 86400
  - code: MAX_PARAM_SIZE
    message: Fixed ETH/USDC enum only, at most 32 bytes.
    param: pair
    property: size_bytes
    value_bytes: 32
    operator: lte
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >
      Sell exactly 1000000000000000000 wei ETH for Ethereum mainnet USDC;
      send pair=ETH/USDC. amount_out is integer USDC base units, 1000000 per
      USDC. Includes pool fees and price impact, excludes network gas. Compares
      ten direct pools, Uniswap DAI/USDT two-hop paths and sparse 0.05-ETH splits with
      combined shared-hub inputs. ETH wraps to WETH 1:1. Bare /route and
      literal {pair} query probes use this fixed canonical trade.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Fixed ETH/USDC enum; exactly 1 ETH on Ethereum mainnet.
            accepted_fields:
              - value: ETH/USDC
                intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
                description: Exactly 1 ETH into Ethereum USDC.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair:
      type: string
      enum: [ETH/USDC]
      maxLength: 32
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    amount_out:
      type: integer
      minimum: 100000000
      maximum: 100000000000
      description: USDC base units; 1000000 base units equal 1 USDC.
    status: {type: string, enum: [ok, unavailable]}
    summary: {type: string}
    source: {type: [string, "null"]}
    as_of: {type: [string, "null"]}
    observed_at: {type: string}
    readings: {type: object}
    error: {type: object}
  allOf:
    - if:
        properties:
          status: {const: ok}
      then:
        required: [amount_out, readings, observed_at]
semantics:
  signal_mapping:
    label_field: summary
    reason_field: summary
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve ETH/USDC exactly; amount and Ethereum chain are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
