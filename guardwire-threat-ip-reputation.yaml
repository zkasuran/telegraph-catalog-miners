version: "1"
kind: miner
id: 7355
slug: guardwire-threat-ip-reputation
protocol: generic
name: GuardWire Threat IP Reputation
description: >
  Whether an IP address has an adverse reputation, read live at request time. It checks the address
  against the Spamhaus DROP and ASN-DROP lists, the netblocks and networks Spamhaus rates as hijacked
  or criminal-controlled, then adds the network context an IP reputation question wants (the origin AS
  and operator, the BGP prefix and the registry country) from Team Cymru IP-to-ASN over DNS. Absence
  from DROP is stated as that, not as a clean bill of health. Answers the THREAT_IP_REPUTATION intent.
  No API key. The Spamhaus lists are free to use including commercially with attribution, which travels
  in every answer.
base_url: https://telegraph-guard.margyn.workers.dev

docs:
  documentation: https://telegraph-guard.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: ip is an IPv4 or IPv6 address such as 8.8.8.8. A whole question is accepted too, the address is read from it.
    param: ip
    property: length
    value_num: 64
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Does 185.220.101.1 have a bad
        reputation?". The miner reads the IP address from it.
    ip:
      type: string
      description: The IP address to check, for example 8.8.8.8.

output_schema:
  type: object
  properties:
    ip:
      type: string
      description: The IP address the answer refers to.
    listed:
      type: boolean
      description: Whether the address is on a Spamhaus do-not-route list. Null when the lists were unavailable.
    risk:
      type: string
      description: Risk band in words, high when listed, low when not listed, none for a special-use address, unknown when unavailable.
    lists:
      type: array
      description: Which lists the address is on, with the netblock or ASN that matched.
    sbl_reference:
      type: string
      description: The Spamhaus Block List reference for a DROP match, when present.
    asn:
      type: integer
      description: The origin autonomous system number.
    as_name:
      type: string
      description: The operator name of the origin AS.
    bgp_prefix:
      type: string
      description: The BGP prefix the address is announced in.
    registry_country:
      type: string
      description: The registry country code for the address.
    hostname:
      type: string
      description: The reverse-DNS name of the address, when it has one.
    confidence:
      type: number
      description: 0.95 for a listing, 0.85 for not listed, 0.4 when the lists were unavailable.
    summary:
      type: string
      description: One answer with the reputation verdict and the network context behind it.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /ip-reputation
    external_path: /ip-reputation
    method: GET
    description: >
      Reputation for one IP address, the address as a query parameter (?ip=8.8.8.8). Also accepts a
      whole question in ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - THREAT_IP_REPUTATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: ip
        description: The IP address the answer refers to.
        source_path: ip
      - index: 1
        name: risk
        description: Risk band in words, high, low, none or unknown.
        source_path: risk
      - index: 2
        name: summary
        description: One answer with the reputation verdict and the network context behind it.
        source_path: summary
    integers:
      - index: 0
        name: asn
        description: The origin autonomous system number.
        source_path: asn
        multiplier: 1
  request:
    - endpoint: ip-reputation
      method: GET
      query_params:
        ip: { source: strings.0 }
