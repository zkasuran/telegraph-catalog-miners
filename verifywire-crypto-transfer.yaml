version: "1"
kind: miner
id: 7374
slug: verifywire-crypto-transfer
protocol: generic
name: VerifyWire Crypto Transfer Verify
description: >
  Verifies an on-chain transaction from its hash and covers what the intent asks: the status,
  the gas fee burned under EIP-1559, the sender and recipient, plus the block confirmations.
  Read live from the transaction, its receipt and the block over public RPC. When the caller
  does not name a chain the hash is probed across Ethereum, Base, Arbitrum, Optimism and
  Polygon and answered for whichever holds it. Answers the CRYPTO_TRANSFER_VERIFY intent. No
  API key, nothing cached that can go stale.
base_url: https://telegraph-verify.margyn.workers.dev

docs:
  documentation: https://telegraph-verify.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: hash is a 66 character transaction hash (0x and 64 hex). chain is optional, one of ethereum, base, arbitrum, optimism, polygon; omit it to auto-detect.
    param: hash
    property: length
    value_num: 66
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "Is transaction 0xabc...
        confirmed and how much gas did it burn?". The miner reads the hash and any chain from
        it, so passing the whole question works as well as the structured fields.
    hash:
      type: string
      description: Transaction hash, 0x followed by 64 hex characters.
    chain:
      type: string
      description: Optional chain to look on. Omit to auto-detect.

output_schema:
  type: object
  properties:
    hash:
      type: string
      description: The transaction hash the answer is for.
    chain:
      type: string
      description: Chain the transaction was found on.
    chain_id:
      type: integer
      description: EVM chain id.
    status:
      type: string
      description: success, failed or pending.
    from:
      type: string
      description: Sender address.
    to:
      type: string
      description: Recipient address, null for a contract creation.
    block_number:
      type: integer
      description: Block the transaction was mined in.
    confirmations:
      type: integer
      description: Blocks mined since, from the current head.
    gas_used:
      type: integer
      description: Gas the transaction consumed.
    gas_burned_wei:
      type: string
      description: Base fee burned, base fee per gas times gas used, in wei.
    fee_wei:
      type: string
      description: Total fee, effective gas price times gas used, in wei.
    confidence:
      type: number
      description: 0.98 for a mined transaction, 0.9 while pending.
    summary:
      type: string
      description: One sentence with status, parties, block, confirmations and gas burn.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /transfer
    external_path: /transfer
    method: GET
    description: >
      Verify one transaction, hash as a query parameter (?hash=0x...&chain=base). Chain is
      optional and auto-detected when omitted. A whole question is accepted in ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CRYPTO_TRANSFER_VERIFY

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: hash
        description: The transaction hash the answer is for.
        source_path: hash
      - index: 1
        name: status
        description: success, failed or pending.
        source_path: status
      - index: 2
        name: summary
        description: One sentence with status, parties, block, confirmations and gas burn.
        source_path: summary
    integers:
      - index: 0
        name: block_number
        description: Block the transaction was mined in.
        source_path: block_number
        multiplier: 1
      - index: 1
        name: confirmations
        description: Blocks mined since, from the current head.
        source_path: confirmations
        multiplier: 1
  request:
    - endpoint: transfer
      method: GET
      query_params:
        hash: { source: strings.0 }
