version: "1"
kind: miner
id: 7431
slug: codewire-code-generation
protocol: generic
name: CodeWire Code Generation
description: >
  CODE_GENERATION answers that write working code for a request, produced by a language model at request time. Send the request as the spec parameter or pass the whole question. The miner returns one sentence saying what the code does then the complete code in a single fenced block, implementing every requirement the request names.

  The answer is produced with MiniMax under a commercial plan held by the operator, so this miner is not keyless. Serves the CODE_GENERATION intent.
base_url: https://telegraph-code.margyn.workers.dev

docs:
  documentation: https://telegraph-code.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: spec is the input to work on. A single request, not a batch.
    param: spec
    property: length
    value_num: 12000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim. The miner reads the input from it, so passing the
        whole question works as well as passing the input on its own.
    spec:
      type: string
      description: The coding request, if supplied on its own, for example 'a Python function that reverses a linked list'.
    requirements:
      type: string
      description: The requirements to implement, an alternative name for the request.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the answer, a short label for a reader.
    summary:
      type: string
      description: The CODE_GENERATION answer the node grades.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /code-gen
    external_path: /code-gen
    method: GET
    description: >
      Answer one request, the input as a query parameter (?spec=...). Also accepts the whole question in
      ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CODE_GENERATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the answer.
        source_path: headline
      - index: 1
        name: summary
        description: The CODE_GENERATION answer.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: code-gen
      method: GET
      query_params:
        spec: { source: strings.1 }
