version: "1"
kind: miner
id: 731091
slug: zk-wh-stock
protocol: generic
name: ZK Mesa Warehouse Stock
description: >-
  Real City of Mesa municipal warehouse stock counts by stock ID and warehouse.
  Latest published monthly reporting period, not real-time retailer availability.
  Covers Mesa CENTRAL and EAST only; unsupported locations fail explicitly.
base_url: https://telegraph-s2-wh-stock.margyn.workers.dev
auth:
  type: none
endpoints:
  - path: /inventory
    external_path: /inventory
    method: GET
    description: >-
      Return the latest published City of Mesa warehouse on-hand stock quantity.
      sku is the actual stock ID (e.g. 00514-380 or 00514380), its source-format
      spaced equivalent, or an exact unambiguous source item description.
      warehouse must identify Mesa:CENTRAL or Mesa:EAST (CENTRAL and EAST also
      accepted). The as_of is a UTC-normalized reporting-month label, not the
      exact physical reading time. Unknown, conflicting, or stale records fail.
    intents: [WAREHOUSE_INVENTORY_GENERAL]
    params:
      query:
        required:
          - name: sku
            type: string
            intents: [WAREHOUSE_INVENTORY_GENERAL]
            description: City of Mesa stock ID or exact source item description; preserve leading zeros.
          - name: warehouse
            type: string
            intents: [WAREHOUSE_INVENTORY_GENERAL]
            description: "Mesa:CENTRAL or Mesa:EAST; do not substitute a different warehouse."
intent_mapping:
  WAREHOUSE_INVENTORY_GENERAL:
    endpoint: /inventory
    input:
      sku:
        from: sku
        how: Preserve the City of Mesa stock identifier and leading zeros; an exact source item description also works.
      warehouse:
        from: warehouse
        how: Preserve the requested warehouse. Mesa CENTRAL and Mesa EAST are covered; never invent a substitute location.
    output:
      sku:
        path: sku
      warehouse:
        path: warehouse
      quantity:
        path: quantity
        unit: units
      as_of:
        path: as_of
        how: Source reporting-month label normalized to UTC; exact physical inventory-reading timestamp is unavailable.
semantics:
  signal_mapping:
    label_field: quantity
    reason_field: summary
  supported_intents: [WAREHOUSE_INVENTORY_GENERAL]
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
cache_ttl_sec: 60
rate_limit_per_sec: 2
circuit_threshold: 5
circuit_cooldown_seconds: 30
docs:
  website: https://citydata.mesaaz.gov/d/ghh3-25pq
  documentation: https://data.mesaaz.gov/stories/s/2dcd-j2nx/
