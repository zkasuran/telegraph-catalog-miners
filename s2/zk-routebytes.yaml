version: '1'
kind: miner
id: 78476
slug: zk-routebytes
protocol: generic
name: RouteBytes Verified Execution Plans
description: >-
  Exactly 1 ETH to Ethereum USDC: block-hash-pinned Uniswap V2/V3/V4,
  Pancake V3 and Sushi V2 bounded route/split search. Two public RPC
  operators reproduce all 416 results. Atomic inline proofs retain plain
  bytes across requests, fixing request-scoped stream reuse. Exact input
  allocations, fees and conditional extra-cost plan; gross quotes before gas.
base_url: https://telegraph-s2-routebytes.margyn.workers.dev
auth: {type: none}
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: Conservative operating cap of 200 node calls per day.
    property: rate
    value_num: 200
    window_seconds: 86400
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >-
      Sell exactly 1000000000000000000 wei ETH on Ethereum into USDC;
      send pair=ETH/USDC. amount_out is integer USDC base units, 1000000
      per USDC. Exact allocations, token paths, fees, wrapping and conditional
      cost decision. Pool fees and impact included; network gas unmeasured.
      Bounded gross maximum. Bare path and literal {pair} quote the fixed trade.
      Optional amount is exact input size: at most 100 ETH/WETH or 10 WBTC.
      BTC alias means WBTC held on Ethereum, excluding native Bitcoin/bridges.
      Canonical requests always fix amount=1. Header X-Telegraph-Evidence:
      inline is optional audit mode, not required for normal JSON answers.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Canonical ETH/USDC. Optional API also accepts WETH/USDC, WBTC/USDC and BTC/USDC (WBTC on Ethereum).
        optional:
          - name: amount
            type: number
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Exact positive input-token size, default 1; no exponent notation. Maximum 100 ETH/WETH or 10 WBTC.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair: {type: string, enum: [ETH/USDC, WETH/USDC, WBTC/USDC, BTC/USDC], maxLength: 32}
    amount: {type: number, exclusiveMinimum: 0, maximum: 100}
  allOf:
    - if:
        properties: {pair: {enum: [WBTC/USDC, BTC/USDC]}}
      then:
        properties: {amount: {maximum: 10}}
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    status: {type: string, enum: [ok, unavailable]}
    amount_out: {type: integer, minimum: 1, maximum: 9007199254740991}
    answer: {type: string}
    summary: {type: string}
    source: {type: [string, 'null']}
    as_of: {type: [string, 'null']}
    block_number: {type: integer}
    block_hash: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}
    confirmed_sources:
      type: array
      items: {type: string}
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path: {type: string}
    source_evidence: {type: object}
    error: {type: object}
  allOf:
    - if:
        properties: {status: {const: ok}}
      then:
        required: [amount_out, answer, block_number, block_hash, confirmed_sources, evidence_path]
      else:
        not: {required: [amount_out]}
semantics:
  signal_mapping: {label_field: answer, reason_field: summary}
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair: {from: pair, how: Preserve canonical ETH/USDC exactly.}
      amount: {from: const, value: 1}
    output:
      amount_out: {path: amount_out, unit: 'USDC base units (6 decimals)'}
