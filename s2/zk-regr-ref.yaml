version: "1"
kind: miner
id: 77311911
slug: zk-regr-ref
protocol: generic
name: CodeWire Public Change CI Evidence
description: >-
  Source-bound GitHub Actions evidence for an exact public run, job, check, commit
  or pull request. PR heads and commit identities are resolved from publisher
  records. Complete passing CI supports only a scoped pass, never general absence
  of regressions. Failed or incomplete CI is inconclusive without a comparable
  baseline. Inline diffs and arbitrary code are unsupported.
base_url: https://telegraph-code.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30
endpoints:
  - path: /regression-verify
    external_path: /regression-verify
    method: GET
    intents: [REGRESSION_VERIFY_GENERAL]
    description: >-
      Preserve change verbatim. Accept one public GitHub Actions run, job or
      Actions-backed check URL, commit URL, PR URL, or owner/repo@commit reference.
      Preserve explicit run attempts. Commit/PR evidence covers every Actions run
      shown in the exact-commit checks index, up to eight runs and below the
      publisher's 25-suite cap, with complete attempt-bound jobs. External checks
      and merge-commit tests are excluded. Scoped passes expose regression_found=false;
      other CI outcomes omit that boolean and return verdict=inconclusive.
      Coverage-limited commit/PR responses may retain partial evidence with HTTP 200
      and an inconclusive verdict. Source/identity errors use non-200 status.
    params:
      query:
        required:
          - name: change
            type: string
            intents: [REGRESSION_VERIFY_GENERAL]
            description: Exact public GitHub change/CI reference; one target, at most 20000 Unicode characters.
input_schema:
  type: object
  required: [change]
  properties:
    change: {type: string, minLength: 1, maxLength: 20000}
output_schema:
  type: object
  required: [verdict, summary]
  properties:
    regression_found:
      type: boolean
      description: False only for a complete scoped CI pass; omitted for inconclusive evidence.
    verdict: {type: string, enum: [pass, inconclusive]}
    failing_tests:
      type: array
      description: No test is labelled newly regressed without comparable before/after evidence.
    summary: {type: string}
    checks: {type: array}
    evidence: {type: array}
semantics:
  signal_mapping: {label_field: verdict, reason_field: summary}
  supported_intents: [REGRESSION_VERIFY_GENERAL]
intent_mapping:
  REGRESSION_VERIFY_GENERAL:
    endpoint: /regression-verify
    input:
      change:
        from: change
        how: Preserve the entire supplied target and explicit attempt. Never invent or substitute a reference.
    output:
      regression_found: {path: regression_found}
      verdict: {path: verdict}
      failing_tests: {path: failing_tests}
      summary: {path: summary}
