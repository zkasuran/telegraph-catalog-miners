name: Evaluator registration integration test
run-name: Verify evaluator registration ${{ inputs.batch }}
on:
  workflow_dispatch:
    inputs:
      family:
        description: Exact champion family or all
        type: choice
        default: all
        options:
          - all
          - CODE_REVIEW
          - CONTRACT_OBLIGATION_AUDIT
          - CUSTOMER_TICKET_RESOLUTION
          - EMAIL_SECURITY
          - OPTIMAL_EXECUTION_ROUTE
          - QUESTION_ANSWERING
          - SANCTIONS_SCREENING_MATCH
          - SECURITY_REVIEW
          - TASK_EXECUTION_QUALITY
          - THREAT_INTELLIGENCE
          - URL_SCAN
          - VULNERABILITY_TRIAGE
          - WASH_TRADING_DETECTION
      batch:
        description: Coordinator verification batch identifier
        type: string
        required: true
      continuation:
        description: Continue tests for already registered pending candidates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_candidates: ${{ steps.matrix.outputs.has_candidates }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: verification
          sparse-checkout-cone-mode: false
      - name: Verification harness checks
        run: bash verification/verify.sh
      - id: matrix
        env:
          REQUESTED_FAMILY: ${{ inputs.family }}
          CONTINUE_PENDING: ${{ inputs.continuation }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          rows = json.load(open('verification/champions.json'))['rows']
          requested = os.environ['REQUESTED_FAMILY']
          selected = rows if requested == 'all' else [r for r in rows if r['family'] == requested]
          if not selected:
              raise SystemExit('Unknown champion family')
          matrix=[]
          for row in selected:
              existing=0
              if os.environ['CONTINUE_PENDING']=='true':
                  request=urllib.request.Request('https://devnode.telegraphprotocol.com/api/wasm?intent='+row['family'], headers={'User-Agent':'Telegraph-evaluator-integration/1.0'})
                  data=json.load(urllib.request.urlopen(request,timeout=30))
                  entries=(data.get('intents',{}).get(row['family']) or {}).get('entries',[])
                  matches=[e for e in entries if e.get('author_address','').lower()=='0x8b224783fe5b3c52b7db0cb9b1754f8812b75287' and e.get('wasm_hash','').removeprefix('0x')==row['keccak'] and e.get('activation_status')=='pending']
                  if not matches:
                      continue
                  existing=matches[-1]['registration_id']
              matrix.append({'family':row['family'],'existing':existing})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': matrix}) + '\n')
              out.write('has_candidates=' + ('true' if matrix else 'false') + '\n')
          PY
  verify:
    needs: prepare
    if: needs.prepare.outputs.has_candidates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VERIFY_BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            /verification/*
            !/verification/packages/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Prepare exact package and reference runtime
        env:
          FAMILY: ${{ matrix.family }}
          EXISTING: ${{ matrix.existing }}
        run: python3 verification/prepare.py --family "$FAMILY" --existing "$EXISTING"
      - name: Publish restricted-forward request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lease-${{ matrix.family }}
          path: ${{ runner.temp }}/telegraph-evaluator/lease.json
          retention-days: 1
      - name: Run bounded registration integration test
        run: python3 verification/serve.py
      - name: Save final decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdict-${{ matrix.family }}
          path: ${{ runner.temp }}/telegraph-evaluator/verdict.json
          retention-days: 1
      - name: Save score reproduction proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproduction-${{ matrix.family }}
          path: ${{ runner.temp }}/telegraph-evaluator/reproduction.json
          retention-days: 1
