# Passing v3 artifact binds audit run 44723258067 and executor source bb1eb538a4308956bf5b27eac952d5487c985de6.
# Serving that artifact dispatches the audited source, not a changed executor.
name: Sentiment owner qualification
run-name: Sentiment owner ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: audit
        options: [audit, serve, retrain, retrain_v3, endpoint_recovery]
      lease_epoch:
        description: Durable same-package bounded lease generation
        type: string
        default: initial
      registration_id:
        description: Existing exact registration for lease continuation, zero before initial registration
        type: string
        default: '0'
      audit_run_id:
        type: string
        default: '0'
      report_sha256:
        type: string
        default: ''
      package_url:
        description: Exact immutable licensed package from the successful audit
        type: string
        default: ''
      package_sha256:
        type: string
        default: ''
      package_keccak:
        type: string
        default: ''
      slot:
        type: string
        default: '0'
      forward_port:
        type: string
        default: '0'
      runnable_url:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-sentiment-analysis-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  frozen:
    if: github.repository == 'zkasuran/telegraph-catalog-miners' && (inputs.mode == 'audit' || inputs.mode == 'serve' || inputs.mode == 'endpoint_recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MODE: ${{ inputs.mode }}
      AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
      REPORT_SHA: ${{ inputs.report_sha256 }}
      PACKAGE_URL: ${{ inputs.package_url }}
      PACKAGE_SHA: ${{ inputs.package_sha256 }}
      PACKAGE_KECCAK: ${{ inputs.package_keccak }}
      SLOT: ${{ inputs.slot }}
      FORWARD_PORT: ${{ inputs.forward_port }}
      RUNNABLE_URL: ${{ inputs.runnable_url }}
      LEASE_EPOCH: ${{ inputs.lease_epoch }}
      EXISTING_REGISTRATION: ${{ inputs.registration_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: verification/owners/sentiment_analysis
      - name: Exact packaged source-only gate
        timeout-minutes: 3
        run: bash verification/owners/sentiment_analysis/verify.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Hash-locked CPU environment for authoritative tokenizer
        if: inputs.mode == 'audit' || inputs.mode == 'endpoint_recovery'
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/owner-venv"
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/sentiment_analysis/requirements.lock
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip check
      - name: Frozen source-held-out audit and actual old/new engine reproduction
        if: inputs.mode == 'audit'
        timeout-minutes: 290
        run: timeout --signal=TERM --kill-after=20s 17100 "$RUNNER_TEMP/owner-venv/bin/python" verification/owners/sentiment_analysis/remote.py --root "$RUNNER_TEMP/sentiment-owner"
      - name: Exact fixed-tensor endpoint recovery integration replay
        if: inputs.mode == 'endpoint_recovery'
        timeout-minutes: 290
        run: timeout --signal=TERM --kill-after=20s 17100 "$RUNNER_TEMP/owner-venv/bin/python" verification/owners/sentiment_analysis/endpoint_recovery.py verify --root "$RUNNER_TEMP/sentiment-owner"
      - name: Publish bounded actual audit artifact
        if: always() && (inputs.mode == 'audit' || inputs.mode == 'endpoint_recovery')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-SENTIMENT_ANALYSIS-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sentiment-owner/registration-ready.json
            ${{ runner.temp }}/sentiment-owner/actual-quality.json
            ${{ runner.temp }}/sentiment-owner/byte-preservation.json
            ${{ runner.temp }}/sentiment-owner/data/source-manifest.json
            ${{ runner.temp }}/sentiment-owner/SENTIMENT_ANALYSIS-recovery.safetensors
            ${{ runner.temp }}/sentiment-owner/SENTIMENT_ANALYSIS-endpoint-recovery.safetensors
            ${{ runner.temp }}/sentiment-owner/endpoint-byte-preservation.json
            ${{ runner.temp }}/sentiment-owner/audit-score-bits.json
            ${{ runner.temp }}/sentiment-owner/failure.json
      - name: Fetch the real completed audit report with a step-scoped token
        if: inputs.mode == 'serve'
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 verification/owners/sentiment_analysis/fetch_report.py --root "$RUNNER_TEMP/sentiment-owner" --audit-run-id "$AUDIT_RUN_ID" --report-sha256 "$REPORT_SHA"
      - name: Prepare exact passing model and restricted public lease
        if: inputs.mode == 'serve'
        timeout-minutes: 35
        run: python3 verification/owners/sentiment_analysis/serve.py prepare --root "$RUNNER_TEMP/sentiment-owner" --package-url "$PACKAGE_URL" --package-sha256 "$PACKAGE_SHA" --package-keccak "$PACKAGE_KECCAK" --slot "$SLOT" --forward-port "$FORWARD_PORT" --runnable-url "$RUNNABLE_URL" --existing "$EXISTING_REGISTRATION"
      - name: Upload only the restricted public lease
        if: inputs.mode == 'serve'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lease-SENTIMENT_ANALYSIS-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/sentiment-owner/lease.json
      - name: Keep the exact actual reference executor served
        if: inputs.mode == 'serve'
        timeout-minutes: 305
        run: timeout --signal=TERM --kill-after=20s 18120 python3 verification/owners/sentiment_analysis/serve.py run --root "$RUNNER_TEMP/sentiment-owner"
  train:
    if: github.repository == 'zkasuran/telegraph-catalog-miners' && (inputs.mode == 'retrain' || inputs.mode == 'retrain_v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: verification/owners/sentiment_analysis
      - name: Exact source-only gate
        timeout-minutes: 3
        run: bash verification/owners/sentiment_analysis/verify.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Hash-locked public CPU training environment
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/owner-venv"
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/sentiment_analysis/requirements.lock
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip check
      - name: Warm-start source-only fit and frozen validation selection
        timeout-minutes: 310
        run: |
          ENTRY=retrain.py
          if [[ "$MODE" == retrain_v3 ]]; then ENTRY=v3_remote.py; fi
          timeout --signal=TERM --kill-after=20s 18300 "$RUNNER_TEMP/owner-venv/bin/python" "verification/owners/sentiment_analysis/$ENTRY" train --root "$RUNNER_TEMP/sentiment-v2"
      - name: Preserve licensed checkpoint and real selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-SENTIMENT_ANALYSIS-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sentiment-v2/SENTIMENT_ANALYSIS-v2.safetensors
            ${{ runner.temp }}/sentiment-v2/SENTIMENT_ANALYSIS-v3.safetensors
            ${{ runner.temp }}/sentiment-v2/training-frozen.json
            ${{ runner.temp }}/sentiment-v2/dataset-gate.json
            ${{ runner.temp }}/sentiment-v2/validation-history.json
            ${{ runner.temp }}/sentiment-v2/data/source-manifest.json
            ${{ runner.temp }}/sentiment-v2/failure.json
  independent_audit:
    needs: train
    if: github.repository == 'zkasuran/telegraph-catalog-miners' && (inputs.mode == 'retrain' || inputs.mode == 'retrain_v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: verification/owners/sentiment_analysis
      - name: Exact source-only gate
        timeout-minutes: 3
        run: bash verification/owners/sentiment_analysis/verify.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.7'
          cache: false
      - name: Download only this run's frozen training artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frozen-SENTIMENT_ANALYSIS-${{ github.run_id }}
          path: ${{ runner.temp }}/sentiment-v2
      - name: Hash-locked public CPU audit environment
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/owner-venv"
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r verification/owners/sentiment_analysis/requirements.lock
          "$RUNNER_TEMP/owner-venv/bin/python" -m pip check
      - name: New independent source audit and real reference executor
        timeout-minutes: 310
        run: |
          ENTRY=retrain.py
          if [[ "$MODE" == retrain_v3 ]]; then ENTRY=v3_remote.py; fi
          timeout --signal=TERM --kill-after=20s 18300 "$RUNNER_TEMP/owner-venv/bin/python" "verification/owners/sentiment_analysis/$ENTRY" audit --root "$RUNNER_TEMP/sentiment-v2"
      - name: Preserve actual bounded audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-SENTIMENT_ANALYSIS-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sentiment-v2/registration-ready.json
            ${{ runner.temp }}/sentiment-v2/actual-quality.json
            ${{ runner.temp }}/sentiment-v2/audit-score-bits.json
            ${{ runner.temp }}/sentiment-v2/training-frozen.json
            ${{ runner.temp }}/sentiment-v2/SENTIMENT_ANALYSIS-v2.safetensors
            ${{ runner.temp }}/sentiment-v2/SENTIMENT_ANALYSIS-v3.safetensors
            ${{ runner.temp }}/sentiment-v2/data/source-manifest.json
            ${{ runner.temp }}/sentiment-v2/failure.json
