version: "1"
kind: miner
id: 782430
slug: zk-cvrecords
protocol: generic
name: ZK Source Record Verification
description: >
  Keyless source-record verification for DOI/PLOS article titles and official
  Federal Register metadata or quotations. Separately retrieves Crossref and
  publisher records or OFR and GPO records. Returns Inconclusive for unsupported
  claims or unavailable corroboration. Publication is not proof of scientific
  truth, legal compliance, media authenticity or the substance of a quotation.
base_url: https://telegraph-fact.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: MAX_PARAM_VALUE
    message: One source-linked content claim, at most 8000 characters.
    param: content
    property: length
    value_num: 8000
    operator: lte
endpoints:
  - path: /verify
    external_path: /verify
    method: GET
    description: >
      Send canonical content verbatim. Accepts DOI or supported HTTPS source links,
      JSON {doi,title} or {document,title,publication_date,action,quote}, and complete
      sentences such as 'The article at https://doi.org/DOI is titled "TITLE".' or
      'The Federal Register document at URL was published on YYYY-MM-DD.' or
      'The document at URL contains the quotation "PASSAGE".' Unsupported additional
      assertions abstain. A bare source identifies a record and returns Inconclusive.
    intents: [CONTENT_VERIFICATION_GENERAL]
    params:
      query:
        required:
          - name: content
            type: string
            intents: [CONTENT_VERIFICATION_GENERAL]
            description: Complete canonical content input, copied verbatim, at most 8000 characters.
input_schema:
  type: object
  required: [content]
  properties:
    content:
      type: string
      maxLength: 8000
output_schema:
  type: object
  required: [verdict, answer, evidence]
  properties:
    verdict:
      type: string
      enum: [Verified, Unverified, Misleading, False, Inconclusive]
    answer:
      type: string
    evidence:
      type: array
      items:
        type: object
semantics:
  supported_intents: [CONTENT_VERIFICATION_GENERAL]
  signal_mapping:
    label_field: verdict
    reason_field: answer
intent_mapping:
  CONTENT_VERIFICATION_GENERAL:
    endpoint: /verify
    input:
      content:
        from: content
        how: Copy the entire content verbatim; do not infer a new claim or discard clauses.
    output:
      verdict:
        path: verdict
      answer:
        path: answer
      evidence:
        path: evidence
