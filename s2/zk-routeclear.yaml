version: '1'
kind: miner
id: 78478
slug: zk-routeclear
protocol: generic
name: RouteClear Confirmed Execution Decisions
description: >-
  Exactly 1 ETH into Ethereum mainnet USDC. Two public RPC operators match
  484 hash-pinned contract results across a bounded multivenue route search.
  Count-aware direct splits preserve economical lower-swap alternatives.
  Compact answers report exact gross output, fee-adjusted impact and conditional
  extra-cost ceilings; structured plans and original source evidence are available.
base_url: https://telegraph-s2-routeclear.margyn.workers.dev
auth:
  type: none
rate_limit_per_sec: 1
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
limitations:
  - code: ACCOUNT_QUOTA
    message: Conservative cap of 200 node calls per day; free public RPC capacity is best-effort.
    property: rate
    value_num: 200
    window_seconds: 86400
errors:
  message_path: error.message
  code_path: error.code
  status_path: status
  success_values: [ok]
endpoints:
  - path: /route
    external_path: /route
    method: GET
    description: >-
      Quote selling exactly 1000000000000000000 wei ETH on Ethereum mainnet
      into USDC; send pair=ETH/USDC. amount_out is integer USDC base units
      (1000000 per USDC), including pool fees and finite-size impact, before
      actual gas. The answer includes exact allocations, swap fees, marginal
      impact and conditional extra-cost budgets versus simpler routes. Bare
      /route and literal {pair} quote this same fixed trade. Optional audit
      header X-Telegraph-Evidence: inline returns full source evidence.
    intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
    params:
      query:
        required:
          - name: pair
            type: string
            intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
            description: Canonical ETH/USDC only; exactly one ETH on Ethereum, no amount parameter.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair:
      type: string
      enum: [ETH/USDC]
      maxLength: 8
output_schema:
  type: object
  required: [status, summary, source, as_of]
  properties:
    status:
      type: string
      enum: [ok, unavailable]
    amount_out:
      type: integer
      minimum: 100000000
      maximum: 100000000000
    answer:
      type: string
    summary:
      type: string
    source:
      type: [string, 'null']
    as_of:
      type: [string, 'null']
    block_number:
      type: integer
    block_hash:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
    confirmed_sources:
      type: array
      items: {type: string}
      minItems: 2
      maxItems: 2
      uniqueItems: true
    evidence_path:
      type: string
    decision:
      type: object
    source_evidence:
      type: object
    error:
      type: object
  allOf:
    - if:
        properties:
          status: {const: ok}
      then:
        required: [amount_out, answer, block_number, block_hash, confirmed_sources, evidence_path]
      else:
        not:
          required: [amount_out]
semantics:
  signal_mapping:
    label_field: answer
    reason_field: summary
  supported_intents: [OPTIMAL_EXECUTION_ROUTE_GENERAL]
intent_mapping:
  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /route
    input:
      pair:
        from: pair
        how: Preserve canonical ETH/USDC exactly; chain and input amount are fixed.
    output:
      amount_out:
        path: amount_out
        unit: USDC base units (6 decimals)
